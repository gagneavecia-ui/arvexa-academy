<script src="arvexa-modal.js" defer></script>

  <link rel="stylesheet" href="arvexa-ui.css">
  <style>
    /* ============================================================
       ROOT
       ============================================================ */
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --warning: #D4A017;

      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --bg-elevated: rgba(255, 255, 255, 0.02);

      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;

      --border-soft: rgba(255, 255, 255, 0.05);
      --border-gold: rgba(184, 134, 11, 0.15);

      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-fast: all 0.1s ease;
      --radius: 16px;
      --radius-lg: 20px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed; inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(184, 134, 11, .16) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184,134,11,.05) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      padding-top: calc(8px + var(--safe-top));
      background: rgba(var(--rgb-veil), .92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184,134,11,.06);
      gap: 8px;
      min-height: 48px;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    /* ✅ v8.62a — barre du haut unifiée : bouton menu ☰ (remplace le back) */
    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      flex-shrink: 0;
    }
    .menu-toggle:hover {
      border-color: rgba(184,134,11,.2);
      color: var(--accent-bright);
      background: rgba(184,134,11,.04);
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: rgba(184,134,11,.2);
      color: var(--accent-bright);
      background: rgba(184,134,11,.04);
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      font-family: 'Playfair Display', serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-title i {
      color: var(--accent-bright);
      margin-right: 5px;
      font-size: 13px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      /* ✅ v8.22 — rétrécissable : libellé long → retour à la ligne, pas de coupure */
      flex-shrink: 1;
      min-width: 0;
    }

    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      /* ✅ v8.63a — RAD/DEG toujours sur UNE ligne, lettres jamais
         superposées : interdiction de compression et de retour à la ligne */
      flex-shrink: 0;
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(184,134,11,.08);
      border: 1px solid rgba(184,134,11,.15);
      color: var(--accent-bright);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }
    .mode-toggle:hover {
      background: rgba(184,134,11,.15);
      transform: translateY(-1px);
    }
    .mode-toggle i { font-size: 10px; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      border-color: rgba(184,134,11,.2);
      color: var(--accent-bright);
      background: rgba(184,134,11,.04);
    }
    .icon-btn.active {
      background: rgba(184,134,11,.12);
      color: var(--accent-bright);
      border-color: rgba(184,134,11,.25);
    }

    /* ============================================================
       DISPLAY
       ============================================================ */
    .display {
      flex-shrink: 0;
      padding: 12px 16px 14px;
      background: linear-gradient(180deg, rgba(var(--rgb-card), .6) 0%, rgba(var(--rgb-veil), .3) 100%);
      border-bottom: 1px solid rgba(184,134,11,.08);
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
    }

    .display::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--success), var(--accent));
    }

    .display-status {
      position: absolute;
      top: 10px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .display-status .mem-indicator {
      color: var(--accent-bright);
      background: rgba(184,134,11,.12);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 9px;
      display: none;
    }
    .display-status .mem-indicator.visible { display: inline-block; }

    .display-status .paren-indicator {
      color: var(--accent-bright);
      font-size: 11px;
      display: none;
    }
    .display-status .paren-indicator.visible { display: inline-block; }

    .display-expr {
      font-size: 15px;
      color: var(--text-dim);
      text-align: right;
      word-break: break-all;
      line-height: 1.4;
      min-height: 22px;
      max-height: 60px;
      overflow-y: auto;
      padding: 0 4px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .display-expr::-webkit-scrollbar { width: 2px; }
    .display-expr::-webkit-scrollbar-thumb {
      background: rgba(184,134,11,.3);
      border-radius: 8px;
    }

    .display-result {
      font-size: 34px;
      font-weight: 700;
      color: var(--text-light);
      text-align: right;
      font-family: 'Playfair Display', serif;
      line-height: 1.2;
      word-break: break-all;
      min-height: 42px;
      padding: 0 4px;
      transition: font-size 0.15s ease;
    }
    .display-result.error {
      color: var(--danger);
      font-size: 18px;
      font-family: 'Inter', sans-serif;
    }
    .display-result.small { font-size: 24px; }
    .display-result.tiny { font-size: 18px; }

    /* ============================================================
       KEYPAD
       ============================================================ */
    .keypad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 8px 8px;
      min-height: 0;
      overflow: hidden;
    }

    .keypad-row {
      display: grid;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .row-sci { grid-template-columns: repeat(5, 1fr); }
    .row-sci-2 { grid-template-columns: repeat(5, 1fr); }
    .row-main { grid-template-columns: repeat(4, 1fr); }

    .cb {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(var(--rgb-soft), .04);
      background: rgba(var(--rgb-soft), .03);
      color: var(--text-light);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.08s ease, border-color 0.15s ease;
      font-family: 'Inter', sans-serif;
      min-height: 0;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }

    .cb:active {
      transform: scale(0.95);
      background: rgba(var(--rgb-soft), .08);
    }

    .cb:hover {
      border-color: rgba(184,134,11,.2);
      background: rgba(var(--rgb-soft), .05);
    }

    .cb.fn {
      color: var(--accent-bright);
      font-size: 12px;
      font-weight: 600;
      background: rgba(184,134,11,.06);
      border-color: rgba(184,134,11,.1);
    }
    .cb.fn:active { background: rgba(184,134,11,.16); }
    .cb.fn:hover {
      background: rgba(184,134,11,.1);
      border-color: rgba(184,134,11,.25);
    }

    .cb.op {
      color: var(--accent-bright);
      font-size: 20px;
      font-weight: 600;
      background: rgba(184,134,11,.08);
      border-color: rgba(184,134,11,.1);
    }
    .cb.op:active { background: rgba(184,134,11,.18); }
    .cb.op:hover {
      background: rgba(184,134,11,.14);
      border-color: rgba(184,134,11,.25);
    }

    .cb.num {
      font-size: 20px;
      font-weight: 600;
      background: rgba(var(--rgb-soft), .05);
      border-color: rgba(var(--rgb-soft), .06);
    }
    .cb.num:active { background: rgba(var(--rgb-soft), .12); }

    .cb.eq {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--on-gold);
      font-size: 22px;
      font-weight: 800;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(184,134,11,.25);
    }
    .cb.eq:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(184,134,11,.4);
    }
    .cb.eq:hover {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent-bright));
      transform: translateY(-1px);
    }

    .cb.danger { color: var(--danger); font-weight: 700; }
    .cb.danger:active { background: rgba(184,92,58,.15); }
    .cb.danger:hover {
      background: rgba(184,92,58,.1);
      border-color: rgba(184,92,58,.25);
    }

    .cb.clear {
      color: var(--danger-light);
      font-weight: 700;
      font-size: 14px;
    }
    .cb.clear:hover {
      background: rgba(231, 76, 60, 0.1);
      border-color: rgba(231, 76, 60, 0.25);
    }

    .cb sup { font-size: 0.7em; vertical-align: super; }
    .cb sub { font-size: 0.7em; vertical-align: sub; }

    /* ============================================================
       TOOLBAR
       ============================================================ */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 8px 8px;
      padding-bottom: calc(8px + var(--safe-bottom));
      background: rgba(var(--rgb-veil), .92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184,134,11,.08);
    }

    .toolbar-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 10px;
      background: rgba(var(--rgb-soft), .03);
      border: 1px solid rgba(var(--rgb-soft), .05);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }

    .toolbar-btn:hover {
      background: rgba(184,134,11,.08);
      color: var(--accent-bright);
      border-color: rgba(184,134,11,.2);
      transform: translateY(-1px);
    }
    .toolbar-btn:active { transform: scale(0.97); }
    .toolbar-btn i {
      font-size: 13px;
      color: var(--accent-bright);
    }

    /* ============================================================
       MODALES
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      background: var(--bg-surface);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(184,134,11,.15);
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.25,1,0.5,1);
      overflow-y: auto;
      position: relative;
    }

    .modal-overlay.show .modal-sheet {
      transform: translateY(0);
    }

    .modal-sheet::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      border-radius: 8px;
      background: rgba(var(--rgb-soft), 0.15);
      cursor: grab;
      z-index: 10;
      transition: background 0.2s ease, width 0.2s ease;
    }

    .modal-sheet::before:hover {
      background: rgba(224, 184, 74, 0.4);
      width: 50px;
    }

    .modal-sheet.dragging {
      transition: none;
    }

    .modal-sheet.dragging::before {
      background: rgba(224, 184, 74, 0.6);
      cursor: grabbing;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 16px;
      gap: 10px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
      font-family: 'Playfair Display', serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title i { color: var(--accent-bright); }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(var(--rgb-soft), .05);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: var(--transition);
    }
    .modal-close:hover {
      color: var(--text-light);
      border-color: rgba(184,134,11,.25);
      background: rgba(184,134,11,.06);
    }

    /* ============================================================
       HISTORIQUE
       ============================================================ */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(var(--rgb-soft), .02);
      border: 1px solid rgba(var(--rgb-soft), .04);
      cursor: pointer;
      transition: var(--transition);
    }
    .history-item:hover {
      background: rgba(184,134,11,.06);
      border-color: rgba(184,134,11,.15);
      transform: translateX(3px);
    }

    .history-item .h-expr {
      font-size: 12px;
      color: var(--text-muted);
      word-break: break-all;
      margin-bottom: 4px;
    }
    .history-item .h-res {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-bright);
      font-family: 'Playfair Display', serif;
      text-align: right;
    }

    .history-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .history-clear {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      background: rgba(184,92,58,.08);
      border: 1px solid rgba(184,92,58,.15);
      color: var(--danger);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .history-clear:hover {
      background: rgba(184,92,58,.15);
      transform: translateY(-1px);
    }

    /* ============================================================
       CONSTANTES
       ============================================================ */
    .const-search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .const-search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }
    .const-search {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: rgba(var(--rgb-soft), .03);
      color: var(--text-light);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: var(--transition);
    }
    .const-search:focus {
      border-color: rgba(184,134,11,.3);
      background: rgba(184,134,11,.02);
    }
    .const-search::placeholder { color: var(--text-muted); }

    .const-category {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px 0 6px;
      border-bottom: 1px solid rgba(184,134,11,.1);
      margin-bottom: 4px;
    }

    .const-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 55vh;
      overflow-y: auto;
    }

    .const-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      gap: 10px;
    }
    .const-item:hover {
      background: rgba(184,134,11,.06);
      transform: translateX(3px);
    }
    .const-item:active { transform: scale(0.98); }

    .const-item .ci-left { min-width: 0; flex: 1; }
    .const-item .ci-symbol {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-bright);
      font-family: 'Playfair Display', serif;
      line-height: 1.2;
    }
    .const-item .ci-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .const-item .ci-right {
      text-align: right;
      flex-shrink: 0;
    }
    .const-item .ci-value {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }
    .const-item .ci-unit {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ============================================================
       CONVERSIONS
       ============================================================ */
    .conv-cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .conv-cat {
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid rgba(var(--rgb-soft), .05);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }
    .conv-cat:hover {
      color: var(--text-dim);
      border-color: rgba(var(--rgb-soft), .1);
    }
    .conv-cat.active {

<script>
(function(){
  function hideBoot(){
    var el = document.getElementById('bootLoader');
    if (!el || el.dataset.gone === '1') return;
    el.dataset.gone = '1';
    el.classList.add('gone');
    setTimeout(function(){ try { if (el.parentNode) el.parentNode.removeChild(el); } catch (e) {} }, 380);
  }
  window.__arvexaBootHide = hideBoot;
  /* ✅ Position précise : juste sous la barre du haut (mesurée après peinture,
     l'estimation CSS safe-area+70px reste le filet avant mesure). */
  function placeBoot(){
    var el = document.getElementById('bootLoader');
    if (!el) return;
    try {
      var hdr = document.querySelector('header');
      if (hdr) {
        var r = hdr.getBoundingClientRect();
        if (r.height > 20 && r.height < 220) el.style.top = Math.round(r.bottom + 8) + 'px';
      }
    } catch (e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(placeBoot, 0); });
  } else { setTimeout(placeBoot, 0); }
  // Filet de sécurité : jamais plus de 10 s, même si un module échoue.
  setTimeout(hideBoot, 10000);
  // Retour bfcache : la page est déjà prête.
  window.addEventListener('pageshow', function(ev){ if (ev && ev.persisted) hideBoot(); });
})();
</script>

    if (!isFinite(n)) return n > 0 ? '∞' : (n < 0 ? '-∞' : 'Erreur');
    if (isNaN(n)) return 'Erreur';

    const absN = Math.abs(n);
    if (absN !== 0 && (absN >= 1e12 || absN < 1e-6)) {
      return n.toExponential(6).replace('e+', ' × 10^').replace('e-', ' × 10^−');
    }

    const frac = toSimpleFraction(n);
    if (frac) return frac;

    if (Number.isInteger(n)) return n.toLocaleString('fr-FR');

    const rounded = parseFloat(n.toPrecision(10));

  function toSimpleFraction(n) {
    if (!isFinite(n) || Number.isInteger(n)) return null;
    const absN = Math.abs(n);
    if (absN >= 100 || absN < 0.001) return null;

    const denominators = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 16, 20, 25, 50];

    let a = LANCZOS[0];
    const t = x + 7.5;
    for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
    return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
  }

  function factorialVal(n) {
    if (!isFinite(n)) return NaN;
    if (Number.isInteger(n)) {
      if (n < 0) return NaN;
      if (n <= 1) return 1;
      if (n > 170) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }
    const g = gammaFn(n + 1);
    return isFinite(g) ? g : Infinity;
  }

  function fail(message) { throw { arvexa: true, message: message }; }

  const FUNC_NAMES = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'ln', 'log',
    'sqrt', 'cbrt', 'abs', 'exp', 'fact'];

  function tokenizeCalc(src2) {
    const toks = [];
    let i = 0;
    const n = src2.length;
    while (i < n) {
      const ch = src2[i];
      if (ch === ' ' || ch === '\t') { i++; continue; }
      if ((ch >= '0' && ch <= '9') || ch === '.') {
        let j = i, seenDot = false;
        while (j < n && ((src2[j] >= '0' && src2[j] <= '9') || (src2[j] === '.' && !seenDot))) {
          if (src2[j] === '.') seenDot = true;
          j++;
        }
        /* Exposant scientifique : 1e-7 / 2e10 (le « e » doit être suivi de
           chiffres — le bouton « e » d'Euler insère « (E) », aucune ambiguïté). */
        if (j < n && src2[j] === 'e' && j + 1 < n) {
          let k2 = j + 1;
          if (src2[k2] === '+' || src2[k2] === '-') k2++;
          if (src2[k2] >= '0' && src2[k2] <= '9') {
            while (k2 < n && src2[k2] >= '0' && src2[k2] <= '9') k2++;
            j = k2;
          }
        }
        const raw = src2.slice(i, j);
        if (raw === '.' || raw === '') fail('Expression incomplète');
        if (raw.endsWith('.') && src2[j] === '.') fail('Deux points consécutifs');
        toks.push({ t: 'num', v: parseFloat(raw) });
        i = j;
        continue;
      }
      if (/[a-zA-Z]/.test(ch)) {
        let j = i;
        while (j < n && /[a-zA-Z]/.test(src2[j])) j++;
        const name = src2.slice(i, j);
        i = j;
        if (name === 'PI') { toks.push({ t: 'const', v: Math.PI }); continue; }
        if (name === 'E' || name === 'e') { toks.push({ t: 'const', v: Math.E }); continue; }
        if (FUNC_NAMES.indexOf(name) >= 0) {
          if (src2[i] !== '(') fail('Parenthèse attendue après « ' + name + ' »');
          toks.push({ t: 'func', v: name });
          i++; /* consomme « ( » — PAS de token open : le parseur de la
                  fonction consommera lui-même la parenthèse fermante, sinon
                  l'argument avalerait le token SUIVANT la parenthèse. */
          continue;
        }
        fail('Symbole inconnu : ' + name);
      }
      if (src2.startsWith('**', i)) { toks.push({ t: 'pow' }); i += 2; continue; }
      if (ch === '*') { toks.push({ t: 'mul' }); i++; continue; }
      if (ch === '+') { toks.push({ t: 'add' }); i++; continue; }
      if (ch === '-') { toks.push({ t: 'sub' }); i++; continue; }
      if (ch === '/') { toks.push({ t: 'div' }); i++; continue; }
      if (ch === '^') { toks.push({ t: 'pow' }); i++; continue; }
      if (ch === '(') { toks.push({ t: 'open' }); i++; continue; }
      if (ch === ')') { toks.push({ t: 'close' }); i++; continue; }
      if (ch === '!') { toks.push({ t: 'fact' }); i++; continue; }
      fail('Caractère invalide : ' + ch);
    }
    return toks;
  }

  function applyFunc(name, x, isDeg) {
    switch (name) {
      case 'sin': return isDeg ? Math.sin(toRad(x)) : Math.sin(x);
      case 'cos': return isDeg ? Math.cos(toRad(x)) : Math.cos(x);
      case 'tan': {
        if (isDeg) {
          const m2 = ((x % 180) + 180) % 180;
          if (Math.abs(m2 - 90) < 1e-12) fail('Tan indéfinie à 90°');
          return Math.tan(toRad(x));
        }
        const m2 = ((x % Math.PI) + Math.PI) % Math.PI;
        if (Math.abs(m2 - Math.PI / 2) < 1e-12) fail('Tan indéfinie (π/2)');
        return Math.tan(x);
      }
      case 'asin': {
        if (x < -1 || x > 1) fail('sin⁻¹ défini seulement entre -1 et 1');
        return isDeg ? toDeg(Math.asin(x)) : Math.asin(x);
      }
      case 'acos': {
        if (x < -1 || x > 1) fail('cos⁻¹ défini seulement entre -1 et 1');
        return isDeg ? toDeg(Math.acos(x)) : Math.acos(x);
      }
      case 'atan': return isDeg ? toDeg(Math.atan(x)) : Math.atan(x);
      case 'ln': {
        if (x <= 0) fail('ln défini seulement pour x > 0');
        return Math.log(x);
      }
      case 'log': {
        if (x <= 0) fail('log défini seulement pour x > 0');
        return Math.log10(x);
      }
      case 'sqrt': {
        if (x < 0) fail('Racine carrée d\u2019un nombre négatif');
        return Math.sqrt(x);
      }
      case 'cbrt': return Math.cbrt(x);
      case 'abs': return Math.abs(x);
      case 'exp': return Math.exp(x);
      case 'fact': {
        if (Number.isInteger(x) && x < 0) fail('Factorielle d\u2019un entier négatif');
        const r = factorialVal(x);
        if (isNaN(r)) fail('Factorielle non définie');
        return r;
      }
    }
    fail('Fonction inconnue');
  }

  function evalCalc(src2, isDeg) {
    const toks = tokenizeCalc(String(src2));
    if (!toks.length) fail('Expression vide');
    let pos = 0;
    const peek = () => toks[pos];
    const next = () => toks[pos++];
    const startsPrimary = (tk) => tk && (tk.t === 'num' || tk.t === 'const' || tk.t === 'func' || tk.t === 'open');

    function parseExpr() {
      let v = parseTerm();
      for (;;) {
        const tk = peek();
        if (tk && tk.t === 'add') { next(); v = v + parseTerm(); }
        else if (tk && tk.t === 'sub') { next(); v = v - parseTerm(); }
        else return v;
      }
    }
    function parseTerm() {
      let v = parseUnary();
      for (;;) {
        const tk = peek();
        if (tk && tk.t === 'mul') { next(); v = v * parseUnary(); }
        else if (tk && tk.t === 'div') {
          next();
          const d = parseUnary();
          if (d === 0) fail('Division par zéro');
          v = v / d;
        }
        else if (startsPrimary(tk)) { v = v * parseUnary(); } /* 2(3), 2π, (2)(3), 2sin(30) */
        else return v;
      }
    }
    function parseUnary() {
      const tk = peek();
      if (tk && tk.t === 'sub') { next(); return -parseUnary(); }
      if (tk && tk.t === 'add') { next(); return parseUnary(); }
      return parsePostfix();
    }
    function parsePostfix() {
      let v = parsePrimary();
      for (;;) {
        const tk = peek();
        if (tk && tk.t === 'fact') {
          next();
          if (v < 0 && Number.isInteger(v)) fail('Factorielle d\u2019un entier négatif');
          const r = factorialVal(v);
          if (isNaN(r)) fail('Factorielle non définie');
          v = r;
          continue;
        }
        if (tk && tk.t === 'pow') {
          next();
          const e = parseUnary(); /* associativité à droite : 2^3^2 = 512 */
          v = Math.pow(v, e);
          if (isNaN(v)) fail('Puissance non définie');
          continue;
        }
        return v;
      }
    }
    function parsePrimary() {
      const tk = next();
      if (!tk) fail('Expression incomplète');
      if (tk.t === 'num') return tk.v;
      if (tk.t === 'const') return tk.v;
      if (tk.t === 'open') {
        const v = parseExpr();
        const c = next();
        if (!c || c.t !== 'close') fail('Parenthèse fermante manquante');
        return v;
      }
      if (tk.t === 'func') {
        const v = parseExpr();
        const c = next();
        if (!c || c.t !== 'close') fail('Parenthèse fermante manquante');
        return applyFunc(tk.v, v, isDeg);
      }
      fail('Expression invalide');
    }

    const result = parseExpr();
    if (pos < toks.length) fail('Expression invalide');
    if (isNaN(result)) fail('Calcul non défini');
    return result;
  }

  /* Reconstruit les chaînes d'affichage et de calcul depuis les tokens,
     recalcule le nombre de parenthèses ouvertes et rafraîchit l'écran. */
  function refreshFromTokens() {
    expr = tokens.map(t => t.d).join('');
    calc = tokens.map(t => t.c).join('');
    openP = 0;
    for (const ch of calc) {
      if (ch === '(') openP++;
      else if (ch === ')') openP = Math.max(0, openP - 1);
    }
    updateDisplay();
  }

  const NUMBER_END_RE = /[0-9)!]/;
  /* Insère une VALEUR (Ans, mémoire, constante) : multiplie automatiquement
     si le token précédent se termine par un nombre / « ) » / « ! » — et
     empêche le collage ambigu « 5 » + « 1e-7 » → « 5 × 1e-7 ». */
  function insertValueToken(display, calcStr) {
    const lastTok = tokens[tokens.length - 1];
    if (lastTok && NUMBER_END_RE.test(lastTok.c.slice(-1))) {
      tokens.push({ d: ' × ', c: '*' });
    }
    tokens.push({ d: display, c: calcStr });
  }

  // ============================================================
  // AFFICHAGE
  // ============================================================
  function updateDisplay() {
    displayExpr.textContent = done ? (expr + ' =') : expr;

    if (openP > 0) {
      parenIndicator.textContent = openP + ' parenthèse(s) ouverte(s)';
      parenIndicator.classList.add('visible');
    } else {
      parenIndicator.classList.remove('visible');
    }

    const len = displayResult.textContent.length;
    displayResult.classList.remove('small', 'tiny');
    if (len > 14) displayResult.classList.add('small');
    if (len > 20) displayResult.classList.add('tiny');
  }

  function updateResult(text, isError = false) {
    displayResult.textContent = text;
    displayResult.classList.toggle('error', isError);
    updateDisplay();
  }

  // ============================================================
  // ACTIONS CALCULATRICE
  // ============================================================
  // ============================================================
  // ✅ v8.63a — ACTIONS (par tokens : affichage et calcul toujours
  // synchronisés, retour arrière parfait, opérateurs auto-remplacés)
  // ============================================================
  /* Le nombre en cours de saisie (tokens numériques consécutifs de la fin). */
  function currentNumberString() {
    let s = '';
    for (let i = tokens.length - 1; i >= 0; i--) {
      if (/^[0-9.]$/.test(tokens[i].c)) s = tokens[i].c + s;
      else break;
    }
    return s;
  }

  function inputNumber(n) {
    if (done) { tokens = []; done = false; }
    if (n === '.') {
      if (currentNumberString().indexOf('.') >= 0) return; /* jamais « 1..2 » */
      if (!currentNumberString()) tokens.push({ d: '0', c: '0' }); /* « .5 » → « 0.5 » */
    }
    tokens.push({ d: n, c: n });
    refreshFromTokens();
    vibrate(8);
  }

  function inputOperator(op) {
    done = false;
    /* Remplace un opérateur final par le nouveau — plus jamais « 5 + × ». */
    while (tokens.length) {
      const lt = tokens[tokens.length - 1];
      if (/^[+\-*/]$/.test(lt.c) && lt.d.trim().length <= 3) tokens.pop();
      else break;
    }
    const sym = { '+': ' + ', '-': ' − ', '*': ' × ', '/': ' ÷ ' }[op];
    tokens.push({ d: sym, c: op });
    refreshFromTokens();
    vibrate(10);
  }

  function inputFunction(fn) {
    if (done) { tokens = []; done = false; }
    /* Postfixes : carré, cube, puissance, factorielle, pourcentage. */
    const post = { square: ['²', '**2'], cube: ['³', '**3'], power: ['^', '**'], fact: ['!', '!'], percent: ['%', '/100'] };
    if (post[fn]) {
      const lt = tokens[tokens.length - 1];
      if (!lt || !NUMBER_END_RE.test(lt.c.slice(-1))) return;
      tokens.push({ d: post[fn][0], c: post[fn][1] });
      refreshFromTokens();
      vibrate(8);
      return;
    }
    const fns = {
      sin: ['sin(', 'sin('], cos: ['cos(', 'cos('], tan: ['tan(', 'tan('],
      asin: ['sin⁻¹(', 'asin('], acos: ['cos⁻¹(', 'acos('], atan: ['tan⁻¹(', 'atan('],
      ln: ['ln(', 'ln('], log: ['log(', 'log('], sqrt: ['√(', 'sqrt('],
      cbrt: ['∛(', 'cbrt('], inv: ['1÷(', '1/('], abs: ['|', 'abs('],
      exp: ['exp(', 'exp('], tenpow: ['10^(', '10^(']
    };
    const t = fns[fn];
    if (!t) return;
    tokens.push({ d: t[0], c: t[1] });
    refreshFromTokens();
    vibrate(8);
  }

  function inputConst(c) {
    if (done) { tokens = []; done = false; }
    if (c === 'pi') insertValueToken('π', '(PI)');
    else if (c === 'e') insertValueToken('e', '(E)');
    else return;
    refreshFromTokens();
    vibrate(8);
  }

  function inputParen() {
    if (done) { tokens = []; done = false; }
    const lt = tokens[tokens.length - 1];
    const lastDisp = lt ? lt.d.trim().slice(-1) : '';
    if (!lt || /[+\-−×÷^(]$/.test(lastDisp) || openP === 0) {
      tokens.push({ d: '(', c: '(' });
    } else {
      tokens.push({ d: ')', c: ')' });
    }
    refreshFromTokens();
    vibrate(8);
  }

  function clearAll() {
    tokens = [];
    done = false;
    displayExpr.textContent = '';
    updateResult('0');
    vibrate(15);
  }

  function deleteLast() {
    if (done) { clearAll(); return; }
    if (!tokens.length) return;
    tokens.pop();
    if (!tokens.length) updateResult('0');
    vibrate(6);
    refreshFromTokens();
  }

  function evaluate() {
    if (done) return;
    let fCalc = tokens.map(t => t.c).join('');
    let fExpr = tokens.map(t => t.d).join('');
    if (!fCalc.trim()) return;

    /* Fermeture automatique des parenthèses ouvertes. */
    let oc = 0;
    for (const ch of fCalc) { if (ch === '(') oc++; else if (ch === ')') oc--; }
    while (oc > 0) { fCalc += ')'; fExpr += ')'; oc--; }

    let result;
    try {
      result = evalCalc(fCalc, isDeg);
    } catch (err) {
      updateResult(err && err.message ? err.message : 'Erreur', true);
      vibrate([20, 30, 20]);
      return;
    }

    if (typeof result !== 'number' || isNaN(result)) {
      updateResult('Erreur', true);
      vibrate([20, 30, 20]);
      return;
    }
    if (!isFinite(result)) {
      updateResult(result > 0 ? '∞' : '−∞', true);
      vibrate([20, 30, 20]);
      return;
    }

    /* Nettoie le bruit flottant : sin(30) affiche 0.5, plus 0.499999… */
    const clean = Number(result.toPrecision(12));
    const formatted = formatNumber(clean);

    expr = fExpr;
    calc = String(clean);
    tokens = [{ d: String(clean), c: String(clean) }];
    done = true;

    updateResult(formatted);

    history.unshift({ e: fExpr, r: formatted, v: clean });
    if (history.length > 50) history.length = 50;
    saveHistory();

    lastAns = clean;
    saveAns();

    vibrate([10, 20, 10]);
    updateDisplay();
  }

  function memClear() {
    memory = 0;
    hasMem = false;
    memIndicator.classList.remove('visible');

    showToast('Mémoire vidée');
    updateMemValue();

  function memRecall() {
    if (!hasMem) return;
    done = false;
    insertValueToken(String(memory), '(' + String(memory) + ')');
    refreshFromTokens();
    vibrate(8);
    closeModal('modalMenu');
  }

  function memAdd() {
    if (calc.trim()) {
      try {
        let fCalc = calc;
        let oc = 0;
        for (const ch of fCalc) { if (ch === '(') oc++; else if (ch === ')') oc--; }
        while (oc > 0) { fCalc += ')'; oc--; }
        const v = evalCalc(fCalc, isDeg);
        if (!isNaN(v) && isFinite(v)) {
          memory += v;
          hasMem = true;
          memIndicator.classList.add('visible');
          saveMemory();
          showToast('M+ : ' + memory);
          updateMemValue();
        }
      } catch (e) {
        showToast('Expression invalide');
      }
    }
  }

  function memSub() {
    if (calc.trim()) {
      try {
        let fCalc = calc;
        let oc = 0;
        for (const ch of fCalc) { if (ch === '(') oc++; else if (ch === ')') oc--; }
        while (oc > 0) { fCalc += ')'; oc--; }
        const v = evalCalc(fCalc, isDeg);
        if (!isNaN(v) && isFinite(v)) {
          memory -= v;
          hasMem = true;
          memIndicator.classList.add('visible');
          saveMemory();
          showToast('M− : ' + memory);
          updateMemValue();

  // ============================================================
  // SWIPE TO CLOSE
  // ============================================================
  function setupSwipeToClose() {
    document.querySelectorAll('.modal-sheet').forEach(sheet => {
      let startY = 0;
      let currentY = 0;
      let isDragging = false;
      let startTime = 0;

      sheet.addEventListener('touchstart', (e) => {
        const rect = sheet.getBoundingClientRect();
        const touchY = e.touches[0].clientY;

        if (touchY - rect.top < 80) {
          startY = touchY;
          currentY = touchY;
          startTime = Date.now();
          isDragging = true;
          sheet.classList.add('dragging');
        }
      }, { passive: true });

      sheet.addEventListener('touchmove', (e) => {
        if (!isDragging) return;

        currentY = e.touches[0].clientY;
        const diff = currentY - startY;

        if (diff > 0) {
          sheet.style.transform = `translateY(${diff}px)`;
          e.preventDefault();
        }
      }, { passive: false });

      sheet.addEventListener('touchend', () => {
        if (!isDragging) return;

        isDragging = false;
        sheet.classList.remove('dragging');

        const diff = currentY - startY;
        const duration = Date.now() - startTime;
        const velocity = diff / duration;

        if (diff > 100 || (velocity > 0.5 && diff > 30)) {
          sheet.style.transition = 'transform 0.3s cubic-bezier(0.25,1,0.5,1)';
          sheet.style.transform = `translateY(100%)`;

          setTimeout(() => {
            sheet.parentElement.classList.remove('show');
            sheet.style.transform = '';
            sheet.style.transition = '';
          }, 300);
        } else {
          sheet.style.transform = '';
        }

        startY = 0;
        currentY = 0;
      }, { passive: true });

      sheet.addEventListener('touchcancel', () => {
        if (!isDragging) return;
        isDragging = false;
        sheet.classList.remove('dragging');
        sheet.style.transform = '';
      }, { passive: true });
    });
  }

  // ============================================================
  // HISTORIQUE
  // ============================================================
  function renderHistory() {
    const list = document.getElementById('historyList');
    const actions = document.getElementById('historyActions');

    if (!history.length) {
      list.innerHTML = '<div class="history-empty">Aucun calcul pour le moment</div>';
      actions.style.display = 'none';
      return;
    }

    actions.style.display = 'flex';
    list.innerHTML = history.map((h, i) => `
      <div class="history-item" data-idx="${i}">
        <div class="h-expr">${escapeHtml(h.e)}</div>
        <div class="h-res">= ${escapeHtml(h.r)}</div>
      </div>
    `).join('');

    list.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => {
        const h = history[parseInt(item.dataset.idx)];
        if (h) {
          /* ✅ v8.63a — rappel par la valeur BRUTE (h.v) : la valeur affichée
             « fr-FR » (1 234,5) détruisait les décimales au rappel (« 1,5 »
             devenait « 15 »). */
          const val = (typeof h.v === 'number' && isFinite(h.v))
            ? String(h.v)
            : String(h.r).replace(/[^\d.\-]/g, '');
          tokens = [{ d: val, c: val }];
          done = false;
          refreshFromTokens();
          updateResult(val);
          closeModal('modalHistory');
          vibrate(10);
        }
      });
    });
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[c]));
  }

      { s: 'u', n: 'Unité de masse atomique', v: 1.661e-27, u: 'kg', d: '1,661 × 10⁻²⁷ kg' },
      { s: 'm_e', n: "Masse de l'électron", v: 9.109e-31, u: 'kg', d: '9,109 × 10⁻³¹ kg' },
      { s: 'q_e', n: 'Charge élémentaire', v: 1.602e-19, u: 'C', d: '1,602 × 10⁻¹⁹ C' }
    ]},
    { cat: 'Mathématiques', items: [
      { s: 'π', n: 'Pi', v: Math.PI, u: '', d: '3,14159...' },
      { s: 'e', n: "Nombre d'Euler", v: Math.E, u: '', d: '2,71828...' },
      { s: 'φ', n: "Nombre d'or", v: 1.6180339887, u: '', d: '1,61803...' },
      { s: '√2', n: 'Racine de 2', v: Math.SQRT2, u: '', d: '1,41421...' }
    ]}
  ];

  function renderConstants(filter = '') {
    const f = filter.toLowerCase().trim();
    const list = document.getElementById('constList');

    let html = '';
    CONSTANTS.forEach(cat => {
      const items = cat.items.filter(it =>
        !f || it.s.toLowerCase().includes(f) || it.n.toLowerCase().includes(f)
      );
      if (!items.length) return;

      html += `<div class="const-category">${cat.cat}</div>`;
      items.forEach(it => {
        html += `
          <div class="const-item" data-val="${it.v}">
            <div class="ci-left">
              <div class="ci-symbol">${it.s}</div>
              <div class="ci-name">${it.n}</div>
            </div>
            <div class="ci-right">
              <div class="ci-value">${it.d}</div>
              ${it.u ? `<div class="ci-unit">${it.u}</div>` : ''}
            </div>
          </div>
        `;
      });
    });

    if (!html) html = '<div class="history-empty">Aucune constante trouvée</div>';
    list.innerHTML = html;

    list.querySelectorAll('.const-item').forEach(item => {
      item.addEventListener('click', () => {
        const val = item.dataset.val;
        done = false;
        insertValueToken(val, '(' + val + ')');
        refreshFromTokens();
        closeModal('modalConst');
        showToast('Constante insérée');
        vibrate(10);
      });
    });
  }

  // ============================================================
  // CONVERSIONS
  // ============================================================
  const CONVERSIONS = {
    'Longueur': {
      units: ['m', 'km', 'cm', 'mm', 'µm', 'in', 'ft', 'mi'],
      labels: ['Mètre', 'Kilomètre', 'Centimètre', 'Millimètre', 'Micromètre', 'Pouce', 'Pied', 'Mile'],
      toBase: [1, 1000, 0.01, 0.001, 1e-6, 0.0254, 0.3048, 1609.344]
    },
    'Masse': {
      units: ['kg', 'g', 'mg', 't', 'oz', 'lb'],
      labels: ['Kilogramme', 'Gramme', 'Milligramme', 'Tonne', 'Once', 'Livre'],
      toBase: [1, 0.001, 1e-6, 1000, 0.0283495, 0.453592]
    },
    'Température': {
      units: ['°C', '°F', 'K'],
      labels: ['Celsius', 'Fahrenheit', 'Kelvin'],
      special: true
    },
    'Pression': {
      units: ['Pa', 'kPa', 'bar', 'atm', 'mmHg'],
      labels: ['Pascal', 'Kilopascal', 'Bar', 'Atmosphère', 'mmHg'],
      toBase: [1, 1000, 100000, 101325, 133.322]
    },
    'Énergie': {
      units: ['J', 'kJ', 'cal', 'kcal', 'eV', 'kWh'],
      labels: ['Joule', 'Kilojoule', 'Calorie', 'Kilocalorie', 'Électronvolt', 'kWh'],
      toBase: [1, 1000, 4.184, 4184, 1.602e-19, 3.6e6]
    },
    'Vitesse': {
      units: ['m/s', 'km/h', 'mph', 'kn'],
      labels: ['m/s', 'km/h', 'mph', 'Nœud'],
      toBase: [1, 0.277778, 0.44704, 0.514444]
    },
    'Volume': {
      units: ['L', 'mL', 'm³', 'cm³', 'gal'],
      labels: ['Litre', 'Millilitre', 'm³', 'cm³', 'Gallon US'],
      toBase: [1, 0.001, 1000, 0.001, 3.78541]
    },
    'Temps': {
      units: ['s', 'min', 'h', 'jour', 'semaine'],
      labels: ['Seconde', 'Minute', 'Heure', 'Jour', 'Semaine'],
      toBase: [1, 60, 3600, 86400, 604800]
    }
  };

  let currentConvCat = 'Longueur';

  function renderConvCats() {
    const cats = document.getElementById('convCats');
    cats.innerHTML = Object.keys(CONVERSIONS).map(cat =>
      `<button class="conv-cat ${cat === currentConvCat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
    ).join('');

    cats.querySelectorAll('.conv-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        currentConvCat = btn.dataset.cat;
        renderConvCats();
        populateConvUnits();
        doConversion();
      });
    });
  }

  function populateConvUnits() {
    const c = CONVERSIONS[currentConvCat];
    const fromSel = document.getElementById('convFromUnit');
    const toSel = document.getElementById('convToUnit');

    fromSel.innerHTML = '';
    toSel.innerHTML = '';

    c.labels.forEach((lbl, i) => {
      fromSel.innerHTML += `<option value="${i}">${lbl} (${c.units[i]})</option>`;
      toSel.innerHTML += `<option value="${i}">${lbl} (${c.units[i]})</option>`;
    });

    if (c.labels.length > 1) toSel.value = '1';
  }

  function convertTemp(val, from, to) {
    let c;
    if (from === 0) c = val;
    else if (from === 1) c = (val - 32) * 5 / 9;
    else c = val - 273.15;

    if (to === 0) return c;
    else if (to === 1) return c * 9 / 5 + 32;
    else return c + 273.15;
  }

  function doConversion() {
    const c = CONVERSIONS[currentConvCat];
    const val = parseFloat(document.getElementById('convFrom').value);
    const fi = parseInt(document.getElementById('convFromUnit').value);
    const ti = parseInt(document.getElementById('convToUnit').value);

    const toEl = document.getElementById('convTo');
    const formulaEl = document.getElementById('convFormula');

    if (isNaN(val)) {
      toEl.value = '';
      formulaEl.textContent = '';
      return;
    }

    let result;
    if (c.special) {
      result = convertTemp(val, fi, ti);
    } else {
      const base = val * c.toBase[fi];
      result = base / c.toBase[ti];
    }

    let fmt;
    if (Math.abs(result) >= 1e6 || (Math.abs(result) < 0.001 && result !== 0)) {
      fmt = result.toExponential(4);
    } else {
      fmt = parseFloat(result.toPrecision(10)).toLocaleString('fr-FR', { maximumFractionDigits: 6 });
    }

    toEl.value = fmt;
    formulaEl.textContent = `${val} ${c.units[fi]} = ${fmt} ${c.units[ti]}`;
  }

  // ============================================================
  // ÉVÉNEMENTS
  // ============================================================
  function bindEvents() {
    document.querySelectorAll('.cb.num[data-n]').forEach(btn => {
      btn.addEventListener('click', () => inputNumber(btn.dataset.n));
    });

    document.getElementById('btnAdd').addEventListener('click', () => inputOperator('+'));
    document.getElementById('btnSub').addEventListener('click', () => inputOperator('-'));
    document.getElementById('btnMul').addEventListener('click', () => inputOperator('*'));
    document.getElementById('btnDiv').addEventListener('click', () => inputOperator('/'));

    document.querySelectorAll('.cb.fn[data-fn]').forEach(btn => {
      btn.addEventListener('click', () => inputFunction(btn.dataset.fn));
    });

    document.querySelectorAll('.cb[data-const]').forEach(btn => {
      btn.addEventListener('click', () => inputConst(btn.dataset.const));
    });

    document.getElementById('btnAC').addEventListener('click', clearAll);
    document.getElementById('btnDel').addEventListener('click', deleteLast);
    document.getElementById('btnParen').addEventListener('click', inputParen);
    document.getElementById('btnEq').addEventListener('click', evaluate);

    modeToggle.addEventListener('click', () => {
      isDeg = !isDeg;
      modeLabel.textContent = isDeg ? 'DEG' : 'RAD';
      showToast(isDeg ? 'Mode Degré' : 'Mode Radian');
      vibrate(10);
    });

    document.getElementById('toolHistory').addEventListener('click', () => {
      renderHistory();
      openModal('modalHistory');
      vibrate(10);
    });

    document.getElementById('toolConst').addEventListener('click', () => {
      renderConstants();
      openModal('modalConst');
      vibrate(10);
    });

    document.getElementById('toolConvert').addEventListener('click', () => {
      renderConvCats();
      populateConvUnits();
      doConversion();
      openModal('modalConvert');
      vibrate(10);
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      updateMemValue();
      openModal('modalMenu');
    });

    // ✅ v8.62a — barre du haut unifiée : bouton rafraîchir
    document.getElementById('refreshBtn').addEventListener('click', () => {
      window.location.reload();
    });

    document.getElementById('menuAns').addEventListener('click', () => {
      done = false;
      insertValueToken(String(lastAns), '(' + String(lastAns) + ')');
      refreshFromTokens();
      closeModal('modalMenu');
      vibrate(10);
    });

    document.getElementById('menuMem').addEventListener('click', () => {
      memRecall();
      closeModal('modalMenu');
    });

    document.getElementById('menuMemPlus').addEventListener('click', () => {
      memAdd();
      closeModal('modalMenu');
    });

    document.getElementById('menuMemMinus').addEventListener('click', () => {
      memSub();
      closeModal('modalMenu');
    });

    document.getElementById('menuMemClear').addEventListener('click', () => {
      memClear();
      closeModal('modalMenu');
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    });

    document.getElementById('clearHistory').addEventListener('click', () => {
      history = [];
      saveHistory();
      renderHistory();
      showToast('Historique effacé');
      vibrate(15);
    });

    document.getElementById('constSearch').addEventListener('input', (e) => {
      renderConstants(e.target.value);
    });

    document.getElementById('convFrom').addEventListener('input', doConversion);
    document.getElementById('convFromUnit').addEventListener('change', doConversion);
    document.getElementById('convToUnit').addEventListener('change', doConversion);

    document.getElementById('convSwap').addEventListener('click', () => {
      const fromSel = document.getElementById('convFromUnit');
      const toSel = document.getElementById('convToUnit');
      const tmp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = tmp;

      const toVal = document.getElementById('convTo').value.replace(/\s/g, '').replace(/,/g, '.');
      document.getElementById('convFrom').value = toVal;
      doConversion();
      vibrate(10);
    });

    document.addEventListener('keydown', (e) => {
      if (document.querySelector('.modal-overlay.show')) {
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
        }
        return;
      }

      const k = e.key;
      if (k >= '0' && k <= '9') {
        const btn = document.querySelector(`.cb.num[data-n="${k}"]`);
        if (btn) btn.click();
      } else if (k === '.') {
        const btn = document.querySelector('.cb.num[data-n="."]');
        if (btn) btn.click();
      } else if (k === '+') { e.preventDefault(); inputOperator('+'); }
      else if (k === '-') { e.preventDefault(); inputOperator('-'); }
      else if (k === '*') { e.preventDefault(); inputOperator('*'); }
      else if (k === '/') { e.preventDefault(); inputOperator('/'); }
      else if (k === 'Enter' || k === '=') { e.preventDefault(); evaluate(); }
      else if (k === 'Backspace') { e.preventDefault(); deleteLast(); }
      else if (k === 'Escape') { clearAll(); }
      else if (k === '(' || k === ')') { e.preventDefault(); inputParen(); }
    });
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    loadStorage();
    bindEvents();
    setupSwipeToClose();
    updateDisplay();
    updateMemValue();
  }

  init();

})();
</script>
<script>
/* ✅ v8.64a — la page peint instantanément : le cercle « Chargement... » se
   retire dès le chargement complet (les données progressives ont leurs
   squelettes derrière). Les paths de données riches appellent aussi
   window.__arvexaBootHide() plus tôt quand ils existent. */
window.addEventListener('load', function(){ setTimeout(function(){ try { if (window.__arvexaBootHide) window.__arvexaBootHide(); } catch (e) {} }, 400); });
</script>
