function bindQcmShort(rootEl) {
  rootEl.querySelectorAll('[data-qcmz]').forEach((wrap) => {
    const items = wrap.querySelectorAll('.qcmz-item');
    const total = items.length;
    const update = () => {
      const done = Number(wrap.dataset.done || 0);
      const good = Number(wrap.dataset.good || 0);
      const score = wrap.querySelector('[data-qcmz-score]');
      if (score) score.textContent = `${done} / ${total}`;
      const fin = wrap.querySelector('[data-qcmz-final]');
      if (fin && done >= total) {
        fin.style.display = 'flex';
        const txt = wrap.querySelector('[data-qcmz-final-txt]');
        if (txt) txt.textContent = good === total
          ? `Sans faute — ${good}/${total} ! Tu maîtrises cette partie.`
          : `${good}/${total} bonnes réponses — relis les explications puis rejoue les points manqués.`;
      }
    };
    items.forEach((item) => {
      const answer = Number(item.dataset.answer || 0);
      item.querySelectorAll('.qcmz-choice').forEach((ch) => {
        ch.addEventListener('click', () => {
          if (item.classList.contains('answered')) return;
          item.classList.add('answered');
          const pick = Number(ch.dataset.i || 0);
          item.querySelectorAll('.qcmz-choice').forEach((o, i) => {
            o.disabled = true;
            if (i === answer) o.classList.add('good');
            else if (i === pick) o.classList.add('bad');
            else o.classList.add('dim');
          });
          item.querySelector('.qcmz-why')?.classList.add('show');
          wrap.dataset.done = String(Number(wrap.dataset.done || 0) + 1);
          if (pick === answer) wrap.dataset.good = String(Number(wrap.dataset.good || 0) + 1);
          update();
        });
      });
    });
    update();
  });
}

// ── CARTE MENTALE EN CHAÎNE DE CARTES RELIÉES (v8.42) ──
// Demande propriétaire : « je la veux comme une chaîne de liaison — des
// cartes qui se suivent comme une chaîne, une ligne droite : la carte de
// base puis la liaison entre les différentes cartes, bien propre, bien
// aligné, déplaçable, et le plein écran qui couvre tout le reste. Sur chaque
// carte, son explication détaillée en modale, sa signification pour
// faciliter la révision ». Palette par branche conservée pour les couleurs.
const MM_COLORS = [
  { main: '#5B8DEF', bg: 'rgba(91,141,239,0.17)', bd: 'rgba(91,141,239,0.62)', bg2: 'rgba(91,141,239,0.08)', bd2: 'rgba(91,141,239,0.36)', fg: '#BFD7FA' },
  { main: '#3ABA75', bg: 'rgba(58,186,117,0.16)', bd: 'rgba(58,186,117,0.60)', bg2: 'rgba(58,186,117,0.08)', bd2: 'rgba(58,186,117,0.34)', fg: '#B8E8CF' },
  { main: '#E6B93C', bg: 'rgba(230,185,60,0.15)', bd: 'rgba(230,185,60,0.58)', bg2: 'rgba(230,185,60,0.08)', bd2: 'rgba(230,185,60,0.34)', fg: '#F2E3B0' },
  { main: '#B07BE8', bg: 'rgba(176,123,232,0.16)', bd: 'rgba(176,123,232,0.58)', bg2: 'rgba(176,123,232,0.08)', bd2: 'rgba(176,123,232,0.34)', fg: '#DCC4F5' },
  { main: '#F08A4B', bg: 'rgba(240,138,75,0.15)', bd: 'rgba(240,138,75,0.58)', bg2: 'rgba(240,138,75,0.08)', bd2: 'rgba(240,138,75,0.34)', fg: '#F3CDB0' },
  { main: '#4BC0C8', bg: 'rgba(75,192,200,0.15)', bd: 'rgba(75,192,200,0.58)', bg2: 'rgba(75,192,200,0.08)', bd2: 'rgba(75,192,200,0.34)', fg: '#BCE8EC' }
];

// ── CARTE MENTALE HIÉRARCHIQUE — LIAISON RADIALE (v8.43) ──
// Demande propriétaire : « c'est une liaison hiérarchique — regarde les
// cartes comment ils sont de la carte mère, c'est comme la reproduction
// conforme » (capture : carte mère au centre, branches colorées qui
// rayonnent — bleu, vert, jaune —, bulles cliquables, déplacement au
// glissement, zoom avant/arrière, plein écran). La CARTE MÈRE reste au
// centre, chaque branche rayonne autour d'elle avec SA couleur, chaque
// carte est DÉPLAÇABLE (positions sauvegardées) et ouvre sa modale
// d'explication ; plein écran qui couvre tout le reste.
const MM_CW = 168, MM_CH = 88;
const MM_R1 = 235;   // rayon carte mère → branches
const MM_R2 = 175;   // rayon branche → enfants

// Arbre plat avec parentId : carte mère (n0) → branches (s*) → enfants (s*k*)
function mmTreeNodes(mm) {
  const nodes = [{
    id: 'n0', level: 0, idx: 0, parentId: null, color: null,
    title: String(mm.idea || ''), detail: String(mm.detail || ''), signif: String(mm.signif || '')
  }];
  let idx = 1;
  safeArray(mm.steps).forEach((st, i) => {
    const col = MM_COLORS[i % MM_COLORS.length];
    nodes.push({ id: `s${i}`, level: 1, idx: idx++, parentId: 'n0', color: col,
      title: String(st.title || ''), detail: String(st.detail || ''), signif: String(st.signif || '') });
    safeArray(st.children).forEach((k, ki) => {
      nodes.push({ id: `s${i}k${ki}`, level: 2, idx: idx++, parentId: `s${i}`, color: col,
        title: String(k.title || ''), detail: String(k.detail || ''), signif: String(k.signif || '') });
    });
  });
  return nodes;
}

// ✅ v8.43 — LIAISON HIÉRARCHIQUE RADIALE : carte mère au centre, branches
// réparties uniformément AUTOUR d'elle (première en haut, sens horaire —
// reproduction conforme à la capture), enfants en éventail au-delà de leur
// branche. Propre et aligné par construction.
function mmLayout(mm, saved) {
  const nodes = mmTreeNodes(mm);
  const branches = nodes.filter((n) => n.level === 1);
  const cx = 0, cy = 0; // centre = carte mère (au centre du monde)
  const root = nodes[0];
  root.x = cx - MM_CW / 2; root.y = cy - MM_CH / 2;

  const spread = (2 * Math.PI) / Math.max(3, branches.length); // écart angulaire
  branches.forEach((br, i) => {
    // première branche en HAUT (-90°), répartition horaire uniforme
    const ang = -Math.PI / 2 + i * spread;
    const bx = cx + Math.cos(ang) * MM_R1;
    const by = cy + Math.sin(ang) * MM_R1;
    br.x = bx - MM_CW / 2; br.y = by - MM_CH / 2;

    const kids = nodes.filter((n) => n.parentId === br.id);
    kids.forEach((k, ki) => {
      const n = kids.length;
      // éventail centré sur la direction de la branche (± 24°)
      const off = (ki - (n - 1) / 2) * (24 * Math.PI / 180);
      const ka = ang + off;
      const kx = cx + Math.cos(ka) * (MM_R1 + MM_R2);
      const ky = cy + Math.sin(ka) * (MM_R1 + MM_R2);
      k.x = kx - MM_CW / 2; k.y = ky - MM_CH / 2;
    });
  });

  // ✅ positions DÉPLACÉES = coordonnées FINALES ABSOLUES (l'élève retrouve
  // exactement ses cartes ; le rendu gère les coordonnées négatives).
  if (saved) {
    for (const nd of nodes) {
      const sv = saved[nd.id];
      if (sv && Number.isFinite(sv.x) && Number.isFinite(sv.y)) { nd.x = sv.x; nd.y = sv.y; }
    }
  }

  // Boîte englobante RÉELLE → monde + origine du SVG
  const padX = 110, padY = 90;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const nd of nodes) {
    minX = Math.min(minX, nd.x); minY = Math.min(minY, nd.y);
    maxX = Math.max(maxX, nd.x + MM_CW); maxY = Math.max(maxY, nd.y + MM_CH);
  }
  const ox = minX - padX, oy = minY - padY;
  const W = Math.max(620, (maxX + padX) - ox);
  const H = Math.max(430, (maxY + padY) - oy);
  return { nodes, W, H, ox, oy };
}

function mmDefs() {
  const colors = ['#E0B84A'].concat(MM_COLORS.map((c) => c.main));
  return `<defs>${colors.map((c, i) => `<marker id="mmAr${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="${c}"/></marker>`).join('')}</defs>`;
}
function mmMarkerRef(color) {
  const colors = ['#E0B84A'].concat(MM_COLORS.map((c) => c.main));
  const i = colors.indexOf(String(color || '#E0B84A'));
  return `mmAr${i >= 0 ? i : 0}`;
}
function mmLinkPath(a, b) {
  const ax = a.x + MM_CW / 2, ay = a.y + MM_CH / 2;
  const bx = b.x + MM_CW / 2, by = b.y + MM_CH / 2;
  const dx = bx - ax, dy = by - ay;
  const d = Math.hypot(dx, dy) || 1;
  const ux = dx / d, uy = dy / d;
  const r = 38;
  const x1 = ax + ux * r, y1 = ay + uy * r;
  const x2 = bx - ux * (r + 9), y2 = by - uy * (r + 9);
  const mx = (x1 + x2) / 2 - uy * 15, my = (y1 + y2) / 2 + ux * 15;
  return { d: `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
    color: a.idx === 0 ? '#E0B84A' : (a.color ? a.color.main : '#E0B84A') };
}

function renderMindmap(mm, posKey) {
  if (!mm || !mm.idea || !Array.isArray(mm.steps) || mm.steps.length === 0) return null;

  const byId = {};
  nodes.forEach((nd) => { byId[nd.id] = nd; });

  const card = (nd) => {

        <div class="mmap-world" style="width:${Math.round(W)}px;height:${Math.round(H)}px;">
          <svg class="mmap-lines" style="left:${ox.toFixed(1)}px;top:${oy.toFixed(1)}px;" width="${Math.round(W)}" height="${Math.round(H)}" viewBox="${ox.toFixed(1)} ${oy.toFixed(1)} ${Math.round(W)} ${Math.round(H)}">${mmDefs()}</svg>
          ${nodes.map(card).join('')}
        </div>

          <button type="button" data-mm-zoom="in" aria-label="Zoomer"><i class="fas fa-plus"></i></button>

          <button type="button" data-mm-zoom="fit" aria-label="Recadrer"><i class="fas fa-crosshairs"></i></button>

    </div>
  `,
    byId, idea: String(mm.idea || ''), posKey: String(posKey || '')
  };
}

// Pan / zoom + modale d'explication — branchés après insertion du HTML.
function mmApplyTransform(wrap, world, st) {
  world.style.transform = `translate(${st.x}px, ${st.y}px) scale(${st.s})`;
  wrap.__mmSt = st;
}
function mmFit(wrap, world, W, H) {
  // ✅ v8.45a — FIX « la carte est générée mais je ne vois pas la map » :
  // la liaison radiale peint le contenu aux COORDONNÉES DU NŒUD (carte mère
  // au centre 0,0 → axes x/y NÉGATIFS pour les branches haut/gauche) — mais
  // l'ancien mmFit centrait la BOÎTE du monde [0..W]×[0..H] : toute la
  // moitié gauche/haute du contenu (carte mère comprise) restait HORS CHAMP,
  // rognée par l'overflow:hidden du cadre (preuve : 4/9 cartes seulement
  // visibles sur le cas réel). L'ORIGINE réelle du contenu = position du SVG
  // (left/top = ox/oy) : on centre désormais la BOÎTE DU CONTENU
  // [ox..ox+W]×[oy..oy+H] → la carte mère + TOUTES les branches sont
  // visibles dès l'ouverture (9/9 et 25/25 cartes vérifiées par simulation).
  const mmSvg = world.querySelector('.mmap-lines');
  const ox = mmSvg ? (parseFloat(mmSvg.style.left) || 0) : 0;
  const oy = mmSvg ? (parseFloat(mmSvg.style.top) || 0) : 0;
  const vw = wrap.clientWidth || 340, vh = wrap.clientHeight || 470;
  const s = Math.max(0.35, Math.min(1.15, (vw - 26) / W, (vh - 26) / H));
  mmApplyTransform(wrap, world, { s, x: (vw - W * s) / 2 - ox * s, y: (vh - H * s) / 2 - oy * s });
}
// ✅ v8.43 — cadrage INITIAL : la carte HIÉRARCHIQUE ENTIÈRE visible dès
// l'ouverture (carte mère au centre, branches autour) — on recadre ensuite
// librement (zoom, déplacement, plein écran).
function mmFitInitial(wrap, world, W, H) {
  mmFit(wrap, world, W, H);
}
function mmZoomAt(wrap, world, px, py, factor) {
  const st = wrap.__mmSt || { s: 1, x: 0, y: 0 };
  const ns = Math.max(0.35, Math.min(2.6, st.s * factor));
  const k = ns / st.s;
  mmApplyTransform(wrap, world, { s: ns, x: px - (px - st.x) * k, y: py - (py - st.y) * k });
}
function openMindmapModal(nd, meta) {
  const idea = meta && meta.idea ? String(meta.idea) : '';
  const det = String(nd.detail || '').trim();
  const sig = String(nd.signif || '').trim();
  const pos = nd.level === 0
    ? 'Carte mère — au centre de la carte'
    : (nd.level === 1 ? `Branche · ${idea}` : `Détail de branche · ${idea}`);
  openModal(`
    <div class="modal dicta-modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="mx-card">
        <div class="mx-path"><span class="mx-dot"></span>${escapeHtml(pos)}</div>
        <div class="mx-title">${escapeHtml(nd.title)}</div>
        ${det ? `<div class="mx-sec"><span class="mx-sec-label"><i class="fas fa-book-open"></i> Explication</span><div class="mx-sec-text">${escapeHtml(det)}</div></div>` : ''}
        ${sig ? `<div class="mx-sec"><span class="mx-sec-label"><i class="fas fa-key"></i> Signification</span><div class="mx-sec-text">${escapeHtml(sig)}</div></div>` : ''}
        ${!det && !sig ? `<div class="mx-sec"><div class="mx-sec-text">Ce point résume une partie de la leçon — relis le résumé pour le contexte complet.</div></div>` : ''}
        <div class="mx-rev"><i class="fas fa-graduation-cap"></i><span>Pour la révision : dis cette carte à voix haute, puis vérifie que tu peux l'expliquer sans relire le cours.</span></div>
      </div>
    </div>
  `);
}
function mmToggleFs(wrap, world, W, H, btn) {
  const on = !wrap.classList.contains('mm-fs');
  wrap.classList.toggle('mm-fs', on);
  document.body.classList.toggle('mm-locked', on);
  if (btn) btn.innerHTML = `<i class="fas fa-${on ? 'compress' : 'expand'}"></i>`;
  setTimeout(() => mmFit(wrap, world, W, H), 80);
}
// Échap quitte le plein écran (bureau) — posé une seule fois pour la page
if (!window.__mmFsKeyBound) {
  window.__mmFsKeyBound = true;
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const fs = document.querySelector('.mmap-wrap.mm-fs');
    if (!fs) return;
    fs.classList.remove('mm-fs');
    document.body.classList.remove('mm-locked');
    const btn = fs.querySelector('[data-mm-zoom="fs"]');
    if (btn) btn.innerHTML = '<i class="fas fa-expand"></i>';
    const world = fs.querySelector('.mmap-world');
    if (world) mmFit(fs, world, parseFloat(world.style.width) || 640, parseFloat(world.style.height) || 460);
  });
}
function bindMindmap(rootEl) {
  if (!rootEl) return;
  rootEl.querySelectorAll('[data-mmap]').forEach((wrap) => {
    const world = wrap.querySelector('.mmap-world');
    if (!world || wrap.__mmBound) return;
    wrap.__mmBound = true;
    const svg = world.querySelector('.mmap-lines');
    const worldDims = () => ({ W: parseFloat(world.style.width) || 640, H: parseFloat(world.style.height) || 460 });
    const byId = wrap.__mmNodes || {};
    const order = Object.values(byId).sort((a, b) => (a.idx || 0) - (b.idx || 0));
    // ✅ v8.43 — liaisons HIÉRARCHIQUES : carte mère → branche, branche → enfant
    const links = order
      .filter((nd) => nd.parentId && byId[nd.parentId])
      .map((nd) => ({ a: byId[nd.parentId], b: nd }));

    // ✅ v8.43 — cadrage initial : la carte entière visible (mère au centre)
    (() => { const { W, H } = worldDims(); mmFitInitial(wrap, world, W, H); })();

    // Liaisons parent → enfant — recalculées après chaque déplacement
    const redraw = () => {
      if (!svg) return;
      let paths = '';
      for (const { a, b } of links) {
        if (!a || !b) continue;
        const lk = mmLinkPath(a, b);
        paths += `<path d="${lk.d}" fill="none" stroke="${lk.color}" stroke-width="${a.level === 0 ? 3.2 : 2.2}" stroke-linecap="round" opacity="0.8" marker-end="url(#${mmMarkerRef(lk.color)})"/>`;
      }
      // ✅ élargit le cadre en direct si une carte déplacée sort du monde —
      // les liaisons ne sont JAMAIS coupées
      let bMinX = Infinity, bMinY = Infinity, bMaxX = -Infinity, bMaxY = -Infinity;
      for (const nd of order) {
        bMinX = Math.min(bMinX, nd.x); bMinY = Math.min(bMinY, nd.y);
        bMaxX = Math.max(bMaxX, nd.x + MM_CW); bMaxY = Math.max(bMaxY, nd.y + MM_CH);
      }
      const nOx = bMinX - 105, nOy = bMinY - 80;
      const nW = Math.max(620, (bMaxX + 105) - nOx), nH = Math.max(430, (bMaxY + 80) - nOy);
      const curOx = parseFloat(svg.style.left || '0') || 0, curOy = parseFloat(svg.style.top || '0') || 0;
      const curW = parseFloat(svg.getAttribute('width')) || 0, curH = parseFloat(svg.getAttribute('height')) || 0;
      if (nOx < curOx || nOy < curOy || nW > curW || nH > curH) {
        svg.style.left = `${nOx}px`; svg.style.top = `${nOy}px`;
        svg.setAttribute('width', String(Math.round(nW)));
        svg.setAttribute('height', String(Math.round(nH)));
        svg.setAttribute('viewBox', `${nOx} ${nOy} ${Math.round(nW)} ${Math.round(nH)}`);
        world.style.width = `${Math.round(nW)}px`;
        world.style.height = `${Math.round(nH)}px`;
      }
      svg.innerHTML = mmDefs() + paths;
    };
    redraw();

    const savePositions = () => {
      if (!wrap.__mmMeta || !wrap.__mmMeta.posKey) return;
      const saved = {};
      for (const nd of order) saved[nd.id] = { x: Math.round(nd.x), y: Math.round(nd.y) };
      try { localStorage.setItem('arvexa_mm_pos_' + wrap.__mmMeta.posKey, JSON.stringify(saved)); } catch (e) {}
    };

    let pts = new Map();
    let pinch = null;
    let dragCard = null;
    let dragDist = 0;

    const start = (e) => {
      if (e.target.closest && e.target.closest('.mmap-ctrl')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      dragDist = 0;
      if (pts.size === 1) {
        const ce = e.target.closest ? e.target.closest('.mmap-card') : null;
        const nd = ce ? byId[ce.dataset.node] : null;
        dragCard = nd ? { el: ce, nd } : null;
      }
      if (pts.size === 2) {
        dragCard = null; // pincement = zoom, jamais un déplacement de carte
        const [p1, p2] = [...pts.values()];
        pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) };
      }
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    };
    const move = (e) => {
      const prev = pts.get(e.pointerId);
      if (!prev) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const st = wrap.__mmSt || { s: 1, x: 0, y: 0 };
      if (pts.size === 1 && dragCard) {
        // ✅ v8.42 — on DÉPLACE LA CARTE (delta écran ÷ zoom = delta monde)
        const dx = (e.clientX - prev.x) / st.s;
        const dy = (e.clientY - prev.y) / st.s;
        dragDist += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
        dragCard.nd.x += dx;
        dragCard.nd.y += dy;
        dragCard.el.style.left = `${dragCard.nd.x.toFixed(1)}px`;
        dragCard.el.style.top = `${dragCard.nd.y.toFixed(1)}px`;
        redraw();
        wrap.__mmDirty = true;
      } else if (pts.size === 1) {
        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        dragDist += Math.abs(dx) + Math.abs(dy);
        mmApplyTransform(wrap, world, { s: st.s, x: st.x + dx, y: st.y + dy });
      } else if (pts.size === 2 && pinch) {
        const [p1, p2] = [...pts.values()];
        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        if (pinch.d > 0 && d > 0) {
          const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
          const rect = wrap.getBoundingClientRect();
          mmZoomAt(wrap, world, mid.x - rect.left, mid.y - rect.top, d / pinch.d);
        }
        pinch = { d };
      }
    };
    const end = (e) => {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (dragCard) {
        if (dragDist <= 8) {
          // tap sans déplacement → modale d'explication (révision)
          openMindmapModal(dragCard.nd, wrap.__mmMeta || null);
        } else if (wrap.__mmDirty) {
          savePositions(); // ✅ positions trouvées à la prochaine visite
        }
        dragCard = null;
        wrap.__mmDirty = false;
      }
      dragDist = 0;
    };
    wrap.addEventListener('pointerdown', start);
    wrap.addEventListener('pointermove', move);
    wrap.addEventListener('pointerup', end);
    wrap.addEventListener('pointercancel', end);
    wrap.addEventListener('pointerleave', (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; });

    wrap.querySelectorAll('[data-mm-zoom]').forEach((b) => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = wrap.getBoundingClientRect();
        const kind = b.dataset.mmZoom;
        const { W, H } = worldDims();
        if (kind === 'fit') mmFit(wrap, world, W, H);
        else if (kind === 'fs') mmToggleFs(wrap, world, W, H, b);
        else mmZoomAt(wrap, world, rect.width / 2, rect.height / 2, kind === 'in' ? 1.28 : 0.78);
      });
    });
  });
}

        <span class="sm-ind" id="smInd"></span>
        <button class="sm-tab" data-sm-tab="resume" role="tab"><i class="fas fa-book-open"></i> Résumé</button>
        <button class="sm-tab" data-sm-tab="qcm" role="tab"><i class="fas fa-circle-question"></i> Questionnaires</button>
        <button class="sm-tab" data-sm-tab="mindmap" role="tab"><i class="fas fa-diagram-project"></i> Carte mentale</button>
      </div>

      <div class="sm-panel" data-sm-panel="resume">
        <div class="content-section">
          <div class="content-section-title"><i class="fas fa-paste"></i>Ton cours</div>
          <div class="raw-input" id="rawInput">${safeText(s.rawInput)}</div>
          <button class="expand-btn" id="expandRawBtn">
            <i class="fas fa-chevron-down"></i>
            <span>Voir tout</span>
          </button>
        </div>
        <div id="analysisContainer"></div>
      </div>

      <div class="sm-panel" data-sm-panel="qcm">
        <div id="qcmPanel"></div>
      </div>

      <div class="sm-panel" data-sm-panel="mindmap">
        <div id="mmPanel"></div>
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-pen"></i>Mes notes</div>
        <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles...">${escapeHtml(s.userNotes || '')}</textarea>
        <div class="notes-status" id="notesStatus"></div>
      </div>

      ${EXAM_SUBJECT_MAP[subject] ? `
      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>Teste-toi sur cette partie</div>
        <button class="cta-exam" id="goToExamBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Tester mes connaissances</div>
            <div class="cta-exam-sub">Teste-toi dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>` : (subject === 'anglais' ? `
      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>Teste-toi sur cette partie</div>
        <div class="block">
          <div class="block-head"><i class="fas fa-circle-info"></i>Pas de test en anglais</div>
          <div class="block-body">Test moi n'est pas disponible pour l'anglais. Utilise la banque de questions de cette section pour te tester.</div>
        </div>
      </div>` : '')}
    `;

    const container = $('analysisContainer');
    // ✅ v8.48a — signature de complétion : « complete » si explication + parties
    // + structure + questions sont réellement là ; sinon « partial » → le bloc
    // « Terminer la section » appelle l'action completeSection (seules les
    // parties manquantes sont régénérées, puis la vue se repeint).
    const comp = analysisCompleteness(a, profile);
    const sigMode = comp.all ? 'complete' : 'partial';
    container.innerHTML = renderAnalysis(a, profile, { noQuestions: true, signature: sigMode });

    // ✅ v8.48a — « Terminer la section » : finit ce que la 1re passe a laissé
    // en plan (fenêtre TPM saturée, budget) — le contenu est fusionné puis la
    // vue est repeinte avec la signature complète.
    $('finishSectionBtn')?.addEventListener('click', async () => {
      const btn = $('finishSectionBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Terminaison…'; }
      try {
        await callApi('completeSection', { subject, chapterId, sectionId });
        showToast('Section terminée — résumé complet signé ARVEXA IA', 'success');
        await renderSectionView(params);
      } catch (e) {
        showToast(e.message || 'Complétion impossible — réessaie dans un instant', 'error', 5000);
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-flag-checkered"></i> Terminer'; }
      }
    });

    // ═══ Onglets — pastille coulissante + navigation fluide (v8.40) ═══
    const tabsBar = $('smTabs');
    const ind = $('smInd');
    const TABS = ['resume', 'qcm', 'mindmap'];

    function mountQcmPanel() {
      const panel = $('qcmPanel');
      if (!panel) return;
      const questions = safeArray(a.questions);
      const rendered = ex.qcm ? renderQcmShort(ex.qcm) : '';
      if (ex.qcm && rendered) {
        // ✅ v8.48a — signature visible : le questionnaire a été écrit en entier
        // (la réponse IA sans signature de complétion est rejetée côté serveur).
        const qcmSig = `<div class="mini-signature"><i class="fas fa-circle-check"></i> QCM complet — signé ARVEXA IA</div>`;
        panel.innerHTML = qcmSig + rendered + (questions.length > 0 ? `
          <div class="content-section">
            <div class="content-section-title"><i class="fas fa-circle-question"></i>Questionnaires possibles — réponses rédigées <span class="count">${questions.length}</span></div>
            <div class="qa-list">${questions.map((q, i) => renderQuestion(q, i)).join('')}</div>
          </div>` : '');
        bindQcmShort(panel);
        panel.querySelectorAll('.qa-item').forEach((item) => {
          item.querySelector('.qa-question')?.addEventListener('click', () => item.classList.toggle('open'));
        });
      } else {
        // ✅ v8.44a — QCM en cache mais de forme inexploitable → on le lâche et
        // le bouton « Générer » reste VIVANT (plus jamais de blocage silencieux)
        if (ex.qcm && !rendered) ex.qcm = null;
        if (ex.loading.qcm) {
          panel.innerHTML = extrasGeneratingHtml('qcm');
        } else {
          panel.innerHTML = extrasErrorHtml('qcm');
          panel.querySelector('[data-extras-gen="qcm"]')?.addEventListener('click', () => launchExtras('qcm'));
        }
      }
    }

    function mountMmPanel() {
      const panel = $('mmPanel');
      if (!panel) return;
      let mmBuilt = null;
      if (ex.mindmap) {
        try { mmBuilt = renderMindmap(ex.mindmap, extrasKey(subject, chapterId, sectionId)); }
        catch (e) { console.warn('[MM v8.44a] rendu impossible — régénération', e); mmBuilt = null; }
      }
      if (ex.mindmap && mmBuilt) {
        // ✅ v8.48a — signature visible : la carte a été générée ENTIÈREMENT
        // (dernière branche incluse) — preuve de complétion exigée du modèle.
        panel.innerHTML = `<div class="mini-signature"><i class="fas fa-circle-check"></i> Carte mentale complète — signé ARVEXA IA</div>` + mmBuilt.html;
        // ✅ v8.42 — données des cartes + clé de positions pour la modale/sauvegarde
        const wrapEl = panel.querySelector('[data-mmap]');
        if (wrapEl) { wrapEl.__mmNodes = mmBuilt.byId; wrapEl.__mmMeta = { idea: mmBuilt.idea, posKey: mmBuilt.posKey }; }
        bindMindmap(panel);
      } else {
        // ✅ v8.44a — carte en cache mais non affichable (forme invalide ou
        // exception) → ON LA LÂCHE : le bouton « Générer la carte mentale »
        // régénère VRAIMENT au lieu de ne rien faire (cause exacte du
        // « le bouton ne marche pas » signalé par le propriétaire).
        if (ex.mindmap && !mmBuilt) ex.mindmap = null;
        if (ex.loading.mindmap) {
          panel.innerHTML = extrasGeneratingHtml('mindmap');
        } else {
          panel.innerHTML = extrasErrorHtml('mindmap');
          panel.querySelector('[data-extras-gen="mindmap"]')?.addEventListener('click', () => launchExtras('mindmap'));
        }
      }
    }

    async function launchExtras(kind, isAuto, _retried) {
      // ✅ v8.44a — isAuto : les essais AUTOMATIQUES (ouverture d'onglet) sont
      // bornés à 2 par section et par page ; le BOUTON « Générer » reste
      // toujours actif (un clic explicite ne compte pas dans la borne).
      if (ex.loading[kind]) return;
      if (ex[kind]) return; // contenu valide déjà prêt → rien à faire
      if (isAuto && (ex.autoTries[kind] || 0) >= 2) return;
      if (isAuto) ex.autoTries[kind] = (ex.autoTries[kind] || 0) + 1;
      ex.loading[kind] = true;
      const panel = kind === 'qcm' ? $('qcmPanel') : $('mmPanel');
      if (panel) panel.innerHTML = extrasGeneratingHtml(kind);
      try {
        await fetchSectionExtras(subject, chapterId, sectionId, [kind]);
        if (kind === 'qcm') mountQcmPanel(); else mountMmPanel();
        // ✅ v8.46a — LE TOAST NE CRIE « PRÊT » QUE SI C'EST VRAIMENT AFFICHÉ :
        // le symptôme « ça affiche que la carte a été générée mais je ne vois
        // pas la map » venait du toast lancé MÊME quand le rendu rejetait le
        // contenu (bouton réaffiché + message trompeur). Désormais contenu
        // reçu mais non affichable = échec traité comme les autres.
        const rendered = kind === 'qcm'
          ? Boolean(panel && panel.querySelector('[data-qcmz]'))
          : Boolean(panel && panel.querySelector('[data-mmap]'));
        if (rendered) {
          showToast(kind === 'qcm' ? 'QCM prêt — bon entraînement !' : 'Carte mentale prête !', 'success');
        } else {
          throw new Error('Réponse IA inutilisable — nouveau modèle sollicité');
        }
      } catch (e) {
        ex.loading[kind] = false;
        // ✅ v8.46a — MODELES GRATUITS SATURÉS (429/5xx/réseau/forme invalide) :
        // UNE relance auto silencieuse après 2,5 s — les modèles :free sont
        // limités en cadence, un second essai passe dans la grande majorité
        // des cas. Bornée à 1 (jamais de boucle), jamais après un échec auth.
        const transient = e.code === 'NETWORK_ERROR' || e.status === 429
          || (e.status || 0) >= 500 || !e.status
          || /inutilisable|illisible/i.test(e.message || '');
        if (!_retried && transient) {
          if (panel) panel.innerHTML = extrasGeneratingHtml(kind);
          await new Promise((r) => setTimeout(r, 2500));
          if (!ex.loading[kind]) return launchExtras(kind, false, true);
        }
        if (panel) {
          const msg = /auth|connexion requise/i.test(e.message || '')
            ? (e.message || 'Connexion requise.')
            : 'Les modèles IA sont saturés pour un instant — une relance suffit presque toujours.';
          panel.innerHTML = extrasErrorHtml(kind, msg);
          panel.querySelector(`[data-extras-gen="${kind}"]`)?.addEventListener('click', () => launchExtras(kind));
        }
      }
    }

    function setSmTab(name) {
      const idx = Math.max(0, TABS.indexOf(name));
      tabsBar.querySelectorAll('.sm-tab').forEach((b) => b.classList.toggle('active', b.dataset.smTab === name));
      // pastille coulissante : 2 gaps de 4px entre les 3 onglets
      ind.style.transform = `translateX(calc(${idx * 100}% + ${idx * 8}px))`;
      el.querySelectorAll('.sm-panel').forEach((p) => p.classList.toggle('active', p.dataset.smPanel === name));
      try { sessionStorage.setItem(tabKey, name); } catch (e) {}
      if (name === 'qcm') {
        mountQcmPanel();
        // ✅ génération à la demande : premier ouvert → l'IA la lance toute seule
        if (!ex.qcm && !ex.loading.qcm) launchExtras('qcm', true);
      } else if (name === 'mindmap') {
        mountMmPanel();
        if (!ex.mindmap && !ex.loading.mindmap) launchExtras('mindmap', true);
      }
    }

    tabsBar.querySelectorAll('.sm-tab').forEach((b) => b.addEventListener('click', () => setSmTab(b.dataset.smTab)));
    setSmTab(TABS.includes(initialTab) ? initialTab : 'resume');

    $('expandRawBtn')?.addEventListener('click', () => {
      const raw = $('rawInput');
      raw.classList.toggle('expanded');
      const span = $('expandRawBtn').querySelector('span');
      span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
    });

    // ✅ v8.38 — renommer la section (ajuster la proposition IA)
    $('renameSectionBtn')?.addEventListener('click', () => {
      openRenameModal({
        heading: 'Renommer la section',
        title: s.title,
        onSave: async (t) => {
          await callApi('renameSection', { subject, chapterId, sectionId, title: t });
          showToast('Section renommée', 'success');
          state.autoAdded = null;
          delete state.cache.chapter[`${subject}/${chapterId}`];
          applyRoute({ view: 'section', params: { subject, chapterId, sectionId } });
        }
      });
    });

    // ✅ v8.40 — les liaisons qa-item / qcm-item vivent maintenant dans
    // mountQcmPanel() (onglet Questionnaires) ; plus de bindings fantômes ici.

    let notesTimer = null;
    $('notesArea')?.addEventListener('input', () => {
      const status = $('notesStatus');
      status.textContent = 'Enregistrement...';
      clearTimeout(notesTimer);
      notesTimer = setTimeout(async () => {
        try {
          await callApi('updateNotes', { subject, chapterId, sectionId, userNotes: $('notesArea').value });
          delete state.cache.chapter[`${subject}/${chapterId}`];
          status.textContent = 'Enregistré';
          status.className = 'notes-status saved';
          setTimeout(() => { status.textContent = ''; status.className = 'notes-status'; }, 2000);
        } catch (e) {
          status.textContent = 'Erreur';
          status.className = 'notes-status';
        }
      }, 1400);
    });

    $('goToExamBtn')?.addEventListener('click', function () {
      var subj = $('goToExamBtn').dataset.subject;
      var chap = $('goToExamBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible dans Test moi.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });


  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-file', 'Section introuvable', 'Cette section n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ══════════════════════════════════════════════════════════════
// RENDU ANALYSE (identique à la version précédente)
// ══════════════════════════════════════════════════════════════
// ✅ v8.47a — POINTS CLÉS À RETENIR (demande du propriétaire : « le résumé
// doit donner les points qu'il est à retenir et indispensable ») : bloc mis
// EN TÊTE du résumé, alimenté par explanation.keyFacts (tous les profils IA
// le produisent désormais). Filet de sécurité : si une ancienne analyse
// n'a pas keyFacts, on dérive les points des « À retenir » des parties.
// ════════════════════════════════════════════════════════════════
// ✅ v8.48a — SIGNATURE DE COMPLÉTION (demande du propriétaire : « à la fin
// tu mets une signature qui prouve que l'IA a terminé la section complète du
// résumé — elle signe pour donner une preuve »). Côté serveur, chaque réponse
// IA doit porter "signature":"ARVEXA-COMPLETE" en dernier champ (une sortie
// coupée est rejetée et relais au modèle suivant). Côté client, le badge
// visible n'est affiché QUE si toutes les parties sont réellement présentes.
// Si des parties manquent → bouton « Terminer la section » → action
// completeSection qui régénère UNIQUEMENT ce qui manque.
// ════════════════════════════════════════════════════════════════
function analysisCompleteness(a, profile) {
  const x = a || {};
  const expl = x.explanation || {};
  const explReal = typeof expl.understanding === 'string'
    && expl.understanding.trim().length > 20
    && !expl.understanding.includes("n'a pas pu être générée")
    && !expl.understanding.includes('Analyse automatique indisponible');
  // ✅ v8.48a — l'histoire-géo est NARRATIVE par conception : pas de « parts »
  // exigées, ce sont les points clés (3+) qui prouvent que l'explication est
  // entière — aligné sur sectionCompleteness du serveur.
  const factsOk = safeArray(expl.keyFacts).length >= 3;
  const partsOk = safeArray(expl.parts).length > 0;
  const structOk = Boolean(x.structure && typeof x.structure === 'object' && Object.keys(x.structure).length > 0);
  const qOk = safeArray(x.questions).length >= 4;
  return {
    explanation: explReal && (profile === 'history' ? factsOk : partsOk),
    structure: structOk,
    questions: qOk,
    get all() { return explReal && (profile === 'history' ? factsOk : partsOk) && structOk && qOk; }
  };
}

function renderCompletionSignature(opts = {}) {
  const { complete = false, withButton = false } = opts;
  if (complete) {
    return `<div class="ai-signature" data-ai-signature="1">
      <span class="ai-signature-seal"><i class="fas fa-check"></i></span>
      <div class="ai-signature-txt">
        <strong>Résumé complet</strong>
        <span>L'IA a terminé la section entière — signé ARVEXA IA</span>
      </div>
      <i class="fas fa-award ai-signature-award"></i>
    </div>`;
  }
  if (!withButton) return '';
  return `<div class="ai-signature partial" data-ai-signature="1">
    <span class="ai-signature-seal warn"><i class="fas fa-triangle-exclamation"></i></span>
    <div class="ai-signature-txt">
      <strong>Section incomplète</strong>
      <span>Des parties du résumé manquent — termine-la en un tap</span>
    </div>
    <button class="ai-signature-btn" id="finishSectionBtn">
      <i class="fas fa-flag-checkered"></i> Terminer
    </button>
  </div>`;
}

function renderKeyFacts(expl, parts) {
  let facts = safeArray(expl.keyFacts)
    .map((f) => String(f || '').trim())
    .filter(Boolean);
  if (facts.length === 0) {
    const seen = new Set();
    safeArray(parts).forEach((p) => {
      const r = String(p.toRemember || p.memorize || '').trim();
      if (r && !seen.has(r)) { seen.add(r); facts.push(r); }
    });
    facts = facts.slice(0, 6);
  }
  if (facts.length === 0) return '';
  return `<div class="block keyfacts" style="margin-top:12px;">
    <div class="block-head"><i class="fas fa-star"></i>Points clés à retenir</div>
    <div class="block-body"><ul class="simple-list">${facts.map((f, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(f)}</span></li>`).join('')}</ul></div>
  </div>`;
}

function renderAnalysis(a, profile, opts = {}) {
  let html = '';
  const expl = a.explanation || {};
  if (expl.understanding) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-graduation-cap"></i>L'explication du prof</div>
      <div class="block">
        <div class="block-head"><i class="fas fa-lightbulb"></i>Ce que tu dois comprendre</div>
        <div class="block-body">${safeTextP(expl.understanding)}</div>
      </div>
      ${renderKeyFacts(expl, safeArray(expl.parts))}
      ${safeArray(expl.parts).map((p) => renderPart(p, profile)).join('')}
      ${expl.context ? `<div class="block" style="margin-top:12px;">
        <div class="block-head"><i class="fas fa-landmark"></i>Contexte</div>
        <div class="block-body">${safeTextP(expl.context)}</div>
      </div>` : ''}
    </div>`;
  }
  if (a.structure) html += renderStructure(a.structure, profile);
  // ✅ v8.40 — la banque de questions vit dans l'onglet « Questionnaires » :
  // l'onglet Résumé montre JUSTE le cours (demande propriétaire).
  const questions = opts.noQuestions ? [] : safeArray(a.questions);
  if (questions.length > 0) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-circle-question"></i>Banque de questions <span class="count">${questions.length}</span></div>
      <div class="qa-list">${questions.map((q, i) => renderQuestion(q, i)).join('')}</div>
    </div>`;
  }
  // ✅ v8.48a — SIGNATURE DE COMPLÉTION en toute fin de résumé (preuve visible
  // que l'IA a terminé la section complète) — ou bloc « Terminer la section »
  // si des parties manquent (coupure historique). opts.signature est fourni
  // par renderSectionView : 'complete' | 'partial' | null.
  if (opts.signature === 'complete') {
    html += renderCompletionSignature({ complete: true });
  } else if (opts.signature === 'partial') {
    html += renderCompletionSignature({ complete: false, withButton: true });
  }
  // ✅ v4.14 — QCM retiré (débordements récurrents sur mobile) :
  // la section livre l'explication du prof + la banque de questions.
  // renderQcm/CSS restent dans le fichier pour une réactivation éventuelle.
  if (!html && a.fallback) {
    html = `<div class="block">
      <div class="block-head"><i class="fas fa-info-circle"></i>Information</div>
      <div class="block-body">L'analyse automatique est indisponible. Réessaie en ajoutant une nouvelle section ou en réessayant plus tard.</div>
    </div>`;
  }
  return html;
}

function renderPart(p, profile) {
  const partTitle = p.partTitle || p.title || 'Partie';
  const mainIdea = p.mainIdea || p.idea || '';
  const explanation = p.simpleExplanation || p.explanation || '';
  const terms = p.keyTerms || p.terms || [];
  const toRemember = p.toRemember || p.memorize || '';

  let extra = '';
  if (profile === 'svt' && p.mechanism) {
    const steps = safeArray(p.mechanism.steps);
    if (steps.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚙️ ${safeTextP(p.mechanism.description || 'Mécanisme')}</div>
        <ol class="method-list">${steps.map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>
      </div>`;
    }
  }
  if (profile === 'philosophy') {
    const args = safeArray(p.arguments);
    if (args.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚖️ Arguments</div>
        <ul class="simple-list">${args.map((arg, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(arg)}</span></li>`).join('')}</ul>
      </div>`;
    }
    const examples = safeArray(p.everydayExamples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">💡 Exemples du quotidien</div>
        <ul class="simple-list">${examples.map((ex, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(ex)}</span></li>`).join('')}</ul>
      </div>`;
    }
  }
  if (profile === 'language') {
    const examples = safeArray(p.examples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">📝 Exemples</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${examples.map((ex) => `
            <div>
              <div style="font-size:14px;color:var(--text-light);font-weight:600;">${safeTextP(ex.english)}</div>
              <div style="font-size:13px;color:var(--text-dim);font-style:italic;">→ ${safeTextP(ex.french)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
    const mistakes = safeArray(p.commonMistakes);
    if (mistakes.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚠️ Pièges pour francophones</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${mistakes.map((m) => `
            <div style="font-size:13px;color:var(--text-body);line-height:1.55;">
              <span style="color:var(--danger-light);">❌ ${safeTextP(m.mistake)}</span><br>
              <span style="color:var(--success-light);">✅ ${safeTextP(m.correction)}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }
  const relations = safeArray(p.relations);
  if (relations.length > 0) {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">🔗 Relations</div>
      <ul class="simple-list">${relations.map((r, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(r)}</span></li>`).join('')}</ul>
    </div>`;
  }
  if (profile === 'scientific' && p.example && typeof p.example === 'string') {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">📙 Exemple</div>
      <div style="font-size:13.5px;color:var(--text-body);line-height:1.6;">${safeTextP(p.example)}</div>
    </div>`;
  }

  let termsHtml = '';
  const safeTerms = safeArray(terms);
  if (safeTerms.length > 0) {
    termsHtml = `<div class="part-terms">
      <div class="part-terms-title">📚 Termes importants</div>
      <div class="part-terms-list">
        ${safeTerms.map((t) => {
          if (profile === 'language' && t.english) {
            return `<div class="part-term"><strong>${safeTextP(t.english)}</strong> — ${safeTextP(t.french || t.meaning || '')}${t.example ? ` <span style="color:var(--text-muted);">(${safeTextP(t.example)})</span>` : ''}</div>`;
          }
          const term = t.term || t.name || '';
          const meaning = t.meaning || t.definition || '';
          return `<div class="part-term"><strong>${safeTextP(term)}</strong> — ${safeTextP(meaning)}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let rememberHtml = '';
  if (toRemember && typeof toRemember === 'string' && toRemember.trim()) {
    rememberHtml = `<div class="part-remember"><strong>À retenir</strong>${safeTextP(toRemember)}</div>`;
  }

  return `
    <div class="part">
      <div class="part-title">${safeTextP(partTitle)}</div>
      ${mainIdea ? `<div class="part-idea">${safeTextP(mainIdea)}</div>` : ''}
      ${explanation ? `<div class="part-explanation">${safeTextP(explanation)}</div>` : ''}
      ${termsHtml}
      ${extra}
      ${rememberHtml}
    </div>
  `;
}

async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = safeArray(data.sections);

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section à afficher.');
      return;
    }

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';
      if (a.explanation?.understanding) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-lightbulb"></i>À comprendre</div>
          <div class="block-body">${safeTextP(a.explanation.understanding)}</div>
        </div>`;
        content += renderKeyFacts(a.explanation, safeArray(a.explanation.parts));
      }
      if (a.explanation?.parts) {
        content += safeArray(a.explanation.parts).map((p) => renderPart(p, s.profile || 'scientific')).join('');
      }
      if (a.structure) content += renderStructure(a.structure, s.profile || 'scientific');
      if (s.userNotes && s.userNotes.trim()) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-pen"></i>Mes notes</div>
          <div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div>
        </div>`;
      }
      return `
        <div style="margin-bottom:32px;">
          <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Section ${i + 1}</div>
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:14px;">${escapeHtml(s.title)}</div>
          ${content}
        </div>
      `;
    }).join('');

    const chapterTitle = data.chapter.title || '';

    el.innerHTML = `
      <div class="page-hero" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">${info.emoji}</div>
        <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;">${escapeHtml(info.label)}</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text-light);margin-bottom:6px;">${escapeHtml(chapterTitle)}</h1>
        <div style="font-size:13px;color:var(--text-dim);">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      <div class="content-section" style="margin-bottom:32px;">
        <button class="cta-exam" id="goToExamLessonBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Tester mes connaissances</div>
            <div class="cta-exam-sub">Teste tout le chapitre dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>

      ${sectionsHtml}
    `;

    $('goToExamLessonBtn')?.addEventListener('click', function () {
      var subj = $('goToExamLessonBtn').dataset.subject;
      var chap = $('goToExamLessonBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible dans Test moi.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').classList.remove('center');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(html, { center = false } = {}) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  if (center) $('modalBackdrop').classList.add('center');
  document.body.style.overflow = 'hidden';
  $('modalBackdrop').querySelector('.modal-close')?.addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
  // ✅ v8.48a — APPUI SIMPLE SUR LES CARTES DE LA CARTE MENTALE : quand la
  // modale est ouverte depuis un `pointerup` (tap sur une carte), le navigateur
  // mobile synthétise le `click` du tap APRÈS le pointerup — il tombait sur le
  // fond de la modale fraîchement affichée → la modale se fermait aussitôt.
  // L'élève devait alors faire un APPUI LONG pour voir l'explication. On
  // avale donc le PREMIER click qui suit l'ouverture (fenêtre 700 ms) : un
  // tap simple ouvre désormais l'explication, et un vrai tap de fermeture
  // (après 700 ms) fonctionne normalement.
  if (!openModal.__swallowInit) {
    openModal.__swallowInit = true;
    openModal.__swallow = ({ swallowMs = 700 } = {}) => {
      const kill = (ev) => { ev.stopPropagation(); ev.preventDefault(); cleanup(); };
      const cleanup = () => {
        document.removeEventListener('click', kill, true);
        clearTimeout(timer);
      };
      const timer = setTimeout(cleanup, swallowMs);
      document.addEventListener('click', kill, true);
    };
  }
  openModal.__swallow();
}

function confirmDelete({ title, message, onConfirm }) {
  openModal(`
    <div class="modal-confirm">
      <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
      <h3>${escapeHtml(title)}</h3>
      <p>${message}</p>
      <div class="modal-confirm-buttons">
        <button class="btn-cancel" id="confirmCancelBtn">Annuler</button>
        <button class="btn-danger" id="confirmDeleteBtn">Supprimer</button>
      </div>
    </div>
  `, { center: true });

  $('confirmCancelBtn').addEventListener('click', closeModal);
  $('confirmDeleteBtn').addEventListener('click', async () => {
    const btn = $('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
      await onConfirm();
      closeModal();
    } catch (e) {
      showToast(e.message || 'Impossible de supprimer', 'error');
      btn.disabled = false;
      btn.textContent = 'Supprimer';
    }
  });
}

  const info = SUBJECTS[subject];
  openModal(`

      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Nouveau chapitre</h2>
        <p>${info.emoji} ${escapeHtml(info.label)}</p>
      </div>
      <div class="form-field">

      <button class="btn-full primary" id="createChapterBtn" disabled>
        <span class="btn-icon"><i class="fas fa-plus"></i></span>
        <span class="btn-text">Créer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const input = $('newChapterTitle');
  const btn = $('createChapterBtn');
  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
  btn.addEventListener('click', async () => {
    const title = input.value.trim();
    if (title.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await callApi('createChapter', { subject, title });
      showToast('Chapitre créé', 'success');
      delete state.cache.chapters[subject];
      closeModal();
      applyRoute({ view: 'notebook', params: { subject } });
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
  setTimeout(() => input.focus(), 200);
}

// ── Helpers de dictée (déduplication anti-chevauchement, partagés) ──
const AC_STUTTER_KEEP = { oui: 1, non: 1, tres: 1, bien: 1, jamais: 1, encore: 1, toujours: 1 };
function acNormTok(w) {
  let s = String(w || '').toLowerCase().replace(/\u0153/g, 'oe');
  try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
  return s.replace(/[^a-z0-9']+/g, '');
}
function acWordsOf(t) { return String(t || '').split(/\s+/).filter(Boolean); }
function acWithoutOverlap(base, txt) {
  if (!base || !txt) return txt || '';
  const bw = acWordsOf(base); const tw = acWordsOf(txt);
  const twN = tw.map(acNormTok).join(' ');
  const winN = bw.slice(Math.max(0, bw.length - tw.length - 8)).map(acNormTok).join(' ');
  if (twN && winN.indexOf(twN) !== -1) return '';
  const maxK = Math.min(bw.length, tw.length, 60);
  for (let k = maxK; k >= 1; k--) {
    let ok = true;
    for (let i = 0; i < k; i++) {
      if (acNormTok(bw[bw.length - k + i]) !== acNormTok(tw[i])) { ok = false; break; }
    }
    if (ok) return tw.slice(k).join(' ');
  }
  return txt;
}
function acMergeNoOverlap(prev, next) {
  if (!prev) return next || '';
  if (!next) return prev;
  const kept = acWithoutOverlap(prev, next);
  return kept ? prev + ' ' + kept : prev;
}
function acCollapseStutter(text) {
  const w = acWordsOf(text);
  const out = [];
  let i = 0;
  while (i < w.length) {
    let consumed = 1;
    for (let n = 4; n >= 2; n--) {
      if (i + 2 * n > w.length) continue;
      let ok = true;
      for (let j = 0; j < n; j++) {
        if (acNormTok(w[i + j]) !== acNormTok(w[i + n + j])) { ok = false; break; }
      }
      if (ok) { consumed = n; break; }
    }
    if (consumed === 1) {
      out.push(w[i]);
      const tok = acNormTok(w[i]);
      let j = i + 1;
      while (j < w.length && acNormTok(w[j]) === tok) {
        if (AC_STUTTER_KEEP[tok]) out.push(w[j]);
        j++;
      }
      i = j;
    } else {
      for (let j = 0; j < consumed; j++) out.push(w[i + j]);
      i += consumed;
      while (i + consumed <= w.length) {
        let same = true;
        for (let j = 0; j < consumed; j++) {
          if (acNormTok(w[i + j]) !== acNormTok(w[i - consumed + j])) { same = false; break; }
        }
        if (!same) break;
        i += consumed;
      }
    }
  }
  return out.join(' ');
}

// ── pdf.js LOCAL (assets/pdfjs, même origine — pattern lecture.html) ──
let __acPdfJsLoading = null;
function acEnsurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (__acPdfJsLoading) return __acPdfJsLoading;
  __acPdfJsLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'assets/pdfjs/pdf.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) { reject(new Error('pdfjs')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/pdfjs/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { __acPdfJsLoading = null; reject(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return __acPdfJsLoading;
}

// Extraction de la couche TEXTE du PDF (rapide, exacte). Si le PDF est un
// scan (presque aucun texte) → retour scanned:true et la page passera par l'OCR.
async function acExtractPdfText(file, onProgress) {
  let lib;
  try { lib = await acEnsurePdfJs(); } catch (e) { throw new Error('Impossible de charger le lecteur PDF.'); }
  let pdf;
  try { pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise; }
  catch (e) { throw new Error('Impossible de lire ce PDF — essaie un autre fichier.'); }

  const maxPages = Math.min(pdf.numPages, 10);
  let text = '';
  for (let p = 1; p <= maxPages; p++) {
    if (onProgress) onProgress(p, maxPages, pdf.numPages);
    if (window.__acJobApi && window.__acJobApi.cancelled()) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' }); // ✅ v8.40
    try {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let lastY = null, pageText = '';
      for (const it of tc.items) {
        if (!it.str) continue;
        const y = it.transform ? Math.round(it.transform[5]) : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) pageText += '\n';
        else if (pageText && !/\s$/.test(pageText) && !/^\s/.test(it.str)) pageText += ' ';
        pageText += it.str;
        if (y !== null) lastY = y;
      }
      if (pageText.trim()) text += (text ? '\n\n' : '') + pageText.trim();
    } catch (e) { /* page illisible : on continue */ }
    if (text.length >= MAX_CONTENT_LENGTH * 2) break;
  }
  return {
    text: text.trim(),
    numPages: pdf.numPages,
    scanned: text.trim().length < 150
  };
}

// OCR par lots de ≤ 2 images via /api/arv?kit=1
// ✅ v8.42 — PHOTOS DE CAHIER (demande propriétaire : « Lisa n'arrive pas à
// extraire les éléments sur une image, des photos de mon cahier ») : lots de
// 2 (au lieu de 4) — chaque page reçoit toute l'attention du modèle, ce qui
// change tout pour le manuscrit ; si un lot résiste, redécoupage image par
// image. Chaque lot est retenté (3 essais) : l'important est d'EXTRAIRE.
// ✅ v8.41 — POURCENTAGE FIABLE : le % n'avance QU'À chaque lot TERMINÉ.
// onProgress(done, total, partialText) → après chaque lot fini (+ texte
// partiel accumulé pour la file) ; onBatchStart(b, total) → label seulement.
async function acOcrImages(images, onProgress, onBatchStart) {
  const batches = [];
  for (let i = 0; i < images.length; i += 2) batches.push(images.slice(i, i + 2));
  const askOnce = async (imgs) => {
    const r = await window.ARVX_AI.ask('image', { mode: 'ocr', images: imgs });
    return String(r?.data?.text || '').trim();
  };
  const parts = [];
  const failedImages = [];
  for (let b = 0; b < batches.length; b++) {
    if (window.__acJobApi && window.__acJobApi.cancelled()) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' }); // ✅ v8.40
    if (onBatchStart) onBatchStart(b, batches.length);
    const imgs = batches[b];
    let t = '';
    for (let tries = 0; tries < 3 && !t; tries++) {
      try { t = await askOnce(imgs); }
      catch (e) { if (tries < 2) await new Promise((r) => setTimeout(r, 1200)); }
    }
    if (!t && imgs.length > 1) {
      const chunk = [];
      for (const im of imgs) {
        if (window.__acJobApi && window.__acJobApi.cancelled()) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' }); // ✅ v8.40
        let one = '';
        for (let tries = 0; tries < 2 && !one; tries++) {
          try { one = await askOnce([im]); }
          catch (e) { if (tries < 1) await new Promise((r) => setTimeout(r, 1200)); }
        }
        if (one) chunk.push(one);
        // ✅ v8.42 — ZÉRO PERTE : une image qui résiste même seule est retenue
        // pour l'ULtime ressaie de fin (sinon elle serait perdue silencieusement)
        else failedImages.push(im);
      }
      t = chunk.join('\n\n');
    }
    // ✅ v8.42 — ZÉRO PERTE : chaque image qui n'a rien donné est retenue pour
    // une ULTIME tentative individuelle après la boucle (3e sécurité).
    if (!t) failedImages.push(...imgs);
    if (t) parts.push(t);
    // ✅ v8.41 — le pourcentage avance ICI (lot réellement terminé), jamais avant
    if (onProgress) onProgress(b + 1, batches.length, parts.join('\n\n'));
  }
  if (failedImages.length > 0) {
    if (onBatchStart) onBatchStart(batches.length, batches.length + 1);
    const chunk = [];
    for (const im of failedImages) {
      if (window.__acJobApi && window.__acJobApi.cancelled()) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
      let one = '';
      for (let tries = 0; tries < 2 && !one; tries++) {
        try { one = await askOnce([im]); }
        catch (e) { if (tries < 1) await new Promise((r) => setTimeout(r, 1500)); }
      }
      if (one) chunk.push(one);
    }
    if (chunk.length) {
      parts.push(chunk.join('\n\n'));
      if (onProgress) onProgress(batches.length + 1, batches.length + 1, parts.join('\n\n'));
    }
  }
  // Rien du tout après tous les secours → erreur CLAIRE (jamais un faux succès)
  if (!parts.join('\n\n').trim()) {
    throw new Error('Extraction impossible — l\'IA n\'a pas réussi à lire ces images. Réessaie avec des photos plus nettes ou moins à contre-jour.');
  }
  return parts.join('\n\n');
}

// ══════════════════════════════════════════════════════════════
// ✅ v8.40 — JOB D'EXTRACTION EN ARRIÈRE-PLAN + POURCENTAGE FIABLE
// (demandes propriétaire : « tout près de la barre ronde tu ajoutes un
// pourcentage fiable, du début jusqu'à 100 % — 100 % = extraction finie » ;
// « fais en sorte que l'extraction continue même si on est sur la page
// d'accueil, en arrière-plan, pour naviguer librement sans attendre »).
// - le pourcentage est CALCULÉ depuis les étapes réellement terminées
//   (images préparées, lots OCR finis, pages PDF lues) : monotone 0 → 100 ;
// - la PASTILLE flottante vit au niveau de la page : l'élève peut fermer la
//   modale, changer de vue dans le Résumé — l'extraction continue ; à la fin
//   la modale se rouvre toute seule sur la vérification du texte ;
// - l'ANALYSE IA finale part avec keepalive : même en quittant vers
//   l'accueil du site, la section est créée côté serveur.
// ══════════════════════════════════════════════════════════════
const acJob = {
  active: false,        // job (extraction ou analyse) en cours
  kind: '',             // 'photos' | 'pdf' | 'analyse'
  pct: 0,               // pourcentage monotone 0..100 (null pour l'analyse)
  label: '',
  cancelled: false,
  seq: 0,               // séquence pour identifier le propriétaire de la modale
  modalToken: 0,        // token de la modale qui a démarré le job
  qid: null,            // ✅ v8.41 — id de l'entrée dans la file des ajouts récents
  ctx: null,            // ✅ v8.41 — contexte capturé au DÉBUT de l'extraction (cours | section)
  ctxLabel: '',         // ✅ v8.41 — label matière pour la file
  partText: ''          // ✅ v8.41 — texte partiel déjà extrait (zéro perte)
};

function acPillEnsure() {
  let pill = document.getElementById('extractPill');
  if (!pill) {
    pill = document.createElement('div');
    pill.id = 'extractPill';
    pill.setAttribute('role', 'status');
    pill.innerHTML = `
      <div class="extract-pill-row">
        <span class="mini-spinner"></span>
        <span class="extract-pill-label"><span data-pill-label>Extraction…</span><small data-pill-sub>Tu peux naviguer, on s'occupe de tout</small></span>
        <span class="extract-pill-pct" data-pill-pct></span>
      </div>
      <div class="pct-bar"><div class="pct-bar-fill" data-pill-bar></div></div>
    `;
    document.body.appendChild(pill);
    pill.addEventListener('click', () => {
      // rouvrir la modale d'ajout : l'élève retrouve l'écran en cours
      // ✅ v8.46a — l'ANALYSE aussi se rouvre (étapes en direct, pas de restart)
      if (acJob.active && (acJob.kind === 'photos' || acJob.kind === 'pdf' || acJob.kind === 'analyse')) {
        openAddCourseModal();
      }
    });
  }
  return pill;
}

function acPillUpdate() {
  const pill = document.getElementById('extractPill');
  if (!pill) return;
  const show = acJob.active && !__isAddCourseModalOpen;
  pill.classList.toggle('show', show);
  if (!show) return;
  const label = pill.querySelector('[data-pill-label]');
  const pct = pill.querySelector('[data-pill-pct]');
  const bar = pill.querySelector('[data-pill-bar]');
  const sub = pill.querySelector('[data-pill-sub]');
  if (label) label.textContent = acJob.label;
  if (sub) sub.textContent = acJob.kind === 'analyse'
    ? 'Section créée automatiquement à la fin — tu peux même quitter la page'
    : 'Touche la pastille pour rouvrir — extraction en arrière-plan';
  if (pct) pct.textContent = (acJob.pct !== null && acJob.pct !== undefined) ? `${acJob.pct} %` : '';
  if (bar) bar.style.width = `${acJob.pct || 0}%`;
}

// Étapes réellement finies → pourcentage FIABLE (jamais de saut, jamais 100 avant la fin)
function acJobStep(pct, label) {
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  acJob.pct = Math.max(acJob.pct || 0, p); // monotone
  if (label) acJob.label = label;
  // modale : % près de la barre ronde + barre fine
  const pctEl = document.getElementById('acPct');
  const barEl = document.getElementById('acBarFill');
  const txtEl = document.getElementById('acProgTxt');
  if (pctEl) pctEl.textContent = `${acJob.pct} %`;
  if (barEl) barEl.style.width = `${acJob.pct}%`;
  if (txtEl && label) txtEl.textContent = label;
  acPillUpdate();
}

function acJobBegin(kind, label) {
  acJob.active = true;
  acJob.kind = kind;
  acJob.cancelled = false;
  acJob.pct = 0;
  acJob.label = label;
  acJob.partText = '';
  acJob.ctx = __acOpenCtx;             // ✅ v8.41 — le contexte est figé au début
  acJob.ctxLabel = (acJob.ctx && SUBJECTS[acJob.ctx.subject]) ? SUBJECTS[acJob.ctx.subject].label : '';
  // ✅ v8.41 — ZÉRO PERTE : l'extraction est enregistrée dans la file des
  // ajouts récents dès son lancement (elle reste visible même si l'élève
  // ferme la modale, quitte la page ou que l'extraction est interrompue).
  acJob.qid = `ac${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  acQueueUpsert({
    id: acJob.qid,
    mode: kind === 'analyse' ? 'texte' : kind,
    ctx: acJob.ctx ? 'section' : 'cours',
    subject: acJob.ctx ? acJob.ctx.subject : null,
    chapterId: acJob.ctx ? acJob.ctx.chapterId : null,
    ctxLabel: acJob.ctxLabel,
    title: label,
    status: 'running',
    pct: 1,
    text: '',
    createdAt: Date.now()
  });
  acPillEnsure();
  acPillUpdate();
  acJobStep(1, label);
}

// ✅ v8.41 — stocke le texte partiel au fil des lots OCR (zéro perte)
function acJobText(partial) {
  acJob.partText = String(partial || '');
  if (acJob.qid) acQueueUpsert({ id: acJob.qid, text: acJob.partText });
}

function acJobEnd(label) {
  acJob.pct = 100;
  if (label) acJob.label = label;
  acJobStep(100, label);
  acJob.active = false;
  // ✅ v8.41 — l'extraction est terminée : le texte est PRÊT dans la file
  // (l'entrée repasse « Prêt » tant que la section n'est pas créée).
  if (acJob.qid) {
    acQueueUpsert({ id: acJob.qid, status: 'done', pct: 100, text: acJob.partText, label: acJob.label });
  }
  acPillUpdate();
}

function acJobStop() {
  acJob.active = false;
  acJob.cancelled = false;
  // ✅ v8.41 — si l'extraction n'a pas abouti (annulation, erreur, page
  // quittée), le texte PARTIEL déjà extrait reste dans la file : « Reprendre ».
  if (acJob.qid) {
    const it = acQueueGet(acJob.qid);
    if (it && it.status === 'running') {
      acQueueUpsert({ id: acJob.qid, status: 'interrompu', text: acJob.partText });
    }
  }
  acPillUpdate();
}

function acJobCancel() {
  if (!acJob.active) return;
  acJob.cancelled = true;
  acJobStop();
}

// Peint l'état des étapes depuis acJob.pct (monotone, 0..100).
function acAnalysisPaint() {
  const pct = acJob.pct || 0;
  document.querySelectorAll('[data-ac-step]').forEach((row) => {
    const i = Number(row.dataset.acStep || 0);
    const mark = AC_ANALYSE_MARKS[i] || 0;
    const nextMark = AC_ANALYSE_MARKS[i + 1];
    row.classList.toggle('running', pct >= mark && (nextMark === undefined || pct < nextMark));
    row.classList.toggle('done', nextMark !== undefined ? pct >= nextMark : false);
  });
  const pctEl = document.getElementById('acPct');
  const barEl = document.getElementById('acBarFill');
  const txtEl = document.getElementById('acProgTxt');
  if (pctEl) pctEl.textContent = `${Math.round(pct)} %`;
  if (barEl) barEl.style.width = `${Math.round(pct)}%`;
  if (txtEl) {
    const run = AC_ANALYSE_STEPS.findIndex((_, i) => {
      const mark = AC_ANALYSE_MARKS[i] || 0;
      const nextMark = AC_ANALYSE_MARKS[i + 1];
      return pct >= mark && (nextMark === undefined || pct < nextMark);
    });
    txtEl.textContent = run >= 0 ? `${AC_ANALYSE_STEPS[run].name}…` : 'Analyse de ton cours…';
  }
  acPillUpdate();
}

// Horloge de progression : % monotone plafonné à 95 % tant que la réponse
// n'est pas arrivée (jamais de 100 % mensonger).
function acAnalysisTick() {
  if (!acJob.active || acJob.kind !== 'analyse') return;
  const elapsed = Date.now() - (acJob.startedAt || Date.now());
  const frac = Math.min(0.95, elapsed / AC_ANALYSE_BUDGET_MS);
  acJob.pct = Math.max(acJob.pct || 0, Math.round(frac * 100));
  acAnalysisPaint();
}
function acAnalysisBegin() {
  acJob.startedAt = Date.now();
  if (acAnalysisTimer) clearInterval(acAnalysisTimer);
  acAnalysisTimer = setInterval(acAnalysisTick, 600);
  acAnalysisTick();
}
// Réponse arrivée (succès) → toutes les étapes cochées, 100 %.
function acAnalysisMarkAllDone() {
  if (acAnalysisTimer) { clearInterval(acAnalysisTimer); acAnalysisTimer = null; }
  acJob.pct = 100;
  document.querySelectorAll('[data-ac-step]').forEach((row) => {
    row.classList.remove('running');
    row.classList.add('done');
  });
  const pctEl = document.getElementById('acPct');
  const barEl = document.getElementById('acBarFill');
  if (pctEl) pctEl.textContent = '100 %';
  if (barEl) barEl.style.width = '100%';
}
function acAnalysisStop() {
  if (acAnalysisTimer) { clearInterval(acAnalysisTimer); acAnalysisTimer = null; }
}
// « Continuer en arrière-plan » pendant l'ANALYSE : la modale se ferme, la
// pastille prend le relais, le Wake Lock est demandé (autorisation système
// : la page ne s'endort pas pendant la génération — demande propriétaire
// « demander une autorisation de continuer en arrière-plan pour forcer ça »).
function acWireAnalysisButtons() {
  $('acBgBtn')?.addEventListener('click', () => {
    closeModal();
    __isAddCourseModalOpen = false;
    try { if (window.ARVEXAWakeLock) window.ARVEXAWakeLock.acquire('analyse'); } catch (e) {}
    acPillUpdate();
    showToast('Analyse en arrière-plan — navigue librement, tout continue', 'info', 4500);
  });
  $('acCancelBtn')?.addEventListener('click', () => {
    acAnalysisStop();
    acJobStop();
    try { if (window.ARVEXAWakeLock) window.ARVEXAWakeLock.release('analyse'); } catch (e) {}
    closeModal();
    __isAddCourseModalOpen = false;
    acPillUpdate();
    // honnêteté : l'appel serveur part avec keepalive — la section peut
    // encore être créée malgré l'arrêt du suivi côté écran.
    showToast('Suivi arrêté — la section peut encore arriver dans ton cahier', 'info', 5000);

// À la fin d'une extraction : rouvrir la vérification (même modale si ouverte,
// sinon la modale se rouvre toute seule sur le texte extrait).
function acFinishExtraction(text, sourceLabel) {
  acJobEnd('Extraction terminée');
  // ✅ v8.41 — le texte extrait est désormais dans la file (statut « Prêt ») :
  // même si l'élève ferme tout, il le retrouvera en appuyant sur Ajouter.
  if (!text || String(text).trim().length === 0) {
    showToast('Aucun texte lisible — essaie d\'autres images ou un PDF texte', 'error', 5000);
    acJobStop();
    if (__isAddCourseModalOpen) showModeChoiceSafe();
    return false;
  }
  const finished = String(text);
  // ✅ v8.41 — le contexte de l'EXTRACTION (cours ou section) accompagne son
  // texte : la rouverture ne peut pas l'égarer.
  __acOpenCtx = acJob.ctx || null;
  if (__isAddCourseModalOpen && acJob.modalToken === acJob.seq) {
    try { __acSetExtractedText(finished, sourceLabel); } catch (e) { window.__acResumeText = finished; }
  } else {
    // l'élève était ailleurs (arrière-plan) → la modale se rouvre sur SON texte
    window.__acResumeText = finished;
    window.__acResumeNotice = sourceLabel || 'Extraction terminée';
    openAddCourseModal(__acOpenCtx || undefined);
    showToast('Extraction terminée — vérifie ton texte', 'success', 4000);
  }
  return true;
}

// ✅ v8.41 — FILE DES AJOUTS RÉCENTS (ZÉRO PERTE) — demande propriétaire :
// « lorsque je lance une extraction sur une image PDF et que j'appuie sur
// continuer en arrière-plan, ce qui a été extrait soit stocké comme ça il y
// aura pas de perte — par exemple ça va être stocké dans la partie ajoutée,

// dès que j'appuie sur le bouton ajouter il y aura ce qui a été ajouté
// dernièrement mais qui n'a pas été généré ».

const AC_QUEUE_KEY = 'arvexa_ac_queue_v1';
function acQueueLoad() { try { return JSON.parse(localStorage.getItem(AC_QUEUE_KEY) || '[]') || []; } catch (e) { return []; } }
function acQueueSave(list) {
  try { localStorage.setItem(AC_QUEUE_KEY, JSON.stringify(list.slice(-14))); } catch (e) {}
  try { acQueueBadge(); } catch (e) {}
}
function acQueueUpsert(entry) {
  const list = acQueueLoad();
  const i = list.findIndex((x) => x.id === entry.id);
  if (i >= 0) list[i] = { ...list[i], ...entry };
  else list.push(entry);
  acQueueSave(list);
  return entry;
}
function acQueueRemove(id) { acQueueSave(acQueueLoad().filter((x) => x.id !== id)); }
function acQueueGet(id) { return acQueueLoad().find((x) => x.id === id) || null; }
// Au chargement de la page : un job « running » est forcément mort (le JS a
// redémarré) → il devient « interrompu » avec le texte partiel conservé.
function acQueueSweepOnLoad() {
  const list = acQueueLoad();
  let changed = false;
  for (const it of list) {
    if (it.status === 'running') { it.status = 'interrompu'; changed = true; }
  }
  if (changed) acQueueSave(list);
}
