  <style>
:root {
  --primary: #1A3A2A;
  --primary-dark: #0A1A12;
  --primary-light: #2A5A3A;
  --accent: #B8860B;
  --accent-bright: #E0B84A;
  --accent-dim: rgba(184, 134, 11, 0.08);
  --success: #2D7D5A;
  --success-light: #3AB67E;
  --danger: #B85C3A;
  --danger-light: #E07A5F;
  --warning: #D4A017;
  --info: #4AAFE0;

  --bg-dark: #0A0A0A;
  --bg-surface: #141414;
  --bg-card: rgba(20, 20, 20, 0.7);
  --card-bg: rgba(20, 20, 20, 0.55);
  --block-bg: rgba(0, 0, 0, 0.25);

  --text-light: #F5F0E8;
  --text-dim: #A0A090;
  --text-muted: #7A7A6A;
  --text-body: #cfd0cc;

  --card-border: rgba(184, 134, 11, 0.06);
  --card-border-hover: rgba(224, 184, 74, 0.22);

  --transition: all 0.28s cubic-bezier(0.25, 1, 0.5, 1);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);

  --radius: 16px;
  --radius-lg: 20px;

  --header-height: 64px;
  --sidebar-width: 280px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-dark); color-scheme: dark; min-width: 320px; width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(184, 134, 11,  0.16) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);
  color: var(--text-light);
  font: 15px/1.6 'Inter', system-ui, sans-serif;
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.header {
  position: sticky; top: 0; flex-shrink: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + var(--safe-top)) 16px 10px;
  /* ✅ v8.40 — UNIFORME À LA PAGE D'ACCUEIL (forme et couleur, pas le contenu) :
     même voile, même flou, même liseré bas discret — la ligne dorée décorative
     de la version précédente est retirée. */
  background: rgba(var(--rgb-veil), 0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(184, 134, 11, 0.06);
  min-height: var(--header-height);
  position: sticky;
}
.header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid rgba(var(--rgb-soft), 0.05); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px; flex-shrink: 0;
}
.back-btn:hover {
  border-color: rgba(184, 134, 11, 0.14);
  color: var(--text-light);
}
.back-btn.hidden { display: none; }

.brand-mark {
  display: inline-flex;
  align-items: baseline;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--text-light);
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand-mark span {
  color: var(--accent-bright);
  font-style: italic;
  margin-left: 1px;
}
.header-divider {
  width: 1px; height: 20px;
  background: rgba(var(--rgb-soft), 0.08);
  flex-shrink: 0;
}

.page-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700;
  font-family: 'Playfair Display', serif;
  color: var(--text-light);
  letter-spacing: -0.01em;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-title .emoji { font-size: 16px; }
.page-title i { color: var(--accent-bright); font-size: 14px; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 1; min-width: 0; }
/* ✅ v8.40 — boutons d'action RONDS comme ceux de l'accueil (même forme,
   même couleur : rond 36px, fond doux, sans bordure). */
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: rgba(var(--rgb-soft), 0.04);
  color: var(--text-dim); transition: var(--transition); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover {
  color: var(--text-light);
  background: rgba(var(--rgb-soft), 0.07);
}

.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(var(--rgb-soft), 0.04);
  color: var(--text-dim);
  font-size: 15px;
  text-decoration: none;
  transition: var(--transition);
  flex-shrink: 0;
}
.home-btn:hover {
  color: var(--text-light);
  background: rgba(var(--rgb-soft), 0.07);
}
.home-btn i { font-size: 14px; }

.premium-badge {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.premium-badge.show { display: flex; }
.premium-badge i { font-size: 11px; }

main {
  flex: 1 1 auto; width: 100%; max-width: 820px;
  margin: 0 auto; padding: 20px 16px 60px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.greeting { margin-bottom: 20px; }
.greeting h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 6px;
}
.greeting h1 em { color: var(--accent-bright); font-style: italic; }
.greeting p { color: var(--text-dim); font-size: 14px; }

.section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--text-light);
  margin: 24px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  position: relative;
}
.section-title::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 40px; height: 2px; background: var(--accent-bright);
}
.section-title i { color: var(--accent-bright); font-size: 14px; }
.section-title .count {
  margin-left: auto;
  font-family: 'Inter', sans-serif;
  font-size: 11px; color: var(--text-muted);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em;
}

.subjects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 620px) { .subjects-grid { grid-template-columns: repeat(3, 1fr); } }

.subject-card {
  padding: 18px 16px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  cursor: pointer; transition: var(--transition);
  display: flex; flex-direction: column; gap: 10px;
  text-align: left; width: 100%;
}
.subject-card:hover {
  border-color: rgba(224, 184, 74, 0.25);
  transform: translateY(-2px);
}
.subject-card .subject-emoji { font-size: 26px; line-height: 1; }
.subject-card .subject-name {
  font-size: 14px; font-weight: 700;
  color: var(--text-light); letter-spacing: -0.01em;
}
.subject-card .subject-meta { font-size: 11.5px; color: var(--text-muted); }

.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  transition: var(--transition);
  text-align: left; width: 100%; position: relative;
}
.list-item:hover { border-color: rgba(224, 184, 74, 0.25); }

.list-item-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: rgba(224, 184, 74, 0.10);
  color: var(--accent-bright);
  border: 1px solid rgba(224, 184, 74, 0.15);
}
.list-item-body { flex: 1; min-width: 0; cursor: pointer; }
.list-item-title {
  font-size: 14.5px; font-weight: 700;
  color: var(--text-light);
  margin-bottom: 4px; line-height: 1.3;
}
.list-item-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-item-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
.list-item-arrow {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; cursor: pointer; padding: 8px;
  transition: var(--transition);
}
.list-item:hover .list-item-arrow { color: var(--accent-bright); }

.list-item-delete {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; padding: 8px 10px;
  border-radius: 10px; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent;
}
.list-item-delete:hover {
  color: var(--danger-light);
  background: rgba(184, 92, 58, 0.08);
  border-color: rgba(184, 92, 58, 0.2);
}

.list-item.new {
  background: transparent;
  border: 1px dashed rgba(224, 184, 74, 0.25);
  justify-content: center; color: var(--accent-bright);
  font-weight: 700; font-size: 14px;
  gap: 10px;
}
.list-item.new:hover { background: rgba(224, 184, 74, 0.05); border-style: solid; }
.list-item.new .list-item-icon {
  background: transparent; border: none;
  width: 24px; height: 24px; font-size: 16px;
}

.page-hero {
  padding: 20px 22px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  margin-bottom: 20px;
}
.page-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  margin-bottom: 6px; letter-spacing: -0.02em;
  line-height: 1.2;
}
.page-hero .hero-sub { color: var(--text-dim); font-size: 13px; }

.cta-card {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 15px 20px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: var(--on-gold); font-weight: 700; font-size: 14px;
  border: none; margin-bottom: 20px;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
}
.cta-card:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(184, 134, 11, 0.4); }
.cta-card:active { transform: scale(0.97); }
.cta-card i { font-size: 13px; }

.section-hero { margin-bottom: 20px; }
.section-hero .breadcrumb {
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.2; letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.section-hero .sub { font-size: 12.5px; color: var(--text-muted); }

.content-section { margin-bottom: 24px; }
.content-section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.content-section-title i { color: var(--accent-bright); font-size: 12px; }
.content-section-title .count { margin-left: auto; color: var(--text-muted); font-weight: 600; }

.raw-input {
  padding: 16px 18px; border-radius: 12px;
  background: var(--block-bg);
  border: 1px solid var(--card-border);
  font-size: 13.5px; color: var(--text-body);
  line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow: hidden; position: relative;
}
.raw-input.expanded { max-height: none; }

.expand-btn {
  margin-top: 8px; padding: 7px 14px; border-radius: 20px;
  background: transparent; border: 1px solid var(--card-border);
  color: var(--accent-bright); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: var(--transition);
}
.expand-btn:hover { border-color: rgba(224, 184, 74, 0.3); background: rgba(224, 184, 74, 0.05); }

.block {
  padding: 14px 16px; border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700;
  color: var(--accent-bright);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.block-head i { font-size: 11px; }
.block-body { font-size: 14px; color: var(--text-body); line-height: 1.7; }

.simple-list {
  list-style: none; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
/* ✅ v8.47a — bloc « Points clés à retenir » : liseré doré discret pour que
   la liste indispensable se repère au premier regard (lecture soignée). */
.block.keyfacts {
  border-color: color-mix(in srgb, var(--accent-bright) 45%, var(--card-border));
  background: linear-gradient(0deg, color-mix(in srgb, var(--accent-bright) 6%, transparent), color-mix(in srgb, var(--accent-bright) 6%, transparent)), var(--card-bg);
}
.simple-list li {
  display: flex; gap: 10px;
  font-size: 14px; color: var(--text-body); line-height: 1.6;
}
.simple-list li .num {
  color: var(--accent-bright); font-weight: 700;
  flex-shrink: 0; min-width: 18px;
}

.part {
  padding: 18px 18px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 12px;
}
.part-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.part-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--accent-bright), var(--accent));
  border-radius: 8px;
  flex-shrink: 0;
}
.part-idea {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 12px;
  padding-left: 14px;
  border-left: 2px solid rgba(224, 184, 74, 0.3);
}
.part-explanation {
  font-size: 14.5px;
  color: var(--text-body);
  line-height: 1.75;
  margin-bottom: 14px;
}
.part-terms {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--block-bg);
}
.part-terms-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.part-terms-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.part-term {
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.55;
}
.part-term strong { color: var(--text-light); }
.part-remember {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(69, 180, 125, 0.06);
  border-left: 3px solid var(--success-light);
  font-size: 13.5px;
  color: var(--success-light);
  line-height: 1.6;
}
.part-remember strong {
  color: var(--success-light);
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.formula-block {
  padding: 14px 12px; text-align: center;
  background: var(--block-bg); border-radius: 10px;
  margin-bottom: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-description {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 6px;
  font-style: italic;
}
.formula-condition {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 6px;
}
.formula-variables {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
}
.formula-variable {
  font-size: 12.5px;
  color: var(--text-body);
}
.formula-variable strong { color: var(--accent-bright); }

.method-list { list-style: none; padding: 0; counter-reset: m; }
.method-list li {
  position: relative; padding-left: 28px; counter-increment: m;
  font-size: 14px; color: var(--text-body); line-height: 1.65; margin-bottom: 8px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(m); position: absolute; left: 0; top: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(224, 184, 74, 0.12); color: var(--accent-bright);
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.example-enonce {
  padding: 10px 12px; border-radius: 10px;
  background: var(--block-bg); font-size: 13.5px;
  color: var(--text-light); line-height: 1.6; margin-bottom: 10px;
}
.example-steps { list-style: none; padding: 0; counter-reset: e; }
.example-steps li {
  position: relative; padding-left: 24px; counter-increment: e;
  font-size: 13.5px; color: var(--text-body); line-height: 1.65; margin-bottom: 6px;
}
.example-steps li::before {
  content: counter(e) '.'; position: absolute; left: 0; top: 0;
  color: var(--accent-bright); font-weight: 700;
}
.example-result {
  padding: 8px 12px; border-radius: 10px;
  background: rgba(69, 180, 125, 0.08);
  font-size: 13.5px; color: var(--success-light);
  font-weight: 600; margin-top: 8px;
}

.trap-text { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 8px; }
.trap-solution {
  padding-left: 18px; position: relative;
  font-size: 13px; color: var(--success-light); line-height: 1.65;
}
.trap-solution::before { content: '→'; position: absolute; left: 0; top: 0; font-weight: 700; }

.qa-list { display: flex; flex-direction: column; gap: 10px; }
.qa-item {
  border-radius: 12px; background: var(--card-bg);
  border: 1px solid var(--card-border);
  overflow: hidden; transition: var(--transition);
}
.qa-item.open { border-color: rgba(224, 184, 74, 0.25); }
.qa-question {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 15px; cursor: pointer;
}
.qa-question:hover { background: rgba(var(--rgb-soft), 0.015); }
.qa-q-icon {
  min-width: 28px;
  height: 24px; padding: 0 8px;
  border-radius: 8px;
  background: rgba(224, 184, 74, 0.1); color: var(--accent-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.qa-q-icon.important { background: rgba(224, 184, 74, 0.15); color: var(--accent-bright); }
.qa-q-icon.very-important { background: rgba(224, 122, 95, 0.15); color: var(--danger-light); }
.qa-q-text {
  flex: 1; font-size: 14px; font-weight: 600;
  color: var(--text-light); line-height: 1.5;
}
.qa-level {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 8px;
  background: rgba(var(--rgb-soft), 0.04);
  color: var(--text-muted);
  flex-shrink: 0;
}
.qa-level.l1 { color: var(--info); background: rgba(110, 197, 255, 0.08); }
.qa-level.l2 { color: var(--warning-bright); background: rgba(240, 193, 75, 0.08); }
.qa-level.l3 { color: var(--danger-light); background: rgba(255, 154, 132, 0.08); }

.qa-toggle {
  color: var(--text-muted); font-size: 11px;
  flex-shrink: 0; margin-top: 5px;
  transition: transform 0.3s ease;
}
.qa-item.open .qa-toggle { transform: rotate(180deg); color: var(--accent-bright); }
.qa-answer {
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.qa-item.open .qa-answer { max-height: 3000px; }
.qa-answer-inner {
  padding: 13px 15px 15px;
  border-top: 1px solid var(--card-border);
  background: var(--block-bg);
}
.qa-answer-label {
  font-size: 10.5px; font-weight: 700;
  color: var(--success-light);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.qa-answer-text { font-size: 14px; color: var(--text-body); line-height: 1.7; }
.qa-musthave {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.05);
  border-left: 3px solid var(--accent);
}
.qa-musthave-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-bright);
  margin-bottom: 6px;
}
.qa-musthave-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.qa-musthave-list li {
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.55;
  padding-left: 14px;
  position: relative;
}
.qa-musthave-list li::before {
  content: '•';
  position: absolute;
  left: 2px;
  color: var(--accent-bright);
}

.qcm-item {
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  margin-bottom: 10px;
}
.qcm-question {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.55;
  margin-bottom: 12px;
}
.qcm-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.qcm-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--block-bg);
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.5;
  text-align: left;
  width: 100%;
  min-width: 0;
}
/* Le texte d'une option doit toujours rester DANS sa carte : rétrécit et
   revient à la ligne même avec des mots longs ou des espaces insécables. */
.qcm-option > span:last-child {
  flex: 1;
  min-width: 0;
  overflow-wrap: break-word;
  word-break: break-word;
}
.qcm-option:hover { border-color: rgba(224, 184, 74, 0.25); }
.qcm-option.correct {
  background: rgba(58, 182, 126, 0.1);
  border-color: var(--success-light);
  color: var(--success-light);
}
.qcm-option.wrong {
  background: rgba(184, 92, 58, 0.1);
  border-color: var(--danger-light);
  color: var(--danger-light);
}
.qcm-option-letter {
  width: 24px; height: 24px;
  border-radius: 8px;
  background: rgba(var(--rgb-soft), 0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  color: var(--text-muted);
  flex-shrink: 0;
}
.qcm-option.correct .qcm-option-letter {
  background: var(--success-light);
  color: #fff;
}
.qcm-option.wrong .qcm-option-letter {
  background: var(--danger-light);
  color: #fff;
}
.qcm-explanation {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(74, 175, 224, 0.06);
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.6;
  display: none;
}
.qcm-explanation.show { display: block; }
.qcm-explanation strong { color: var(--info); }

.notes-area {
  width: 100%; min-height: 110px;
  padding: 14px 16px; border-radius: 12px;
  background: var(--block-bg); border: 1px solid var(--card-border);
  color: var(--text-light); font-family: inherit;
  font-size: 14px; line-height: 1.65;
  resize: vertical; outline: none;
  transition: var(--transition);
}
.notes-area:focus { border-color: rgba(224, 184, 74, 0.35); box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.06); }
.notes-area::placeholder { color: var(--text-muted); }
.notes-status {
  font-size: 11px; color: var(--text-muted);
  text-align: right; margin-top: 6px; min-height: 15px;
}
.notes-status.saved { color: var(--success-light); }

.cta-exam {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.1), rgba(184, 134, 11, 0.05));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  font-family: inherit;
  margin-bottom: 12px;
}
.cta-exam:hover {
  border-color: var(--accent-bright);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  transform: translateY(-1px);
}
.cta-exam > i:first-child {
  font-size: 24px;
  color: var(--accent-bright);
  flex-shrink: 0;
}
.cta-exam-body { flex: 1; min-width: 0; }
.cta-exam-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--accent-bright);
  margin-bottom: 3px;
}
.cta-exam-sub {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.4;
}
.cta-exam-arrow {
  color: var(--text-muted);
  font-size: 14px;
  flex-shrink: 0;
  margin-left: auto;
}

.loading-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 60px 20px;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 13px; color: var(--text-muted); }

.generating-state {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  padding: 60px 20px; text-align: center;
}
.generating-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
.generating-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--text-light);
}
.generating-steps {
  display: flex; flex-direction: column;
  gap: 8px; width: 100%; max-width: 380px;
  margin-top: 8px;
}
.generating-step {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  font-size: 13px;
  color: var(--text-dim);
  transition: var(--transition);
  opacity: 0.4;
}
.generating-step.active { opacity: 1; color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }
.generating-step.done { opacity: 0.9; color: var(--success-light); border-color: rgba(58, 182, 126, 0.2); }
.generating-step-icon { font-size: 15px; width: 20px; text-align: center; }

.empty-state {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .icon {
  width: 62px; height: 62px; border-radius: 20px;
  background: rgba(224, 184, 74, 0.06);
  border: 1px solid rgba(224, 184, 74, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--accent-bright);
}
.empty-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 16px; font-weight: 700;
  color: var(--text-light);
}
.empty-state p { font-size: 13px; color: var(--text-dim); max-width: 320px; line-height: 1.6; }

/* ── NOUVELLES CLASSES ── */
.progress-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 480px) {
  .progress-row { grid-template-columns: 1fr; }
}
/* ── CARTE STATISTIQUES (v8.38 — remplace la carte révisions officielles) ── */
.stat-card {
  margin-bottom: 20px;
  padding: 18px;
  /* ✅ v8.40 — BORDURES RONDES (demande propriétaire) : 24 px bien visibles. */
  border-radius: 24px;
  background: linear-gradient(140deg, rgba(184, 134, 11, 0.14) 0%, rgba(var(--rgb-veil), 0.7) 100%);
  border: 1px solid rgba(224, 184, 74, 0.18);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent, #B8860B), var(--accent-bright), var(--accent, #B8860B));
}
.stat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.stat-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--accent-bright);
}
.stat-period {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-dim, #8A8A7A);
}
.stat-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 12px 0 14px;
}
.stat-metric {
  background: var(--block-bg);
  border: 1px solid rgba(var(--rgb-soft), 0.04);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.stat-num {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(20px, 3vw, 26px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.1;
}
.stat-lbl {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-dim, #8A8A7A);
  margin-top: 4px;
  font-weight: 600;
}
.stat-chart-wrap {
  background: var(--block-bg);
  border: 1px solid rgba(var(--rgb-soft), 0.04);
  border-radius: 12px;
  padding: 12px 10px 6px;
}
.stat-chart-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 2px 8px;
}
.stat-chart { display: block; width: 100%; height: auto; }
.stat-chart-days {
  display: flex;
  justify-content: space-between;
  padding: 4px 2px 2px;
}
.stat-chart-days span {
  font-size: 9px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.3px;
}
.stat-empty-hint {
  font-size: 12px;
  color: var(--text-dim, #8A8A7A);
  text-align: center;
  padding: 10px 0 6px;
}
@media (max-width: 480px) {
  .stat-metrics { gap: 6px; }
  .stat-metric { padding: 10px 4px; }
}

/* ── BOUTON AJOUTER (+) — lancement du flux intelligent (v8.38) ──
   ✅ v8.40 — SIMPLIFIÉ (demande propriétaire) : uniquement le signe + à
   gauche et le mot « Ajouter ». Aucune autre information sur le bouton. */
.add-course-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 16px 20px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: var(--on-gold);
  font-weight: 700;
  font-size: 15px;
  border: none;
  margin-bottom: 24px;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
}
.add-course-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(184, 134, 11, 0.4); }
.add-course-btn:active { transform: scale(0.97); }
.add-course-btn .add-plus {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(10, 10, 10, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

/* ── MODALE AJOUTER — 4 modes de saisie (v8.38) ── */
.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.mode-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 10px 14px;
  border-radius: 14px;
  background: var(--block-bg);
  border: 1px solid var(--card-border);
  color: var(--text-light);
  transition: var(--transition);
  text-align: center;
  min-width: 0;
}
.mode-card:hover { border-color: rgba(224, 184, 74, 0.35); transform: translateY(-2px); }
.mode-card:active { transform: scale(0.97); }
.mode-card .mode-ico {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(224, 184, 74, 0.10);
  border: 1px solid rgba(224, 184, 74, 0.18);
  color: var(--accent-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.mode-card .mode-name { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
.mode-card .mode-desc { font-size: 11px; color: var(--text-muted); line-height: 1.45; }

.verify-stage .form-field { margin-bottom: 12px; }
.verify-stage .form-textarea { min-height: 180px; }
/* La modale Ajouter hérite du gabarit .dicta-modal (88vh, flex, overflow hidden)
   → #acBody devient la zone scrollable de tous ses écrans. */
#addCourseModal #acBody {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#addCourseModal #acBody::-webkit-scrollbar { display: none; }
.mode-back {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0 auto 12px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid rgba(var(--rgb-soft), 0.08);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition);
}
.mode-back:hover { color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }
.extract-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(224, 184, 74, 0.07);
  border: 1px dashed rgba(224, 184, 74, 0.25);
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 12px;
}
.extract-progress i { color: var(--accent-bright); }
.extract-progress .mini-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(224, 184, 74, 0.25);
  border-top-color: var(--accent-bright);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
.extract-note {
  font-size: 11.5px;
  color: var(--text-muted);
  margin: -6px 0 12px;
  line-height: 1.5;
}

/* ── RENOMMAGE (v8.38 — ajuster la proposition IA) ── */
.hero-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.hero-title-row h1 { flex: 1; min-width: 0; }
.rename-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(var(--rgb-soft), 0.08);
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: var(--transition);
}
.rename-btn:hover {
  color: var(--accent-bright);
  border-color: rgba(224, 184, 74, 0.35);
  background: rgba(224, 184, 74, 0.06);
}
.ai-proposal-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(224, 184, 74, 0.10);
  border: 1px solid rgba(224, 184, 74, 0.25);
  color: var(--accent-bright);
  font-size: 11px;
  font-weight: 600;
}

@keyframes spin { to { transform: rotate(360deg); } }

.progress-card {
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
}
.progress-card .pc-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.progress-card .pc-value {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1.1;
  margin-bottom: 4px;
}
.progress-card .pc-sub {
  font-size: 12px;
  color: var(--text-dim);
}
.progress-card .pc-track {
  height: 5px;
  background: rgba(var(--rgb-soft), 0.06);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}
.progress-card .pc-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 999px;
  transition: width 0.6s ease;
}
.progress-card.mastery .pc-fill {
  background: linear-gradient(90deg, var(--success), var(--success-light));
}

.reco-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.reco-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-left: 3px solid var(--accent-bright);
}
.reco-item.priority-0 { border-left-color: var(--success-light); }
.reco-item.priority-2 { border-left-color: var(--warning); }
.reco-icon {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.10);
  color: var(--accent-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.reco-body { flex: 1; min-width: 0; }
.reco-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 2px;
}
.reco-reason {
  font-size: 12px;
  color: var(--text-muted);
}

.goal-item {
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
}
.goal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.goal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
}
.goal-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.goal-progress {
  height: 5px;
  background: rgba(var(--rgb-soft), 0.06);
  border-radius: 999px;
  overflow: hidden;
}
.goal-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.goal-status {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 999px;
  flex-shrink: 0;
}
.goal-status.pending { background: rgba(212, 160, 23, 0.12); color: var(--warning); }
.goal-status.in_progress { background: rgba(224, 184, 74, 0.12); color: var(--accent-bright); }
.goal-status.achieved { background: rgba(58, 182, 126, 0.12); color: var(--success-light); }
.goal-status.overdue { background: rgba(184, 92, 58, 0.12); color: var(--danger-light); }

.grade-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 8px;
  gap: 10px;
}
.grade-info { flex: 1; min-width: 0; }
.grade-type {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-bright);
  margin-bottom: 2px;
}
.grade-subject { font-size: 13px; color: var(--text-dim); }
.grade-score {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-light);
}

.session-item {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
  align-items: flex-start;
}
.session-date {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.10);
  border: 1px solid rgba(224, 184, 74, 0.20);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.session-date .day {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1;
}
.session-date .month {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
}
.session-body { flex: 1; min-width: 0; }
.session-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 2px;
}
.session-meta { font-size: 12px; color: var(--text-muted); }
.session-actions { display: flex; gap: 6px; flex-shrink: 0; }
.session-actions button {
  width: 30px; height: 30px;
  border-radius: 10px;
  background: rgba(var(--rgb-soft), 0.03);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.session-actions button:hover {
  color: var(--accent-bright);
  border-color: rgba(224, 184, 74, 0.30);
}

.quota-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(224, 184, 74, 0.08);
  border: 1px solid rgba(224, 184, 74, 0.20);
  color: var(--accent-bright);
}
.quota-badge.exhausted {
  background: rgba(184, 92, 58, 0.12);
  border-color: rgba(184, 92, 58, 0.25);
  color: var(--danger-light);
}

/* ✅ v8.48a — z-index 11000 : la modale doit flotter AU-DESSUS de la carte
   mentale en PLEIN ÉCRAN (.mm-fs z-index 10000) — avant, l'explication d'une
   carte était invisible en plein écran (il fallait sortir du plein écran).
   Les toasts suivent à 12000 pour rester visibles dans le plein écran aussi. */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 11000;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.modal-backdrop.show { display: flex; animation: fadeIn 0.2s ease; }
.modal-backdrop.center { align-items: center; padding: 16px; }

/* ✅ v8.48a — SIGNATURE DE COMPLÉTION (fin du résumé) : sceau doré qui prouve
   que l'IA a terminé la section entière ; variante « partial » avec bouton
   « Terminer » quand des parties manquent (coupure de la 1re passe). */
.ai-signature {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0 4px; padding: 13px 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(184, 134, 11, 0.14), rgba(224, 184, 74, 0.07));
  border: 1px solid rgba(184, 134, 11, 0.35);
  box-shadow: 0 2px 14px rgba(184, 134, 11, 0.10);
}
.ai-signature.partial {
  background: linear-gradient(135deg, rgba(212, 160, 23, 0.12), rgba(212, 160, 23, 0.05));
  border-color: rgba(212, 160, 23, 0.4);
}
.ai-signature-seal {
  flex-shrink: 0;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent, #B8860B), var(--accent-bright, #E0B84A));
  color: #0A1A12; font-size: 14px;
}
.ai-signature-seal.warn {
  background: linear-gradient(135deg, #D4A017, #E8B93A);
}
.ai-signature-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-signature-txt strong { font-size: 13.5px; color: var(--accent-bright, #E0B84A); letter-spacing: 0.2px; }
.ai-signature-txt span { font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
.ai-signature-award { color: var(--accent, #B8860B); font-size: 18px; opacity: 0.85; }
.ai-signature-btn {
  flex-shrink: 0;
  border: none; cursor: pointer;
  padding: 8px 14px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent, #B8860B), var(--accent-bright, #E0B84A));
  color: #0A1A12; font-weight: 700; font-size: 12.5px;
  display: inline-flex; align-items: center; gap: 6px;
}
.ai-signature-btn:disabled { opacity: 0.6; cursor: wait; }

/* ✅ v8.48a — mini-signature des onglets Questionnaires / Carte mentale :
   ligne discrète qui prouve la complétion de chaque contenu généré. */
.mini-signature {
  display: flex; align-items: center; gap: 7px;
  margin: 0 0 10px; padding: 7px 11px;
  border-radius: 10px;
  background: rgba(184, 134, 11, 0.10);
  border: 1px dashed rgba(184, 134, 11, 0.4);
  font-size: 11.5px; font-weight: 600;
  color: var(--accent-bright, #E0B84A);
}
.mini-signature i { color: var(--success-light, #3AB67E); }

.modal {
  width: 100%; max-width: 640px; max-height: 92vh;
  background: var(--bg-surface);
  border-top: 1px solid rgba(224, 184, 74, 0.2);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom));
  overflow-y: auto; position: relative;
  animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  border-radius: 20px 20px 0 0;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}

.modal-confirm {
  width: 100%; max-width: 400px;
  background: linear-gradient(145deg, var(--bg-surface) 0%, var(--bg-dark) 100%);
  border: 1px solid rgba(224, 184, 74, 0.25);
  border-radius: 20px;
  padding: 28px 24px 22px;
  text-align: center; position: relative;
  animation: popIn 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
@keyframes popIn {
  from { transform: scale(0.94); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-confirm::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}
.modal-confirm .confirm-icon {
  width: 60px; height: 60px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(184, 92, 58, 0.15), rgba(184, 92, 58, 0.05));
  border: 1px solid rgba(184, 92, 58, 0.3);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  color: var(--danger-light); font-size: 26px;
}
.modal-confirm h3 {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700;
  color: var(--text-light); margin-bottom: 8px;
}
.modal-confirm p {
  font-size: 14px; color: var(--text-dim);
  line-height: 1.6; margin-bottom: 22px;
}
.modal-confirm p strong { color: var(--text-light); }
.modal-confirm-buttons { display: flex; gap: 10px; }
.modal-confirm-buttons button {
  flex: 1; min-height: 44px; border-radius: 16px;
  font-size: 13.5px; font-weight: 700;
  font-family: inherit; transition: var(--transition);
}
.btn-cancel {
  background: rgba(var(--rgb-soft), 0.05);
  border: 1px solid rgba(var(--rgb-soft), 0.08);
  color: var(--text-dim);
}
.btn-cancel:hover {
  background: rgba(var(--rgb-soft), 0.09);
  color: var(--text-light);
}
.btn-danger {
  background: linear-gradient(135deg, #D97A3A, #B85C3A);
  color: #fff; border: none;
  box-shadow: 0 4px 16px rgba(184, 92, 58, 0.25);
}
.btn-danger:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(184, 92, 58, 0.4);
}

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border-radius: 10px;
  border: 1px solid var(--card-border);
  background: rgba(var(--rgb-soft), 0.03);
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: var(--transition);
  z-index: 5;
}
.modal-close:hover { color: var(--text-light); border-color: rgba(224, 184, 74, 0.3); }

.modal-head { text-align: center; margin-bottom: 20px; padding: 0 30px; }
.modal-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text-light); margin-bottom: 6px;
}
.modal-head p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

.form-field { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 8px;
}
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 13px 15px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  background: var(--block-bg);
  color: var(--text-light);
  font-size: 14px; font-family: inherit;
  outline: none; resize: vertical;
  transition: var(--transition);
}
.form-select { cursor: pointer; appearance: none; -webkit-appearance: none; }
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: rgba(224, 184, 74, 0.4);
  box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.08);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-textarea { min-height: 100px; line-height: 1.6; }

.char-counter {
  text-align: right; font-size: 11px;
  color: var(--text-muted); margin-top: 6px;
}
.char-counter.limit { color: var(--danger-light); font-weight: 700; }

/* ── Flux d'ajout de section : 2 étapes scrollables (texte → dictée vocale) ── */
.dicta-modal {
  height: 88vh; display: flex; flex-direction: column;
  overflow: hidden; padding-top: 18px;
}
.dicta-modal .modal-head { flex: 0 0 auto; margin-bottom: 12px; padding: 0 6px; }
.dicta-dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.dicta-dot {
  width: 22px; height: 4px; border-radius: 2px;
  background: rgba(224, 184, 74, 0.18);
  transition: background 0.25s ease;
}
.dicta-dot.active { background: var(--accent-bright); }

.dicta-stages {
  flex: 1 1 auto; overflow-y: auto;
  /* proximity (et plus mandatory) : le navigateur peut remonter la zone de
     saisie au-dessus du clavier sans se battre avec l'aimantation. */
  scroll-snap-type: y proximity;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.dicta-stages::-webkit-scrollbar { display: none; }
.dicta-stage {
  min-height: 100%;
  scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: flex-start;
  padding-top: 4px;
}
/* Étape 2 (dictée) : contenu compact, centré verticalement. */
.dicta-stage:last-child { justify-content: center; }
.dicta-stage-inner { width: 100%; }
/* La zone de texte grandit avec le contenu (hauteur pilotée en JS) —
   plus de grande espace morte dans la modale. */
.dicta-modal .form-textarea { resize: none; overflow-y: auto; }
.dicta-stage .btn-full + .btn-full { margin-top: 10px; }
.dicta-step-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 14px;
}
.dicta-step-tag .dicta-tag-n {
  width: 22px; height: 22px; border-radius: 8px;
  background: rgba(224, 184, 74, 0.12);
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.dicta-next .fa-arrow-down { font-size: 12px; color: var(--text-dim); }

/* ── Étape 2 · Dictée vocale (bouton enregistrer centré, tout en dur) ── */
.voice-stage {
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
}
.voice-unsupported {
  text-align: center; color: var(--text-dim);
  font-size: 13.5px; line-height: 1.6; padding: 24px 8px;
}
.voice-unsupported span { font-size: 34px; display: block; margin-bottom: 10px; }
.voice-timer {
  font-size: 40px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-light); letter-spacing: 0.04em;
  margin-bottom: 18px;
}
.voice-rec-btn {
  position: relative; width: 96px; height: 96px;
  border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #a06f0d);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(184, 134, 11, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
  margin-bottom: 14px; flex: 0 0 auto;
}
.voice-rec-btn:active { transform: scale(0.94); }
.voice-rec-btn .voice-rec-core {
  width: 100%; height: 100%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 30px;
}
.voice-rec-btn .ic-stop { display: none; }
.voice-rec-btn.recording { background: linear-gradient(135deg, #c0392b, #8e2a20); box-shadow: 0 10px 30px rgba(192, 57, 43, 0.35); }
.voice-rec-btn.recording .ic-mic { display: none; }
.voice-rec-btn.recording .ic-stop { display: inline-block; }
.voice-rec-btn.recording::after {
  content: ''; position: absolute; inset: -10px;
  border-radius: 50%;
  border: 2px solid rgba(192, 57, 43, 0.5);
  animation: voicePulse 1.6s ease-out infinite;
}
@keyframes voicePulse {
  0% { transform: scale(0.9); opacity: 0.9; }
  100% { transform: scale(1.35); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .voice-rec-btn.recording::after { animation: none; }
}
.voice-hint {
  font-size: 13.5px; color: var(--text-dim);
  margin-bottom: 16px; line-height: 1.5;
}
.voice-live-wrap {
  width: 100%;
  background: var(--block-bg);
  border: 1px solid rgba(224, 184, 74, 0.12);
  border-radius: 14px;
  padding: 12px 14px; margin-bottom: 14px;
}
/* v7.5 : le texte vivant devient une VRAIE zone d'édition — l'élève touche le
   texte pour corriger les fautes de dictée au clavier, la dictée se met en pause. */
.voice-live {
  display: block; width: 100%;
  min-height: 76px; max-height: 150px; overflow-y: auto;
  text-align: left; font-size: 13.5px; line-height: 1.6;
  color: var(--text-light); word-break: break-word;
  background: transparent; border: none; outline: none;
  resize: none; font-family: inherit;
  -webkit-appearance: none; appearance: none;
}
.voice-live::placeholder { color: var(--text-muted); }
.voice-live-wrap.editing { border-color: rgba(224, 184, 74, 0.45); }
.voice-edit-hint {
  font-size: 11.5px; color: var(--text-dim);
  margin: 0 0 12px; text-align: center; line-height: 1.5;
}
.voice-counter {
  text-align: right; font-size: 11.5px;
  color: var(--text-dim); margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.voice-counter.limit { color: var(--danger-light); font-weight: 700; }
.voice-actions {
  display: flex; flex-direction: column; gap: 10px; width: 100%;
}

.symbols-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 20px;
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  font-size: 12.5px; font-weight: 600;
  font-family: inherit;
  transition: var(--transition);
  margin-bottom: 8px;
}
.symbols-toggle:hover { border-color: rgba(224, 184, 74, 0.3); color: var(--accent-bright); }
.symbols-toggle.active { border-color: rgba(224, 184, 74, 0.4); color: var(--accent-bright); background: rgba(224, 184, 74, 0.06); }
.symbols-toggle .fx {
  color: var(--accent-bright); font-weight: 700;
  font-family: 'Playfair Display', serif;
  font-size: 14px;
}
.symbols-toggle .chev { font-size: 10px; transition: transform 0.25s ease; margin-left: auto; }
.symbols-toggle.active .chev { transform: rotate(180deg); }

.symbols-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  margin-bottom: 10px;
}
.symbols-panel.open { max-height: 320px; }

.symbols-panel-inner {
  padding: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
}

.symbols-tabs {
  display: flex; gap: 4px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  scrollbar-width: none;
}
.symbols-tabs::-webkit-scrollbar { display: none; }

.symbols-tab {
  padding: 6px 12px; border-radius: 16px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 11.5px; font-weight: 600;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
  transition: var(--transition);
  cursor: pointer;
}
.symbols-tab:hover { color: var(--text-light); }
.symbols-tab.active {
  background: rgba(224, 184, 74, 0.1);
  border-color: rgba(224, 184, 74, 0.25);
  color: var(--accent-bright);
}

.symbols-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
}

.symbol-btn {
  aspect-ratio: 1;
  min-height: 38px;
  border-radius: 10px;
  background: var(--block-bg);
  border: 1px solid var(--card-border);
  color: var(--text-body);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  transition: var(--transition);
  cursor: pointer;
}
.symbol-btn:hover {
  background: rgba(224, 184, 74, 0.1);
  border-color: rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
}
.symbol-btn:active { transform: scale(0.94); }

.btn-full {
  width: 100%; min-height: 50px;
  padding: 14px 24px; border-radius: 16px;
  border: none; font-size: 14.5px; font-weight: 700;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  transition: var(--transition);
}
.btn-full.primary {
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: var(--on-gold);
  box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
}
.btn-full.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(184, 134, 11, 0.4); }
.btn-full.primary:active:not(:disabled) { transform: scale(0.97); }
.btn-full.secondary {
  background: transparent; border: 1px solid var(--card-border);
  color: var(--text-dim);
}
.btn-full.secondary:hover { color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }

.btn-full .spinner {
  display: none; width: 16px; height: 16px;
  border: 2px solid rgba(var(--rgb-veil), 0.25);
  border-top-color: var(--bg-dark); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-full.loading .spinner { display: block; }
.btn-full.loading .btn-text, .btn-full.loading .btn-icon { display: none; }

.toast-container {
  position: fixed; top: calc(var(--safe-top) + 16px); left: 50%;
  transform: translateX(-50%); z-index: 12000;
  width: calc(100% - 32px); max-width: 420px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-radius: 12px;
  background: rgba(var(--rgb-card), 0.96);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);

/* ✅ v8.4 — le pop-up « Limite de sections » utilise le composant
   UNIFORME du site (arvexa-confirm.js). */
    /* ═══════════════════════════════════════════════════════════════════
       ARVEXA — POP-UP PREMIUM UNIVERSEL
       ⚠️ NE PAS MODIFIER — réutilisé par d'autres pages
       ═══════════════════════════════════════════════════════════════════ */

    .arvexa-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.30s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.30s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .arvexa-popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .arvexa-popup {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: auto;
      padding: 30px 26px 22px;
      border: 1px solid rgba(224, 184, 74, 0.20);
      border-radius: 20px;
      background:
        radial-gradient(ellipse 120% 70% at 50% -10%, rgba(224, 184, 74, 0.10) 0%, transparent 65%),
        radial-gradient(ellipse 100% 50% at 50% 110%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
        linear-gradient(165deg, var(--bg-surface) 0%, var(--bg-deep) 100%);
      box-shadow:
        0 0 0 1px rgba(var(--rgb-soft), 0.02),
        0 0 60px rgba(224, 184, 74, 0.08),
        0 24px 60px rgba(0, 0, 0, 0.70),
        inset 0 1px 0 rgba(var(--rgb-soft), 0.05);
      transform: scale(0.94) translateY(20px);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      overflow: hidden;
      isolation: isolate;
    }
    .arvexa-popup-overlay.show .arvexa-popup {
      transform: scale(1) translateY(0);
    }

    .arvexa-popup::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(224, 184, 74, 0.4) 20%,
        var(--accent-bright) 50%,
        rgba(224, 184, 74, 0.4) 80%,
        transparent 100%);
      opacity: 0.9;
      z-index: 2;
    }

    .arvexa-popup::after {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 184, 74, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(6px);
    }

    .arvexa-popup-close {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(var(--rgb-soft), 0.03);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 4;
      -webkit-tap-highlight-color: transparent;
    }
    .arvexa-popup-close:hover {
      background: rgba(224, 184, 74, 0.12);
      color: var(--accent-bright);
      transform: rotate(90deg) scale(1.05);
    }
    .arvexa-popup-close:active {
      transform: rotate(90deg) scale(0.95);
    }

    .arvexa-popup-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(224, 184, 74, 0.22), rgba(184, 134, 11, 0.08) 70%);
      border: 1px solid rgba(224, 184, 74, 0.28);
      color: var(--accent-bright);
      font-size: 26px;
      margin: 0 auto 16px;
      position: relative;
      z-index: 1;
      animation: arvexaCrownPulse 3s ease-in-out infinite;
      box-shadow:
        0 0 20px rgba(224, 184, 74, 0.15),
        inset 0 1px 0 rgba(var(--rgb-soft), 0.08);
    }
    @keyframes arvexaCrownPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 20px rgba(224, 184, 74, 0.15),
          inset 0 1px 0 rgba(var(--rgb-soft), 0.08);
      }
      50% {
        transform: scale(1.04);
        box-shadow:
          0 0 34px rgba(224, 184, 74, 0.32),

    .arvexa-popup-title {

function safeArray(v) { return Array.isArray(v) ? v : []; }

function escapeHtml(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeText(text) {
  let s = String(text || '');
  s = s.replace(/&amp;(lt|gt|quot|amp|#39);/g, '&$1;');
  const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      return part
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    return part.replace(/[\u00a0\u202f]/g, ' ').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }).join('');
}

function safeTextP(text) {
  // Rendu « comme un prof » : les retours à la ligne HORS formules deviennent
  // des paragraphes visibles (\n\n → saut de paragraphe, \n → <br>).
  const parts = String(safeText(text) || '').split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) return part; // segment mathématique : intact
    return part
      .replace(/\r\n/g, '\n')
      .replace(/\n{2,}/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }).join('');
}

function showToast(message, type = 'info', duration = 3000) {
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
  $('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 250);
  }, duration);
}

      <div class="generating-steps">
        <div class="generating-step active" data-step="1">
          <span class="generating-step-icon">🔍</span>
          <span>Extraction des concepts</span>
        </div>
        <div class="generating-step" data-step="2">
          <span class="generating-step-icon">📖</span>
          <span>Explication pédagogique</span>
        </div>
        <div class="generating-step" data-step="3">
          <span class="generating-step-icon">🧩</span>
          <span>Structuration</span>
        </div>
        <div class="generating-step" data-step="4">
          <span class="generating-step-icon">❓</span>
          <span>Banque de questions</span>
        </div>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">

// ✅ v4.13 — actions légères (lecture/écriture directe, SANS IA) : sur un 429
// passager elles sont retentées silencieusement côté client. Seule la
// création de section (IA) affiche immédiatement un message calme.
const LIGHT_PROGRESS_ACTIONS = new Set([
  'getDashboard', 'getSmartCard', 'listChapters', 'getChapter', 'getSection',
  'updateNotes', 'deleteSection', 'deleteChapter', 'getFullLesson', 'trackStudyTime',
  'renameSection', 'renameChapter'
]);

async function callApi(action, params = {}, _attempt = 1, _rateRetried = false, _opts = {}) {
  // ✅ v8.40 — plus JAMAIS d'erreur visible pendant la restauration de session :
  // on attend que requireAuth ait résolu (au pire le garde-fou 5 s de l'auth
  // guard a déjà redirigé vers la connexion à ce moment).
  if (!state.user) {
    await authReady;
    if (!state.user) throw new Error('Session indisponible.');
  }
  // _attempt > 1 -> forceRefresh : le token est régénéré côté Firebase
  const token = await getIdToken(state.user, _attempt > 1);

  if (window.ARVEXAWakeLock) ARVEXAWakeLock.acquire('progress');
  let response;
  try {
    response = await fetch('/api/progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ action, ...params }),
      // ✅ v8.40 — analyse IA en ARRIÈRE-PLAN : keepalive permet à l'appel
      // d'aboutir côté serveur même si l'élève quitte la page pendant
      // l'analyse (la section sera créée — il la retrouve à son retour).
      keepalive: !!_opts.keepalive
    });
  } catch (networkErr) {
    const err = new Error('Problème de connexion. Vérifie ton réseau et réessaie.');
    err.code = 'NETWORK_ERROR';
    throw err;
  }

  try {
    const data = await response.json().catch(() => null);

    if (response.status === 401 && data?.code === 'AUTH_REQUIRED') {
      // ✅ Anti-boucle : rafraîchissement forcé du token + UNE retente avant
      // de renvoyer vers la connexion. Les 401 passagers (token expiré,
      // démarrage à froid du serveur) n'éjectent plus l'élève.
      if (_attempt === 1) return callApi(action, params, 2);
      window.location.replace('auth-choice.html');
      throw new Error('Session expirée');
    }

    // ✅ v4.13 — 429 sur action légère : UNE retente silencieuse après 1,5 s.
    // L'élève ne doit JAMAIS voir un message d'erreur pour une lecture ou une
    // suppression qui finira par passer (bucket serveur isolé par action).
    if (response.status === 429 && !_rateRetried
        && !data?.code && LIGHT_PROGRESS_ACTIONS.has(action)) {
      await new Promise((r) => setTimeout(r, 1500));
      return callApi(action, params, _attempt, true);
    }

    if (!response.ok || !data?.success) {
      const err = new Error(
        response.status === 429
          ? 'Service momentanément saturé. Réessaie dans quelques secondes.'
          : (data?.error || `Erreur ${response.status}`)
      );
      err.code = data?.code;
      err.status = response.status;
      throw err;
    }
    return data;
  } finally {
    if (window.ARVEXAWakeLock) ARVEXAWakeLock.release('progress');
  }
}

function routeFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  if (!hash) return { view: 'notebooks', params: {} };
  const parts = hash.split('/').filter(Boolean);
  switch (parts[0]) {
    case 'notebooks': return { view: 'notebooks', params: {} };
    case 'notebook': return { view: 'notebook', params: { subject: parts[1] } };
    case 'chapter': return { view: 'chapter', params: { subject: parts[1], chapterId: parts[2] } };
    case 'section': return { view: 'section', params: { subject: parts[1], chapterId: parts[2], sectionId: parts[3] } };
    case 'lesson': return { view: 'lesson', params: { subject: parts[1], chapterId: parts[2] } };
    default: return { view: 'notebooks', params: {} };
  }
}

function hashFromRoute(view, params) {
  const p = params || {};
  switch (view) {
    case 'notebooks': return '#/notebooks';
    case 'notebook': return p.subject ? `#/notebook/${p.subject}` : '#/notebooks';
    case 'chapter': return (p.subject && p.chapterId) ? `#/chapter/${p.subject}/${p.chapterId}` : '#/notebooks';
    case 'section': return (p.subject && p.chapterId && p.sectionId) ? `#/section/${p.subject}/${p.chapterId}/${p.sectionId}` : '#/notebooks';
    case 'lesson': return (p.subject && p.chapterId) ? `#/lesson/${p.subject}/${p.chapterId}` : '#/notebooks';
    default: return '#/notebooks';
  }
}

function navigate(view, params = {}, replace = false) {
  const hash = hashFromRoute(view, params);
  if (replace) window.history.replaceState(null, '', hash);
  else window.history.pushState(null, '', hash);
  applyRoute({ view, params });
}

function applyRoute(route) {
  state.view = route.view;
  state.params = route.params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const target = $(`view-${route.view}`);
  if (target) target.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (route.view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(route.params); break;
    case 'chapter': renderChapterView(route.params); break;
    case 'section': renderSectionView(route.params); break;
    case 'lesson': renderLessonView(route.params); break;
  }
  window.scrollTo({ top: 0 });
}

function updateHeader() {
  const map = {
    notebooks: { emoji: '📓', text: 'Résumé' },
    notebook: { emoji: SUBJECTS[state.params.subject]?.emoji || '📘', text: SUBJECTS[state.params.subject]?.label || 'Résumé' },
    chapter: { emoji: '📘', text: 'Chapitre' },
    section: { emoji: '📙', text: 'Section' },
    lesson: { emoji: '📗', text: 'Leçon' }
  };
  const info = map[state.view] || map.notebooks;
  // ✅ v8.4 — pas d'id ici : le span du header porte déjà le titre (id unique)
  $('pageTitle').innerHTML = `<span class="emoji">${info.emoji}</span><span>${escapeHtml(info.text)}</span>`;
}

function updateBackButton() {
  $('backBtn').classList.toggle('hidden', state.view === 'notebooks');
}

window.addEventListener('hashchange', () => applyRoute(routeFromHash()));

// ── CARTE STATISTIQUES (v8.38) — remplace la carte « révisions officielles » ──
// Métriques du cahier + courbe des sections ajoutées sur 14 jours
// (données dailyActivity via getDashboard.activity).
function renderStatsCard(data) {
  const summary = data.summary || {};
  const studyTime = data.studyTime || { formatted: { total: '0 min' } };
  const activity = safeArray(data.activity);
  const hasSections = (summary.totalSections || 0) > 0;

  // ── Courbe SVG (aire + ligne) des sections ajoutées / jour ──
  const W = 640, H = 150, PAD_L = 10, PAD_R = 10, PAD_T = 16, PAD_B = 10;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;
  const values = activity.map((a) => Math.max(0, Number(a.sections) || 0));
  const maxVal = Math.max(1, ...values);
  const n = values.length;
  const stepX = n > 1 ? innerW / (n - 1) : innerW;

  const pts = values.map((v, i) => {
    const x = PAD_L + i * stepX;
    const y = PAD_T + innerH - (v / maxVal) * (innerH - 6) - 3;
    return [Math.round(x * 100) / 100, Math.round(y * 100) / 100];
  });

  const linePath = n > 0 ? pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ') : '';
  // ✅ v8.42 — tolère un historique vide (nouvel élève / cache {} jamais crash)
  const areaPath = n > 0 ? `${linePath} L${pts[n - 1][0]},${PAD_T + innerH} L${pts[0][0]},${PAD_T + innerH} Z` : '';

  const dots = pts.map((p, i) =>
    `<circle cx="${p[0]}" cy="${p[1]}" r="${values[i] > 0 ? 3.4 : 1.6}" fill="${values[i] > 0 ? 'var(--accent-bright)' : 'rgba(160,160,144,0.5)'}"></circle>`
  ).join('');

  const total14 = values.reduce((a, b) => a + b, 0);

  const chart = `
    <div class="stat-chart-wrap">
      <div class="stat-chart-title">Sections ajoutées — 14 derniers jours (${total14})</div>
      <svg class="stat-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe des sections ajoutées sur 14 jours">
        <defs>
          <linearGradient id="statArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(224, 184, 74, 0.38)"></stop>
            <stop offset="100%" stop-color="rgba(224, 184, 74, 0.02)"></stop>
          </linearGradient>
        </defs>
        <line x1="${PAD_L}" y1="${PAD_T + innerH}" x2="${W - PAD_R}" y2="${PAD_T + innerH}" stroke="rgba(160,160,144,0.25)" stroke-width="1"></line>
        <path d="${areaPath}" fill="url(#statArea)" stroke="none"></path>
        <path d="${linePath}" fill="none" stroke="var(--accent-bright)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}
      </svg>
      <div class="stat-chart-days">
        <span>${dayLabel(activity[0]?.date)}</span>
        <span>${dayLabel(activity[Math.floor(n / 2)]?.date)}</span>
        <span>Aujourd'hui</span>
      </div>
      ${!hasSections ? '<div class="stat-empty-hint">Ajoute ta première section avec le bouton « Ajouter » pour voir ta courbe monter.</div>' : ''}
    </div>
  `;

  return `
    <div class="stat-card" aria-label="Mes statistiques">
      <div class="stat-head">
        <span class="stat-eyebrow">📊 Mes statistiques</span>
        <span class="stat-period">Cahier Résumé</span>
      </div>
      <div class="stat-metrics">
        <div class="stat-metric"><span class="stat-num">${summary.totalSections || 0}</span><span class="stat-lbl">Sections</span></div>
        <div class="stat-metric"><span class="stat-num">${summary.totalChapters || 0}</span><span class="stat-lbl">Chapitres</span></div>
        <div class="stat-metric"><span class="stat-num">${escapeHtml(studyTime.formatted?.total || '0 min')}</span><span class="stat-lbl">Temps d'étude</span></div>
      </div>
      ${chart}
    </div>
  `;
}

function dayLabel(dateKey) {
  if (!dateKey) return '';
  try {
    const d = new Date(dateKey + 'T12:00:00');
    return ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][d.getDay()] + ' ' + d.getDate();
  } catch (e) { return ''; }
}

const DASH_CACHE_KEY = 'arvexa_dash_cache_v1';
function dashCacheRead() {
  try {
    const v = JSON.parse(localStorage.getItem(DASH_CACHE_KEY) || 'null');
    return (v && typeof v === 'object') ? v : null;
  } catch (e) { return null; }
}
function dashCacheWrite(data) {
  try { localStorage.setItem(DASH_CACHE_KEY, JSON.stringify(data)); } catch (e) {}
}

    // mesure des cours ajoutés (matières réellement utilisées dans le cahier).
    const activeSubjects = safeSubjectsList.filter((s) => (s.sectionsCount || 0) > 0);

  } else {
    showLoadingState(el, 'Chargement...');
  }
  let data;
  try {
    data = await callApi('getDashboard');

// ── Cache des extras (QCM / carte mentale) par section ──
const extrasCache = {};
function extrasKey(subject, chapterId, sectionId) { return `${subject}/${chapterId}/${sectionId}`; }
function getExtras(subject, chapterId, sectionId) {
  const k = extrasKey(subject, chapterId, sectionId);
  if (!extrasCache[k]) extrasCache[k] = { qcm: null, mindmap: null, loading: {} };
  return extrasCache[k];
}

async function fetchSectionExtras(subject, chapterId, sectionId, parts) {
  const ex = getExtras(subject, chapterId, sectionId);
  try {
    const data = await callApi('generateSectionExtras', { subject, chapterId, sectionId, parts });
    // ✅ v8.46a — MIROIR localStorage : la carte/QCM générés sont gardés en
    // local en PLUS de Firestore (écriture best-effort côté serveur). Au retour
    // sur la page, la carte se restaure INSTANTanément même si l'écriture en
    // base a échoué — fini le « le bouton Générer réapparaît à chaque visite ».
    if (data.qcm) {
      ex.qcm = data.qcm;
      try { localStorage.setItem('arvexa_qcm_cache_' + extrasKey(subject, chapterId, sectionId), JSON.stringify(data.qcm)); } catch (e) {}
    }
    if (data.mindmap) {
      ex.mindmap = data.mindmap;
      try { localStorage.setItem('arvexa_mm_cache_' + extrasKey(subject, chapterId, sectionId), JSON.stringify(data.mindmap)); } catch (e) {}
    }
    return data;
  } finally {
    parts.forEach((p) => { ex.loading[p] = false; });
  }
}

                <button type="button" class="qcmz-choice" data-i="${ci}">

                </button>
              `).join('')}

          </div>
        `).join('')}
        <div class="qcmz-score" data-qcmz-final style="display:none;">
