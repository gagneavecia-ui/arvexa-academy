            <div class="list-item-arrow" data-nav="chapter"><i class="fas fa-chevron-right"></i></div>
          </div>
        `).join('');

    el.innerHTML = `
      <div class="page-hero">
        <h1>${info.emoji} ${escapeHtml(info.label)}</h1>
        <div class="hero-sub">${totalSections} section${totalSections > 1 ? 's' : ''} · ${chapters.length} chapitre${chapters.length > 1 ? 's' : ''}</div>
      </div>

      <div class="section-title"><i class="fas fa-book-open"></i> Chapitres <span class="count">${chapters.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="newChapterBtn">
          <i class="fas fa-plus"></i>
          <span>Nouveau chapitre</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-chapter]').forEach((item) => {
      const chapterId = item.dataset.chapter;
      item.querySelectorAll('[data-nav="chapter"]').forEach((target) => {
        target.addEventListener('click', (e) => {
          e.stopPropagation();
          navigate('chapter', { subject, chapterId });
        });
      });
    });

    el.querySelectorAll('[data-delete-chapter]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const chapterId = btn.dataset.deleteChapter;
        const chapterTitle = chapters.find((c) => c.id === chapterId)?.title || 'ce chapitre';
        confirmDelete({
          title: 'Supprimer le chapitre ?',
          message: `"<strong>${escapeHtml(chapterTitle)}</strong>" et toutes ses sections seront définitivement supprimés.`,
          onConfirm: async () => {
            await callApi('deleteChapter', { subject, chapterId });
            showToast('Chapitre supprimé', 'success');
            delete state.cache.chapters[subject];
            delete state.cache.chapter[`${subject}/${chapterId}`];
            applyRoute({ view: 'notebook', params: { subject } });
          }
        });
      });
    });

    $('newChapterBtn')?.addEventListener('click', () => openNewChapterModal(subject));

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ══════════════════════════════════════════════════════════════
// VUE 3 — SECTIONS
// ══════════════════════════════════════════════════════════════
async function renderChapterView(params) {
  const el = $('view-chapter');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getChapter', { subject, chapterId });
    state.cache.chapter[`${subject}/${chapterId}`] = data;
    const ch = data.chapter;
    const sections = safeArray(data.sections);
    const latestResult = data.latestResult || null;

    const listHtml = sections.length === 0
      ? `<div class="empty-state" style="padding:30px 20px;">
           <div class="icon"><i class="fas fa-file-lines"></i></div>
           <h3>Aucune section</h3>
           <p>Ajoute la première partie que tu as étudiée.</p>
         </div>`
      : sections.map((s, idx) => `
          <div class="list-item" data-section="${escapeHtml(s.id)}">
            <div class="list-item-icon"><i class="fas ${s.studied ? 'fa-check-double' : 'fa-circle'}"></i></div>
            <div class="list-item-body" data-nav="section">
              <div class="list-item-title">${idx + 1}. ${escapeHtml(s.title)}</div>
              <div class="list-item-meta">
                ${s.questionsCount > 0 ? `<span>${s.questionsCount} Q/R</span><span class="dot"></span>` : ''}
                <span>${escapeHtml(s.time)}</span>
                ${s.studied ? '<span>· Étudiée</span>' : ''}
              </div>
            </div>
            <button class="list-item-delete" data-delete-section="${escapeHtml(s.id)}" title="Supprimer">
              <i class="fas fa-trash-alt"></i>
            </button>
            <div class="list-item-arrow" data-nav="section"><i class="fas fa-chevron-right"></i></div>
          </div>
        `).join('');

    const masteryBadge = latestResult ? `
      <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="goal-status ${latestResult.masteryLevel === 'mastered' ? 'achieved' : 'overdue'}">
          ${latestResult.masteryLevel === 'mastered' ? '✅ Maîtrisé' : '⚠️ À renforcer'}
        </span>
        <span style="font-size: 12px; color: var(--text-dim);">
          Dernière évaluation : ${latestResult.percentage}%
        </span>
      </div>
    ` : '';

    el.innerHTML = `
      <div class="page-hero">
        <div class="hero-sub" style="margin-bottom:6px;">${info.emoji} ${escapeHtml(info.label)}</div>
        <div class="hero-title-row">
          <h1>${escapeHtml(ch.title)}</h1>
          <button class="rename-btn" id="renameChapterBtn" title="Renommer le chapitre" aria-label="Renommer le chapitre">
            <i class="fas fa-pen"></i>
          </button>
        </div>
        <div class="hero-sub">${sections.length} section${sections.length > 1 ? 's' : ''} · ${ch.sectionsStudied || 0} étudiée${ch.sectionsStudied > 1 ? 's' : ''}</div>
        ${masteryBadge}
      </div>

      ${sections.length > 0 ? `
        <button class="cta-card" id="viewLessonBtn">
          <i class="fas fa-book-reader"></i>
          <span>Voir la leçon complète</span>
        </button>
      ` : ''}

      <div class="section-title"><i class="fas fa-list"></i> Sections <span class="count">${sections.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="addSectionBtn">
          <i class="fas fa-plus"></i>
          <span>Ajouter une section</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-section]').forEach((item) => {
      const sectionId = item.dataset.section;
      item.querySelectorAll('[data-nav="section"]').forEach((target) => {
        target.addEventListener('click', (e) => {
          e.stopPropagation();
          navigate('section', { subject, chapterId, sectionId });
        });
      });
    });

    el.querySelectorAll('[data-delete-section]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sectionId = btn.dataset.deleteSection;
        const sectionTitle = sections.find((s) => s.id === sectionId)?.title || 'cette section';
        confirmDelete({
          title: 'Supprimer la section ?',
          message: `"<strong>${escapeHtml(sectionTitle)}</strong>" sera définitivement supprimée.`,
          onConfirm: async () => {
            await callApi('deleteSection', { subject, chapterId, sectionId });
            showToast('Section supprimée', 'success');
            delete state.cache.chapter[`${subject}/${chapterId}`];
            applyRoute({ view: 'chapter', params: { subject, chapterId } });
          }
        });
      });
    });

    $('viewLessonBtn')?.addEventListener('click', () => navigate('lesson', { subject, chapterId }));
    $('addSectionBtn')?.addEventListener('click', () => openAddSectionModal(subject, chapterId));

    // ✅ v8.38 — renommer le chapitre
    $('renameChapterBtn')?.addEventListener('click', () => {
      openRenameModal({
        heading: 'Renommer le chapitre',
        title: ch.title,
        onSave: async (t) => {
          await callApi('renameChapter', { subject, chapterId, title: t });
          showToast('Chapitre renommé', 'success');
          delete state.cache.chapters[subject];
          delete state.cache.chapter[`${subject}/${chapterId}`];
          applyRoute({ view: 'chapter', params: { subject, chapterId } });
        }
      });
    });

  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-book', 'Chapitre introuvable', 'Ce chapitre n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ══════════════════════════════════════════════════════════════
// VUE 4 — SECTION DÉTAILLÉE
// ══════════════════════════════════════════════════════════════
async function renderSectionView(params) {
  const el = $('view-section');
  const { subject, chapterId, sectionId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId || !sectionId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getSection', { subject, chapterId, sectionId });
    const s = data.section;
    const a = s.analysis || {};
    const profile = s.profile || 'scientific';
    const chapterTitle = state.cache.chapter[`${subject}/${chapterId}`]?.chapter?.title || '';

    el.innerHTML = `
      <div class="section-hero">
        <div class="breadcrumb">
          <span>${info.emoji} ${escapeHtml(info.label)}</span>
          ${chapterTitle ? `<span class="sep">›</span><span>${escapeHtml(chapterTitle)}</span>` : ''}
        </div>
        <div class="hero-title-row">
          <h1>${escapeHtml(s.title)}</h1>
          <button class="rename-btn" id="renameSectionBtn" title="Renommer la section" aria-label="Renommer la section">
            <i class="fas fa-pen"></i>
          </button>
        </div>
        <div class="sub">${escapeHtml(s.time || '')}</div>
        ${state.autoAdded && state.autoAdded.sectionId === sectionId ? `
          <span class="ai-proposal-badge"><i class="fas fa-wand-magic-sparkles"></i> Classé par l'IA — touche ✏️ pour renommer</span>
        ` : ''}
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-paste"></i>Ton cours</div>
        <div class="raw-input" id="rawInput">${safeText(s.rawInput)}</div>
        <button class="expand-btn" id="expandRawBtn">
          <i class="fas fa-chevron-down"></i>
          <span>Voir tout</span>
        </button>
      </div>

      <div id="analysisContainer"></div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-pen"></i>Mes notes</div>
        <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles...">${escapeHtml(s.userNotes || '')}</textarea>
        <div class="notes-status" id="notesStatus"></div>
      </div>

      ${EXAM_SUBJECT_MAP[subject] ? `
      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>Teste-toi sur cette partie</div>
        <button class="cta-exam" id="goToExamBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Tester mes connaissances</div>
            <div class="cta-exam-sub">Teste-toi dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>` : (subject === 'anglais' ? `
      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>Teste-toi sur cette partie</div>
        <div class="block">
          <div class="block-head"><i class="fas fa-circle-info"></i>Pas de test en anglais</div>
          <div class="block-body">Test moi n'est pas disponible pour l'anglais. Utilise la banque de questions de cette section pour te tester.</div>
        </div>
      </div>` : '')}
    `;

    const container = $('analysisContainer');
    container.innerHTML = renderAnalysis(a, profile);

    $('expandRawBtn')?.addEventListener('click', () => {
      const raw = $('rawInput');
      raw.classList.toggle('expanded');
      const span = $('expandRawBtn').querySelector('span');
      span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
    });

    // ✅ v8.38 — renommer la section (ajuster la proposition IA)
    $('renameSectionBtn')?.addEventListener('click', () => {
      openRenameModal({
        heading: 'Renommer la section',
        title: s.title,
        onSave: async (t) => {
          await callApi('renameSection', { subject, chapterId, sectionId, title: t });
          showToast('Section renommée', 'success');
          state.autoAdded = null;
          delete state.cache.chapter[`${subject}/${chapterId}`];
          applyRoute({ view: 'section', params: { subject, chapterId, sectionId } });
        }
      });
    });

    el.querySelectorAll('.qa-item').forEach((item) => {
      item.querySelector('.qa-question').addEventListener('click', () => {
        item.classList.toggle('open');
      });
    });

    el.querySelectorAll('.qcm-item').forEach((qcm) => {
      const correct = qcm.dataset.correct;
      const options = qcm.querySelectorAll('.qcm-option');
      const explanation = qcm.querySelector('.qcm-explanation');
      options.forEach((opt) => {
        opt.addEventListener('click', () => {
          if (qcm.dataset.answered === '1') return;
          qcm.dataset.answered = '1';
          const letter = opt.dataset.letter;
          options.forEach((o) => {
            if (o.dataset.letter === correct) o.classList.add('correct');
            else if (o.dataset.letter === letter) o.classList.add('wrong');
          });
          if (explanation) explanation.classList.add('show');
        });
      });
    });

    let notesTimer = null;
    $('notesArea')?.addEventListener('input', () => {
      const status = $('notesStatus');
      status.textContent = 'Enregistrement...';
      clearTimeout(notesTimer);
      notesTimer = setTimeout(async () => {
        try {
          await callApi('updateNotes', { subject, chapterId, sectionId, userNotes: $('notesArea').value });
          delete state.cache.chapter[`${subject}/${chapterId}`];
          status.textContent = 'Enregistré';
          status.className = 'notes-status saved';
          setTimeout(() => { status.textContent = ''; status.className = 'notes-status'; }, 2000);
        } catch (e) {
          status.textContent = 'Erreur';
          status.className = 'notes-status';
        }
      }, 1400);
    });

    $('goToExamBtn')?.addEventListener('click', function () {
      var subj = $('goToExamBtn').dataset.subject;
      var chap = $('goToExamBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible dans Test moi.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });


  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-file', 'Section introuvable', 'Cette section n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ══════════════════════════════════════════════════════════════
// RENDU ANALYSE (identique à la version précédente)
// ══════════════════════════════════════════════════════════════
function renderAnalysis(a, profile) {
  let html = '';
  const expl = a.explanation || {};
  if (expl.understanding) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-graduation-cap"></i>L'explication du prof</div>
      <div class="block">
        <div class="block-head"><i class="fas fa-lightbulb"></i>Ce que tu dois comprendre</div>
        <div class="block-body">${safeTextP(expl.understanding)}</div>
      </div>
      ${safeArray(expl.parts).map((p) => renderPart(p, profile)).join('')}
      ${expl.context ? `<div class="block" style="margin-top:12px;">
        <div class="block-head"><i class="fas fa-landmark"></i>Contexte</div>
        <div class="block-body">${safeTextP(expl.context)}</div>
      </div>` : ''}
      ${safeArray(expl.keyFacts).length > 0 ? `<div class="block" style="margin-top:12px;">
        <div class="block-head"><i class="fas fa-star"></i>Faits clés</div>
        <div class="block-body"><ul class="simple-list">${safeArray(expl.keyFacts).map((f, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(f)}</span></li>`).join('')}</ul></div>
      </div>` : ''}
    </div>`;
  }
  if (a.structure) html += renderStructure(a.structure, profile);
  const questions = safeArray(a.questions);
  if (questions.length > 0) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-circle-question"></i>Banque de questions <span class="count">${questions.length}</span></div>
      <div class="qa-list">${questions.map((q, i) => renderQuestion(q, i)).join('')}</div>
    </div>`;
  }
  // ✅ v4.14 — QCM retiré (débordements récurrents sur mobile) :
  // la section livre l'explication du prof + la banque de questions.
  // renderQcm/CSS restent dans le fichier pour une réactivation éventuelle.
  if (!html && a.fallback) {
    html = `<div class="block">
      <div class="block-head"><i class="fas fa-info-circle"></i>Information</div>
      <div class="block-body">L'analyse automatique est indisponible. Réessaie en ajoutant une nouvelle section ou en réessayant plus tard.</div>
    </div>`;
  }
  return html;
}

function renderPart(p, profile) {
  const partTitle = p.partTitle || p.title || 'Partie';
  const mainIdea = p.mainIdea || p.idea || '';
  const explanation = p.simpleExplanation || p.explanation || '';
  const terms = p.keyTerms || p.terms || [];
  const toRemember = p.toRemember || p.memorize || '';

  let extra = '';
  if (profile === 'svt' && p.mechanism) {
    const steps = safeArray(p.mechanism.steps);
    if (steps.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚙️ ${safeTextP(p.mechanism.description || 'Mécanisme')}</div>
        <ol class="method-list">${steps.map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>
      </div>`;
    }
  }
  if (profile === 'philosophy') {
    const args = safeArray(p.arguments);
    if (args.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚖️ Arguments</div>
        <ul class="simple-list">${args.map((arg, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(arg)}</span></li>`).join('')}</ul>
      </div>`;
    }
    const examples = safeArray(p.everydayExamples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">💡 Exemples du quotidien</div>
        <ul class="simple-list">${examples.map((ex, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(ex)}</span></li>`).join('')}</ul>
      </div>`;
    }
  }
  if (profile === 'language') {
    const examples = safeArray(p.examples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">📝 Exemples</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${examples.map((ex) => `
            <div>
              <div style="font-size:14px;color:var(--text-light);font-weight:600;">${safeTextP(ex.english)}</div>
              <div style="font-size:13px;color:var(--text-dim);font-style:italic;">→ ${safeTextP(ex.french)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
    const mistakes = safeArray(p.commonMistakes);
    if (mistakes.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚠️ Pièges pour francophones</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${mistakes.map((m) => `
            <div style="font-size:13px;color:var(--text-body);line-height:1.55;">
              <span style="color:var(--danger-light);">❌ ${safeTextP(m.mistake)}</span><br>
              <span style="color:var(--success-light);">✅ ${safeTextP(m.correction)}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }
  const relations = safeArray(p.relations);
  if (relations.length > 0) {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">🔗 Relations</div>
      <ul class="simple-list">${relations.map((r, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(r)}</span></li>`).join('')}</ul>
    </div>`;
  }
  if (profile === 'scientific' && p.example && typeof p.example === 'string') {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">📙 Exemple</div>
      <div style="font-size:13.5px;color:var(--text-body);line-height:1.6;">${safeTextP(p.example)}</div>
    </div>`;
  }

  let termsHtml = '';
  const safeTerms = safeArray(terms);
  if (safeTerms.length > 0) {
    termsHtml = `<div class="part-terms">
      <div class="part-terms-title">📚 Termes importants</div>
      <div class="part-terms-list">
        ${safeTerms.map((t) => {
          if (profile === 'language' && t.english) {
            return `<div class="part-term"><strong>${safeTextP(t.english)}</strong> — ${safeTextP(t.french || t.meaning || '')}${t.example ? ` <span style="color:var(--text-muted);">(${safeTextP(t.example)})</span>` : ''}</div>`;
          }
          const term = t.term || t.name || '';
          const meaning = t.meaning || t.definition || '';
          return `<div class="part-term"><strong>${safeTextP(term)}</strong> — ${safeTextP(meaning)}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let rememberHtml = '';
  if (toRemember && typeof toRemember === 'string' && toRemember.trim()) {
    rememberHtml = `<div class="part-remember"><strong>À retenir</strong>${safeTextP(toRemember)}</div>`;
  }

  return `
    <div class="part">
      <div class="part-title">${safeTextP(partTitle)}</div>
      ${mainIdea ? `<div class="part-idea">${safeTextP(mainIdea)}</div>` : ''}
      ${explanation ? `<div class="part-explanation">${safeTextP(explanation)}</div>` : ''}
      ${termsHtml}
      ${extra}
      ${rememberHtml}
    </div>
  `;
}

function renderStructure(structure, profile) {
  let html = '';

  if (profile === 'scientific') {
    const formulas = safeArray(structure.formulas);
    if (formulas.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-square-root-variable"></i>Formules clés</div>
        <div class="block">
          ${formulas.map((f) => {
            let latex = String(f.latex || '');
            if (latex && !latex.includes('$')) latex = `$$${latex}$$`;
            return `
              <div class="formula-block">
                <div>${safeTextP(latex)}</div>
                ${f.description ? `<div class="formula-description">${safeTextP(f.description)}</div>` : ''}
                ${f.condition ? `<div class="formula-condition">${safeTextP(f.condition)}</div>` : ''}
                ${safeArray(f.variables).length > 0 ? `
                  <div class="formula-variables">
                    ${safeArray(f.variables).map((v) => `<div class="formula-variable"><strong>${safeTextP(v.symbol)}</strong> : ${safeTextP(v.meaning)}${v.unit ? ` (${safeTextP(v.unit)})` : ''}</div>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>`;
    }
    if (structure.method && safeArray(structure.method.steps).length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-list-ol"></i>${escapeHtml(structure.method.title || 'Méthode')}</div>

    const plans = safeArray(structure.plans);
    if (plans.length > 0) {

function renderQuestion(q, idx) {
  const level = Number(q.level) || 1;
  const importance = Number(q.importance) || 1;
  const iconClass = importance >= 3 ? 'very-important' : importance === 2 ? 'important' : '';
  return `
    <div class="qa-item" data-qa="${idx}">
      <div class="qa-question">
        <div class="qa-q-icon ${iconClass}">Q${idx + 1}</div>
        <div class="qa-q-text">${safeTextP(q.question)}</div>
        <span class="qa-level l${level}">Niv ${level}</span>
        <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-label"><i class="fas fa-check"></i>Réponse</div>
          <div class="qa-answer-text">${safeTextP(q.answer)}</div>
          ${safeArray(q.mustHave).length > 0 ? `
            <div class="qa-musthave">
              <div class="qa-musthave-title">Éléments indispensables</div>
              <ul class="qa-musthave-list">
                ${safeArray(q.mustHave).map((m) => `<li>${safeTextP(m)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderQcm(q, idx) {
  return `
    <div class="qcm-item" data-correct="${escapeHtml(q.correct || 'A')}">
      <div class="qcm-question">${idx + 1}. ${safeTextP(q.question)}</div>
      <div class="qcm-options">
        ${safeArray(q.options).map((opt) => `
          <button class="qcm-option" data-letter="${escapeHtml(opt.id)}">
            <span class="qcm-option-letter">${escapeHtml(opt.id)}</span>
            <span>${safeTextP(opt.text)}</span>
          </button>
        `).join('')}
      </div>
      ${q.explanation ? `<div class="qcm-explanation"><strong>💡</strong> ${safeTextP(q.explanation)}</div>` : ''}
    </div>
  `;
}

async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = safeArray(data.sections);

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section à afficher.');
      return;
    }

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';
      if (a.explanation?.understanding) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-lightbulb"></i>À comprendre</div>
          <div class="block-body">${safeTextP(a.explanation.understanding)}</div>
        </div>`;
      }
      if (a.explanation?.parts) {
        content += safeArray(a.explanation.parts).map((p) => renderPart(p, s.profile || 'scientific')).join('');
      }
      if (a.structure) content += renderStructure(a.structure, s.profile || 'scientific');
      if (s.userNotes && s.userNotes.trim()) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-pen"></i>Mes notes</div>
          <div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div>
        </div>`;
      }
      return `
        <div style="margin-bottom:32px;">
          <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Section ${i + 1}</div>
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:14px;">${escapeHtml(s.title)}</div>
          ${content}
        </div>
      `;
    }).join('');

    const chapterTitle = data.chapter.title || '';

    el.innerHTML = `
      <div class="page-hero" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">${info.emoji}</div>
        <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;">${escapeHtml(info.label)}</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text-light);margin-bottom:6px;">${escapeHtml(chapterTitle)}</h1>
        <div style="font-size:13px;color:var(--text-dim);">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      <div class="content-section" style="margin-bottom:32px;">
        <button class="cta-exam" id="goToExamLessonBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Tester mes connaissances</div>
            <div class="cta-exam-sub">Teste tout le chapitre dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>

      ${sectionsHtml}
    `;

    $('goToExamLessonBtn')?.addEventListener('click', function () {
      var subj = $('goToExamLessonBtn').dataset.subject;
      var chap = $('goToExamLessonBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible dans Test moi.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').classList.remove('center');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(html, { center = false } = {}) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  if (center) $('modalBackdrop').classList.add('center');
  document.body.style.overflow = 'hidden';
  $('modalBackdrop').querySelector('.modal-close')?.addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
}

function confirmDelete({ title, message, onConfirm }) {
  openModal(`
    <div class="modal-confirm">
      <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
      <h3>${escapeHtml(title)}</h3>
      <p>${message}</p>
      <div class="modal-confirm-buttons">
        <button class="btn-cancel" id="confirmCancelBtn">Annuler</button>
        <button class="btn-danger" id="confirmDeleteBtn">Supprimer</button>
      </div>
    </div>
  `, { center: true });

  $('confirmCancelBtn').addEventListener('click', closeModal);
  $('confirmDeleteBtn').addEventListener('click', async () => {
    const btn = $('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
      await onConfirm();
      closeModal();
    } catch (e) {
      showToast(e.message || 'Impossible de supprimer', 'error');
      btn.disabled = false;
      btn.textContent = 'Supprimer';
    }
  });
}

function openNewChapterModal(subject) {
  const info = SUBJECTS[subject];
  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Nouveau chapitre</h2>
        <p>${info.emoji} ${escapeHtml(info.label)}</p>
      </div>
      <div class="form-field">
        <label class="form-label">Titre du chapitre</label>
        <input type="text" class="form-input" id="newChapterTitle" placeholder="Ex : Nombres complexes" maxlength="100">
      </div>
      <button class="btn-full primary" id="createChapterBtn" disabled>
        <span class="btn-icon"><i class="fas fa-plus"></i></span>
        <span class="btn-text">Créer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const input = $('newChapterTitle');
  const btn = $('createChapterBtn');
  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
  btn.addEventListener('click', async () => {
    const title = input.value.trim();
    if (title.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await callApi('createChapter', { subject, title });
      showToast('Chapitre créé', 'success');
      delete state.cache.chapters[subject];
      closeModal();
      applyRoute({ view: 'notebook', params: { subject } });
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
  setTimeout(() => input.focus(), 200);
}

  const dots = [$('dictaDot1'), $('dictaDot2')];
  const goDictBtn = $('goDictBtn');
  const backToTextBtn = $('backToTextBtn');
  const voiceRecBtn = $('voiceRecBtn');
  const voiceTimer = $('voiceTimer');
  const voiceHint = $('voiceHint');
  const voiceLive = $('voiceLive');
  const voiceCounter = $('voiceCounter');
  const voiceStage = $('voiceStage');
  const voiceUnsupported = $('voiceUnsupported');

  const submitBtns = [$('sectionSubmitBtn'), $('sectionSubmitBtn2')];
  let stopDictation = () => {};  // défini dans le bloc dictée ci-dessous (si supporté)
  let updateLive = () => {};     // idem : affecté dans le bloc dictée (sync éditeur vocal)

  const DRAFT_KEY = 'arvexa_section_draft_' + subject + '_' + chapterId;
  const saveDraft = () => {
    try {
      if (body.value.trim().length > 0) localStorage.setItem(DRAFT_KEY, body.value);
      else localStorage.removeItem(DRAFT_KEY);
    } catch (e) {}
  };
  try {
    const saved = localStorage.getItem(DRAFT_KEY);
    if (saved && saved.trim().length > 0) {
      body.value = saved.slice(0, MAX_CONTENT_LENGTH); // blocage dur 2 500
      // ⚠️ updateReady() et non dispatch('input') : à ce stade aucun listener
      // n'est encore attaché → le bouton « Analyser » resterait désactivé.
      updateReady();
    }
  } catch (e) {}

  body.addEventListener('input', saveDraft);

  const releaseGarde = () => {
    __isAddSectionModalOpen = false;
    // Fermeture pendant un enregistrement → arrêt propre (micro, timer, écran).
    try { stopDictation(); } catch (e) {}
  };
  $('modalBackdrop')?.addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) releaseGarde();
  });
  $('modalBackdrop')?.querySelector('.modal-close')?.addEventListener('click', releaseGarde);

  function updateReady() {
    if (body.value.length > MAX_CONTENT_LENGTH) body.value = body.value.slice(0, MAX_CONTENT_LENGTH);
    const len = body.value.trim().length;
    submitBtns.forEach((b) => { b.disabled = len < MIN_CONTENT_LENGTH; });
    counter.textContent = `${body.value.length} / ${MAX_CONTENT_LENGTH}`;
    counter.classList.toggle('limit', body.value.length >= MAX_CONTENT_LENGTH);
  }
  body.addEventListener('input', updateReady);

  // ── v7.5 · Confort de saisie ──
  // (1) Le textarea grandit avec le texte : plus de grande espace morte.
  const autoGrow = () => {
    body.style.height = 'auto';
    const cap = Math.round(window.innerHeight * 0.38);
    body.style.height = Math.min(body.scrollHeight, cap) + 'px';
  };
  body.addEventListener('input', autoGrow);
  // (2) Au focus, on laisse le clavier redimensionner le viewport
  // (interactive-widget=resizes-content) puis on recadre la hauteur.
  body.addEventListener('focus', () => setTimeout(() => {
    try { body.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    try { autoGrow(); } catch (e) {}
  }, 320));
  if (window.__dictaResizeHandler) window.removeEventListener('resize', window.__dictaResizeHandler);
  window.__dictaResizeHandler = () => { try { autoGrow(); } catch (e) {} };
  window.addEventListener('resize', window.__dictaResizeHandler);
  autoGrow();

  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
    toggle.classList.toggle('active');
  });

  document.querySelectorAll('.symbols-tab').forEach((tab) => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      const idx = tab.dataset.tab;
      document.querySelectorAll('.symbols-tab').forEach((t) => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.symbols-grid').forEach((g) => {
        g.style.display = g.dataset.grid === idx ? 'grid' : 'none';
      });
    });
  });

  document.querySelectorAll('.symbol-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const symbol = btn.dataset.symbol;
      const value = body.value;
      // Blocage dur 2 500 : un symbole ne rentre que s'il a la place.
      if (value.length + symbol.length > MAX_CONTENT_LENGTH) {
        showToast('Limite de 2 500 caractères atteinte', 'error');
        updateReady();
        return;
      }
      const start = body.selectionStart || 0;
      const end = body.selectionEnd || 0;
      body.value = value.slice(0, start) + symbol + value.slice(end);
      const newPos = start + symbol.length;
      body.setSelectionRange(newPos, newPos);
      body.focus();
      saveDraft(); // l'affectation .value ne déclenche pas 'input'
      updateReady();
    });
  });

  // ── Navigation entre les 2 étapes (scroll : texte ⇄ dictée vocale) ──
  const goToStage = (n) => {
    if (n === 2) {
      // L'éditeur vocal reflète toujours le texte à jour (s'il est éditable).
      try { updateLive(); } catch (e) {}
    }
    stages.scrollTo({ top: (n - 1) * stages.clientHeight, behavior: 'smooth' });
  };
  goDictBtn.addEventListener('click', () => goToStage(2));
  backToTextBtn.addEventListener('click', () => goToStage(1));
  stages.addEventListener('scroll', () => {
    const idx = Math.min(1, Math.max(0, Math.round(stages.scrollTop / Math.max(1, stages.clientHeight))));
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  }, { passive: true });

  // ── Dictée vocale — étape 2 dédiée : bouton enregistrer bien centré,
  // durée illimitée (relance automatique), cap 2 500 caractères (budget IA),
  // tout est en dur : aucun chargement, l'étape est prête dès l'ouverture.
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    voiceStage.style.display = 'none';
    voiceUnsupported.style.display = 'block';
  } else {
    let recognition = null;
    let isRecording = false;
    let editMode = false;      // v7.5 : correction clavier en cours (dictée en pause)
    let savedBaseValue = '';   // texte présent AVANT la dictée + finales validées des sessions précédentes
    let sessionFinals = '';    // finales de la session courante (reconstruites à chaque event)
    let timerInt = null;
    let startedAt = 0;
    let wakeLock = null;
    let capWarned = false;
    /* === DEDUP-HELPERS-START (testes par scripts/test_dictation_dedup.js) === */
    // Normalise un mot pour comparaison : casse, accents et ponctuation ignores.
    const normTok = (w) => {
      let s = String(w || '').toLowerCase().replace(/\u0153/g, 'oe');
      try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
      return s.replace(/[^a-z0-9']+/g, '');
    };
    const wordsOf = (t) => String(t || '').split(/\s+/).filter(Boolean);
    // Retire de `txt` ses premiers mots qui repetent la fin de `base` : apres une
    // relance auto, le moteur re-transcrit la fin de l'audio deja valide.
    const withoutOverlap = (base, txt) => {
      if (!base || !txt) return txt || '';
      const bw = wordsOf(base); const tw = wordsOf(txt);
      // Segment entièrement re-transcrit (contigu près de la fin de base) → à jeter.
      const twN = tw.map(normTok).join(' ');
      const winN = bw.slice(Math.max(0, bw.length - tw.length - 8)).map(normTok).join(' ');
      if (twN && winN.indexOf(twN) !== -1) return '';
      const maxK = Math.min(bw.length, tw.length, 60);
      for (let k = maxK; k >= 1; k--) {
        let ok = true;
        for (let i = 0; i < k; i++) {
          if (normTok(bw[bw.length - k + i]) !== normTok(tw[i])) { ok = false; break; }
        }
        if (ok) return tw.slice(k).join(' ');
      }
      return txt;
    };
    // Concatene en supprimant le chevauchement prev/next (zero repetition).
    const mergeNoOverlap = (prev, next) => {
      if (!prev) return next || '';
      if (!next) return prev;
      const kept = withoutOverlap(prev, next);
      return kept ? prev + ' ' + kept : prev;
    };
    // Compresse les begaiements colles du moteur (<< le le >>, << ce que ce que >>).
    // Les doubles legitimes courants (oui oui, non non, tres tres...) sont gardes.
    const STUTTER_KEEP = { oui: 1, non: 1, tres: 1, bien: 1, jamais: 1, encore: 1, toujours: 1 };
    const collapseStutter = (text) => {
      const w = wordsOf(text);
      const out = [];
      let i = 0;
      while (i < w.length) {
        let consumed = 1;
        for (let n = 4; n >= 2; n--) {
          if (i + 2 * n > w.length) continue;
          let ok = true;
          for (let j = 0; j < n; j++) {
            if (normTok(w[i + j]) !== normTok(w[i + n + j])) { ok = false; break; }
          }
          if (ok) { consumed = n; break; }
        }
        if (consumed === 1) {
          out.push(w[i]);
          const tok = normTok(w[i]);
          let j = i + 1;
          while (j < w.length && normTok(w[j]) === tok) {
            if (STUTTER_KEEP[tok]) out.push(w[j]);
            j++;
          }
          i = j;
        } else {
          // Répétition d'un groupe : garde le 1er groupe entier, saute tous
          // les doublons consécutifs de ce même groupe.
          for (let j = 0; j < consumed; j++) out.push(w[i + j]);
          i += consumed;
          while (i + consumed <= w.length) {
            let same = true;
            for (let j = 0; j < consumed; j++) {
              if (normTok(w[i + j]) !== normTok(w[i - consumed + j])) { same = false; break; }
            }
            if (!same) break;
            i += consumed;
          }
        }
      }
      return out.join(' ');
    };
    /* === DEDUP-HELPERS-END === */

    const clampToMax = (txt) => (txt.length > MAX_CONTENT_LENGTH ? txt.slice(0, MAX_CONTENT_LENGTH) : txt);

    const flushSessionFinals = () => {
      if (sessionFinals) {
        savedBaseValue = clampToMax(mergeNoOverlap(savedBaseValue, sessionFinals));
        sessionFinals = '';
      }
    };

    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

    const startTimer = () => {
      startedAt = Date.now();
      voiceTimer.textContent = '00:00';
      if (timerInt) clearInterval(timerInt);
      timerInt = setInterval(() => {
        voiceTimer.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000));
      }, 1000);
    };
    const stopTimer = () => { if (timerInt) { clearInterval(timerInt); timerInt = null; } };

    const requestWakeLock = async () => {
      try {
        if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    };
    const releaseWakeLock = () => {
      try { if (wakeLock) wakeLock.release(); } catch (e) {}
      wakeLock = null;
    };

    const setVoiceUI = (recording) => {
      voiceRecBtn.classList.toggle('recording', recording);
      voiceRecBtn.setAttribute('aria-label', recording ? 'Arrêter l\'enregistrement' : 'Enregistrer');
      voiceHint.textContent = recording ? 'J\'écoute… Appuie pour arrêter' : 'Appuie et parle — durée illimitée';
    };

    updateLive = () => {
      const val = body.value;
      if (document.activeElement !== voiceLive) {
        // On n'écrase JAMAIS le texte pendant que l'élève le corrige au clavier.
        voiceLive.value = val;
        voiceLive.scrollTop = voiceLive.scrollHeight;
      }
      voiceCounter.textContent = `${val.length} / ${MAX_CONTENT_LENGTH}`;
      voiceCounter.classList.toggle('limit', val.length >= MAX_CONTENT_LENGTH);
      // ✅ Le brouillon suit la dictée en continu : rien n'est perdu si l'app est tuée.
      saveDraft();
    };

    stopDictation = () => {
      if (!isRecording) return;
      isRecording = false;
      try { if (recognition) recognition.stop(); } catch (e) {}
      stopTimer();
      releaseWakeLock();
      setVoiceUI(false);
      updateLive();
    };

    // ── v7.5 · Correction au clavier PENDANT la note vocale ──
    // L'élève touche son texte → la dictée se met en pause, le clavier
    // s'ouvre, il répare les fautes de transcription, puis appuie sur 🎤
    // pour reprendre exactement là où il en était (aucun mot perdu).
    const voiceLiveWrap = $('voiceLiveWrap');
    const pauseForEdit = () => {
      voiceLiveWrap.classList.add('editing');
      if (isRecording) {
        // Le texte affiché (finales + brouillon en cours) devient LA vérité :
        // même les mots pas encore validés par le moteur sont conservés.
        body.value = (voiceLive.value || '').slice(0, MAX_CONTENT_LENGTH);
        savedBaseValue = body.value;
        sessionFinals = '';
        isRecording = false;
        try { if (recognition) recognition.abort(); } catch (e) {}
        stopTimer();
        releaseWakeLock();
        setVoiceUI(false);
        voiceHint.textContent = 'Dictée en pause — corrige ton texte, puis 🎤 pour reprendre';
        showToast('Dictée en pause — corrige au clavier, puis appuie sur 🎤', 'info');
        updateReady();
      }
      editMode = true;
    };
    voiceLive.addEventListener('focus', pauseForEdit);
    voiceLive.addEventListener('blur', () => voiceLiveWrap.classList.remove('editing'));
    // Chaque frappe au clavier est répercutée dans body.value (source de vérité).
    voiceLive.addEventListener('input', () => {
      if (voiceLive.value.length > MAX_CONTENT_LENGTH) voiceLive.value = voiceLive.value.slice(0, MAX_CONTENT_LENGTH);
      body.value = voiceLive.value;
      saveDraft();
      updateReady();
      voiceCounter.textContent = `${body.value.length} / ${MAX_CONTENT_LENGTH}`;
      voiceCounter.classList.toggle('limit', body.value.length >= MAX_CONTENT_LENGTH);
    });

    voiceRecBtn.addEventListener('click', () => {
      if (isRecording) { stopDictation(); return; }
      if (editMode) {
        // Reprendre après correction clavier : le texte corrigé devient la base.
        body.value = (voiceLive.value || '').slice(0, MAX_CONTENT_LENGTH);
        editMode = false;
        voiceLiveWrap.classList.remove('editing');
        updateReady();
      }
      if (!recognition) {
        recognition = new SpeechRecognition();
        try {
          const uiLang = String(localStorage.getItem('arvexa-lang') || 'fr').toLowerCase();
          recognition.lang = uiLang.startsWith('en') ? 'en-US' : 'fr-FR';
        } catch (e) { recognition.lang = 'fr-FR'; }
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          if (editMode || !isRecording) return; // correction clavier en cours : ignorer
          // ✅ Reconstruction complète à CHAQUE event + FUSION anti-chevauchement :
          // après une relance auto, le moteur re-transcrit la fin de l'audio déjà
          // validé → chaque segment est fusionné (mergeNoOverlap) au lieu d'être
          // additionné, puis compressé (collapseStutter) → zéro répétition.
          let finals = '';
          let interim = '';
          for (let i = 0; i < event.results.length; i++) {
            const r = event.results[i];
            const txt = r && r[0] ? r[0].transcript : '';
            if (!txt) continue;
            if (r.isFinal) {
              finals = mergeNoOverlap(finals, withoutOverlap(savedBaseValue, txt));
            } else {
              interim += (interim ? ' ' : '') + txt;
            }
          }
          sessionFinals = collapseStutter(finals);
          const spokenBase = savedBaseValue + (sessionFinals ? ' ' + sessionFinals : '');
          interim = withoutOverlap(spokenBase, interim);
          const total = spokenBase + (interim ? ' ' + interim : '');
          if (total.length > MAX_CONTENT_LENGTH) {
            // Cap 2 500 : coupe nette, avertissement, arrêt propre.
            body.value = total.slice(0, MAX_CONTENT_LENGTH);
            updateReady();
            updateLive();
            if (!capWarned) {
              capWarned = true;
              showToast('Limite de 2 500 caractères atteinte — dictée arrêtée', 'info');
            }
            stopDictation();
            return;
          }
          body.value = total;
          updateReady();
          updateLive();
        };

        recognition.onerror = (e) => {
          console.warn('[Speech]', e.error);
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            isRecording = false; stopTimer(); releaseWakeLock(); setVoiceUI(false); updateLive();
            showToast('Micro bloqué — autorise le micro dans les réglages du navigateur', 'error');
          } else if (e.error === 'network') {
            isRecording = false; stopTimer(); releaseWakeLock(); setVoiceUI(false); updateLive();
            showToast('Dictée interrompue (réseau) — ton texte est conservé', 'error');
          } else if (e.error === 'audio-capture') {
            isRecording = false; stopTimer(); releaseWakeLock(); setVoiceUI(false); updateLive();
            showToast('Aucun micro détecté', 'error');
          }
          // no-speech / aborted : silencieux — onend relance automatiquement.
        };

        recognition.onend = () => {
          // ✅ Fin de session (silence / limite interne Chrome) : les finales de
          // CETTE session sont validées UNE seule fois, puis relance automatique
          // tant que l'utilisateur n'a pas arrêté → durée réellement illimitée.
          flushSessionFinals();
          if (editMode) return; // correction clavier : on ne touche à rien
          body.value = savedBaseValue;
          updateReady();
          updateLive();
          if (isRecording) {
            setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300);
          }
        };
      }

      try {
        flushSessionFinals();
        capWarned = false;
        savedBaseValue = clampToMax(body.value ? body.value + ' ' : '');
        recognition.start();
        isRecording = true;
        setVoiceUI(true);
        startTimer();
        requestWakeLock();
        updateLive();
      } catch (e) {
        showToast('Impossible de démarrer la dictée', 'error');
      }
    });

    // Retour d'onglet / d'app : Chrome coupe le micro en arrière-plan → relance.
    if (window.__dictaVisHandler) document.removeEventListener('visibilitychange', window.__dictaVisHandler);
    window.__dictaVisHandler = () => {
      if (document.visibilityState === 'visible' && isRecording && recognition) {
        try { recognition.start(); } catch (e) {}
      }
    };
    document.addEventListener('visibilitychange', window.__dictaVisHandler);
  }

  const submitSection = async () => {
    const rawInput = body.value.trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }
    if (body.value.length > MAX_CONTENT_LENGTH) {
      // Blocage dur 2 500 : filet de sécurité, on ne soumet jamais plus.
      body.value = body.value.slice(0, MAX_CONTENT_LENGTH);
      updateReady();
      showToast('Texte ramené à la limite de 2 500 caractères', 'info');
      return;
    }

    submitBtns.forEach((b) => { b.disabled = true; b.classList.add('loading'); });
    stopDictation();

    const container = $('view-section');
    const infoLocal = SUBJECTS[subject];
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    container.classList.add('active');
    const cleanupProgress = showGeneratingState(container, infoLocal?.profile || 'scientific');

    try {
      closeModal();
      __isAddSectionModalOpen = false;
      const result = await callApi('createSection', { subject, chapterId, rawInput });
      cleanupProgress();
      showToast('Section analysée', 'success');
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      delete state.cache.chapter[`${subject}/${chapterId}`];
      applyRoute({ view: 'section', params: { subject, chapterId, sectionId: result.sectionId } });
    } catch (e) {
      cleanupProgress();
      if (e.code === 'FREE_SECTION_LIMIT') {
        showPremiumModal();
        applyRoute({ view: 'chapter', params: { subject, chapterId } });
      } else {
        showToast('Erreur : ' + e.message, 'error', 5000);
        applyRoute({ view: 'chapter', params: { subject, chapterId } });
      }
    }
  };
  submitBtns.forEach((b) => b.addEventListener('click', submitSection));

  setTimeout(() => body.focus(), 200);
}

// ── Helpers de dictée (déduplication anti-chevauchement, partagés) ──

function acNormTok(w) {

  if (twN && winN.indexOf(twN) !== -1) return '';

}
function acCollapseStutter(text) {

  const out = [];

  while (i < w.length) {
    let consumed = 1;
    for (let n = 4; n >= 2; n--) {
      if (i + 2 * n > w.length) continue;
      let ok = true;
      for (let j = 0; j < n; j++) {
        if (acNormTok(w[i + j]) !== acNormTok(w[i + n + j])) { ok = false; break; }
      }
      if (ok) { consumed = n; break; }
    }
    if (consumed === 1) {
      out.push(w[i]);
      const tok = acNormTok(w[i]);
      let j = i + 1;
      while (j < w.length && acNormTok(w[j]) === tok) {
        if (AC_STUTTER_KEEP[tok]) out.push(w[j]);
        j++;

        }

// ── pdf.js LOCAL (assets/pdfjs, même origine — pattern lecture.html) ──
let __acPdfJsLoading = null;
function acEnsurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (__acPdfJsLoading) return __acPdfJsLoading;
  __acPdfJsLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'assets/pdfjs/pdf.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) { reject(new Error('pdfjs')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/pdfjs/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { __acPdfJsLoading = null; reject(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return __acPdfJsLoading;
}

// Extraction de la couche TEXTE du PDF (rapide, exacte). Si le PDF est un
// scan (presque aucun texte) → retour scanned:true et la page passera par l'OCR.
async function acExtractPdfText(file, onProgress) {
  let lib;
  try { lib = await acEnsurePdfJs(); } catch (e) { throw new Error('Impossible de charger le lecteur PDF.'); }
  let pdf;
  try { pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise; }
  catch (e) { throw new Error('Impossible de lire ce PDF — essaie un autre fichier.'); }

  const maxPages = Math.min(pdf.numPages, 10);
  let text = '';
  for (let p = 1; p <= maxPages; p++) {
    if (onProgress) onProgress(p, maxPages, pdf.numPages);
    try {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let lastY = null, pageText = '';
      for (const it of tc.items) {
        if (!it.str) continue;
        const y = it.transform ? Math.round(it.transform[5]) : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) pageText += '\n';
        else if (pageText && !/\s$/.test(pageText) && !/^\s/.test(it.str)) pageText += ' ';
        pageText += it.str;
        if (y !== null) lastY = y;
      }
      if (pageText.trim()) text += (text ? '\n\n' : '') + pageText.trim();
    } catch (e) { /* page illisible : on continue */ }
    if (text.length >= MAX_CONTENT_LENGTH * 2) break;
  }
  return {
    text: text.trim(),
    numPages: pdf.numPages,
    scanned: text.trim().length < 150
  };
}

// OCR par lots de ≤ 4 images (limite du kit IA) via /api/arv?kit=1
// ✅ v8.39 — ANTI-ERREUR : chaque lot est retenté (3 essais), et si un lot
// résiste, on le redécoupe image par image — l'important est d'EXTRAIRE.
async function acOcrImages(images, onProgress) {
  const batches = [];
  for (let i = 0; i < images.length; i += 4) batches.push(images.slice(i, i + 4));
  const askOnce = async (imgs) => {
    const r = await window.ARVX_AI.ask('image', { mode: 'ocr', images: imgs });
    return String(r?.data?.text || '').trim();
  };
  const parts = [];
  for (let b = 0; b < batches.length; b++) {
    if (onProgress) onProgress(b + 1, batches.length, images.length);
    const imgs = batches[b];
    let t = '';
    for (let tries = 0; tries < 3 && !t; tries++) {
      try { t = await askOnce(imgs); }
      catch (e) { if (tries < 2) await new Promise((r) => setTimeout(r, 1200)); }
    }
    if (!t && imgs.length > 1) {
      const chunk = [];
      for (const im of imgs) {
        let one = '';
        for (let tries = 0; tries < 2 && !one; tries++) {
          try { one = await askOnce([im]); }
          catch (e) { if (tries < 1) await new Promise((r) => setTimeout(r, 1200)); }
        }
        if (one) chunk.push(one);
      }
      t = chunk.join('\n\n');
    }
    if (t) parts.push(t);
  }
  return parts.join('\n\n');
}

  // ═══ Mode PDF — texte natif, sinon OCR des pages ═══
  // ✅ v8.39 — LIMITE 7 Mo demandée par le propriétaire : au-delà, message

  const PDF_MAX_BYTES = 7 * 1024 * 1024;
  function startPdfPicker() {
    acMode = 'pdf';
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,.pdf';
    input.style.display = 'none';
    document.body.appendChild(input);

      input.remove();

        const mb = (file.size / (1024 * 1024)).toFixed(1).replace('.', ',');
        showToast(`PDF trop volumineux (${mb} Mo) — la taille maximale est 7 Mo. Choisis un PDF plus léger.`, 'error', 6000);

      const prog = (t) => { const el = $('acProgTxt'); if (el) el.textContent = t; };
      try {
        let text = '';
        const res = await acExtractPdfText(file, (p, total, all) => {
          prog(`Extraction du texte — page ${p}/${total}${all > total ? ` (sur ${all})` : ''}…`);
        });
        if (res.scanned) {
          // PDF scanné : pages rendues en images → OCR (kit IA, 10 pages max — v8.39)
          if (!window.ARVX_AI) throw new Error('Kit IA indisponible.');
          prog('PDF scanné — lecture IA des pages…');
          const pages = await window.ARVX_AI.pdfToImages(file, { maxPages: 10, scale: 1.6, onProgress: (p, n) => prog(`Rendu page ${p}/${n}…`) });
          text = await acOcrImages(pages, (b, total) => prog(`Lecture IA des pages… (${b}/${total})`));
        } else {
          text = res.text;
        }
        acBusy = false;
        if (!text || text.trim().length === 0) {
          showToast('Aucun texte extrait de ce PDF', 'error');
          showModeChoice();
          return;
        }
        acText = clampAc(text);
        if (text.length > MAX_CONTENT_LENGTH) showToast(`Extrait ramené à ${MAX_CONTENT_LENGTH} caractères — le reste peut être ajouté en une 2ᵉ section`, 'info', 5000);
        showVerifyMode();
      } catch (e) {
        acBusy = false;
        showToast(e.message || 'Extraction impossible', 'error', 5000);
        showModeChoice();
      }
    }, { once: true });
    setTimeout(() => input.click(), 50);
  }

  function clampAc(t) { return String(t || '').length > MAX_CONTENT_LENGTH ? String(t).slice(0, MAX_CONTENT_LENGTH) : String(t || ''); }

  // ═══ Mode VOCAL — dictée avec bouton enregistrer ═══
  function showVoiceMode() {
    acMode = 'vocal';
    setSubtitle('Dicte ta leçon — appuie, parle, ré-appuie pour arrêter');

    if (!SpeechRecognition) {

      `;

    }

    acBody.innerHTML = `
      <div class="voice-stage" id="acVoiceStage">
        <div class="voice-timer" id="acTimer">00:00</div>
        <button type="button" class="voice-rec-btn" id="acRecBtn" aria-label="Enregistrer">

            <i class="fas fa-stop ic-stop"></i>
          </span>
        </button>

        <div class="voice-live-wrap" id="acLiveWrap">
          <textarea class="voice-live" id="acLive" placeholder="Ton texte apparaîtra ici en direct…" maxlength="${MAX_CONTENT_LENGTH}" rows="3"></textarea>
          <div class="voice-counter" id="acCounter2">0 / ${MAX_CONTENT_LENGTH}</div>
        </div>
        <p class="voice-edit-hint">✏️ Touche ton texte pour corriger les fautes au clavier</p>
        <div class="voice-actions">
          <button type="button" class="btn-full secondary" id="acVoiceBack"><span class="btn-icon">←</span><span class="btn-text">Revenir aux modes</span></button>
          <button class="btn-full primary" id="acSubmitBtn2" disabled>
            <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
            <span class="btn-text">Analyser avec l'IA</span>
            <span class="spinner"></span>
          </button>
        </div>
      </div>
    `;

    const recBtn = $('acRecBtn');
    const timerEl = $('acTimer');
    const hintEl = $('acHint');
    const live = $('acLive');
    const liveWrap = $('acLiveWrap');
    const counterEl = $('acCounter2');

    let recognition = null;
    let isRecording = false;
    let editMode = false;
    let baseText = acText || '';
    let sessionFinals = '';
    let timerInt = null;
    let startedAt = 0;
    let wakeLock = null;
    let capWarned = false;

    const clampMax = (t) => (t.length > MAX_CONTENT_LENGTH ? t.slice(0, MAX_CONTENT_LENGTH) : t);
    const flushFinals = () => {
      if (sessionFinals) {
        baseText = clampMax(acMergeNoOverlap(baseText, sessionFinals));
        sessionFinals = '';
      }
    };
    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    const startTimer = () => {
      startedAt = Date.now();
      timerEl.textContent = '00:00';
      if (timerInt) clearInterval(timerInt);
      timerInt = setInterval(() => { timerEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000)); }, 1000);
    };
    const stopTimer = () => { if (timerInt) { clearInterval(timerInt); timerInt = null; } };
    const grabWake = async () => { try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} };
    const dropWake = () => { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; };
    const setUI = (rec) => {
      recBtn.classList.toggle('recording', rec);
      recBtn.setAttribute('aria-label', rec ? 'Arrêter l\'enregistrement' : 'Enregistrer');
      hintEl.textContent = rec ? 'J\'écoute… Appuie pour arrêter' : 'Appuie et parle — durée illimitée';
    };
    const syncLive = () => {
      if (document.activeElement !== live) {
        live.value = acText;
        live.scrollTop = live.scrollHeight;
      }
      counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
      counterEl.classList.toggle('limit', acText.length >= MAX_CONTENT_LENGTH);
    };
    const updateSubmit = () => { $('acSubmitBtn2').disabled = acText.trim().length < MIN_CONTENT_LENGTH; };

    stopAcDictation = () => {
      if (!isRecording) return;
      isRecording = false;
      try { if (recognition) recognition.stop(); } catch (e) {}
      stopTimer(); dropWake(); setUI(false);
      flushFinals();
    };

    // Correction clavier pendant la dictée → pause propre
    live.addEventListener('focus', () => {
      liveWrap.classList.add('editing');
      if (isRecording) {
        acText = clampMax(live.value || '');
        baseText = acText;
        sessionFinals = '';
        isRecording = false;
        try { if (recognition) recognition.abort(); } catch (e) {}
        stopTimer(); dropWake(); setUI(false);
        hintEl.textContent = 'Dictée en pause — corrige ton texte, puis 🎤 pour reprendre';
        updateSubmit();
      }
      editMode = true;
    });
    live.addEventListener('blur', () => liveWrap.classList.remove('editing'));
    live.addEventListener('input', () => {
      if (live.value.length > MAX_CONTENT_LENGTH) live.value = live.value.slice(0, MAX_CONTENT_LENGTH);
      acText = live.value;
      baseText = acText;
      updateSubmit();
      counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
      counterEl.classList.toggle('limit', acText.length >= MAX_CONTENT_LENGTH);
    });

    recBtn.addEventListener('click', () => {
      if (isRecording) { stopAcDictation(); syncLive(); updateSubmit(); return; }
      if (editMode) {
        acText = clampMax(live.value || '');
        baseText = acText;
        editMode = false;
        liveWrap.classList.remove('editing');
        updateSubmit();
      }
      if (!recognition) {
        recognition = new SpeechRecognition();
        try {
          const uiLang = String(localStorage.getItem('arvexa-lang') || 'fr').toLowerCase();
          recognition.lang = uiLang.startsWith('en') ? 'en-US' : 'fr-FR';
        } catch (e) { recognition.lang = 'fr-FR'; }
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          if (editMode || !isRecording) return;
          let finals = '';
          let interim = '';
          for (let i = 0; i < event.results.length; i++) {
            const r = event.results[i];
            const txt = r && r[0] ? r[0].transcript : '';
            if (!txt) continue;
            if (r.isFinal) finals = acMergeNoOverlap(finals, acWithoutOverlap(baseText, txt));
            else interim += (interim ? ' ' : '') + txt;
          }
          sessionFinals = acCollapseStutter(finals);
          const spokenBase = baseText + (sessionFinals ? ' ' + sessionFinals : '');
          interim = acWithoutOverlap(spokenBase, interim);
          const total = spokenBase + (interim ? ' ' + interim : '');
          if (total.length > MAX_CONTENT_LENGTH) {
            acText = total.slice(0, MAX_CONTENT_LENGTH);
            syncLive(); updateSubmit();
            if (!capWarned) { capWarned = true; showToast('Limite de 2 500 caractères atteinte — dictée arrêtée', 'info'); }
            stopAcDictation();
            syncLive();
            return;
          }
          acText = total;
          syncLive();
          updateSubmit();
        };

        recognition.onerror = (e) => {
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Micro bloqué — autorise le micro dans les réglages du navigateur', 'error');
          } else if (e.error === 'network') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Dictée interrompue (réseau) — ton texte est conservé', 'error');
          } else if (e.error === 'audio-capture') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Aucun micro détecté', 'error');
          }
        };

        recognition.onend = () => {
          flushFinals();
          if (editMode) return;
          acText = baseText;
          syncLive();
          updateSubmit();
          if (isRecording) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300);
        };
      }

      try {
        flushFinals();
        capWarned = false;
        baseText = clampMax(acText ? acText + ' ' : '');
        recognition.start();
        isRecording = true;
        setUI(true);
        startTimer();
        grabWake();
        syncLive();
      } catch (e) {
        showToast('Impossible de démarrer la dictée', 'error');
      }
    });

    // Retour d'onglet : Chrome coupe le micro → relance
    const visHandler = () => {
      if (document.visibilityState === 'visible' && isRecording && recognition) {
        try { recognition.start(); } catch (e) {}
      }
    };
    document.removeEventListener('visibilitychange', window.__acVisHandler || (() => {}));
    window.__acVisHandler = visHandler;
    document.addEventListener('visibilitychange', visHandler);

    $('acVoiceBack').addEventListener('click', () => { stopAcDictation(); showModeChoice(); });
    $('acSubmitBtn2').addEventListener('click', submitAutoAdd);

    if (acText) { live.value = acText; updateSubmit(); }
    counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
  }

  // ═══ Soumission — autoAddSection (l'IA classe tout) ═══
  async function submitAutoAdd() {
    if (acBusy) return;
    const rawInput = (acText || '').trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }

    const submitBtn = $('acSubmitBtn') || $('acSubmitBtn2');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.classList.add('loading'); }
    stopAcDictation();

    const container = $('view-section');
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    container.classList.add('active');
    const cleanupProgress = showGeneratingState(container, 'auto');

    try {
      closeModal();
      __isAddCourseModalOpen = false;
      const result = await callApi('autoAddSection', { rawInput });
      cleanupProgress();
      state.autoAdded = { chapterId: result.chapterId, sectionId: result.sectionId, createdChapter: !!result.createdChapter };
      delete state.cache.chapters[result.subject];
      delete state.cache.chapter[`${result.subject}/${result.chapterId}`];
      showToast(`IA : ${result.subjectLabel || 'Matière'} › ${result.chapterTitle || 'Chapitre'}${result.createdChapter ? ' (nouveau chapitre)' : ''} — renomme si tu veux`, 'success', 6000);
      navigate('section', { subject: result.subject, chapterId: result.chapterId, sectionId: result.sectionId });
    } catch (e) {
      cleanupProgress();
      if (e.code === 'FREE_SECTION_LIMIT') {
        showPremiumModal();
        applyRoute({ view: 'notebooks', params: {} });
      } else if (e.code === 'NOT_COURSE' || e.code === 'SUBJECT_UNKNOWN') {
        // ✅ v8.39 — l'IA a jugé que ce texte n'est pas un cours (ou une matière
        // hors cahier) : message clair + SA saisie est retrouvée pour correction.
        window.__acResumeText = rawInput;
        showToast(e.message || 'Ce contenu ne ressemble pas à un cours', 'error', 7000);
        __isAddCourseModalOpen = false;
        openAddCourseModal();
      } else {
        showToast('Erreur : ' + (e.message || 'analyse impossible'), 'error', 5000);
        applyRoute({ view: 'notebooks', params: {} });
      }
    }
  }

  showModeChoice();
  if (resumeText.trim().length > 0) { acMode = 'texte'; showVerifyMode(); }
}

// ── Modale de renommage (v8.38 — ajuster la proposition de l'IA) ──
function openRenameModal({ title, heading, onSave }) {
  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>${escapeHtml(heading || 'Renommer')}</h2>
        <p>Donne le nom qui te aide à te retrouver</p>
      </div>
      <div class="form-field">
        <label class="form-label">Nouveau nom</label>
        <input type="text" class="form-input" id="renameInput" maxlength="100">
      </div>
      <button class="btn-full primary" id="renameSaveBtn" disabled>
        <span class="btn-icon"><i class="fas fa-check"></i></span>
        <span class="btn-text">Enregistrer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `, { center: true });

  const input = $('renameInput');
  const btn = $('renameSaveBtn');
  input.value = title || '';
  btn.disabled = input.value.trim().length < 2;
  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
  setTimeout(() => input.focus(), 200);
  btn.addEventListener('click', async () => {
    const v = input.value.trim();
    if (v.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await onSave(v);
      closeModal();
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
}

// ══════════════════════════════════════════════════════════════
// TRACKING TEMPS D'ÉTUDE
// ══════════════════════════════════════════════════════════════
let studyLastSync = Date.now();
const STUDY_SYNC_INTERVAL_MS = 2 * 60 * 1000;

function getCurrentSubjectFromView() {
  if (state.view === 'notebook' || state.view === 'chapter' || state.view === 'section' || state.view === 'lesson') {
    return state.params.subject || null;
  }
  return null;
}

async function syncStudyTime(reason = 'heartbeat') {
  if (!state.user) return;

  const now = Date.now();
  const elapsed = now - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);
  if (minutes < 1) return;

  const minutesToSend = Math.min(120, minutes);
  const subject = getCurrentSubjectFromView();
  studyLastSync = now;

  try {
    const token = await getIdToken(state.user, true);
    const payload = { action: 'trackStudyTime', minutes: minutesToSend };
    if (subject) payload.subject = subject;

    const response = await fetch('/api/progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    if (response.status === 401) return;
    if (!response.ok) { console.warn('[STUDY] Erreur serveur:', response.status); return; }
    console.log(`[STUDY] +${minutesToSend} min (${reason})${subject ? ' ' + subject : ''}`);
  } catch (e) {
    console.warn('[STUDY] sync failed:', e.message);
  }
}

setInterval(() => {
  if (document.visibilityState === 'visible') syncStudyTime('heartbeat');
}, STUDY_SYNC_INTERVAL_MS);

window.addEventListener('beforeunload', () => {
  const elapsed = Date.now() - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);
  if (minutes >= 1 && state.user) {
    try {
      const cachedToken = sessionStorage.getItem('arvexa_id_token');
      if (cachedToken) {
        const payload = { action: 'trackStudyTime', minutes: Math.min(120, minutes) };
        const subject = getCurrentSubjectFromView();
        if (subject) payload.subject = subject;
        fetch('/api/progress', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${cachedToken}`
          },
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(() => {});
      }
    } catch (e) {}
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') syncStudyTime('hidden');
  else if (document.visibilityState === 'visible') studyLastSync = Date.now();
});

async function cacheToken() {
  if (!state.user) return;
  try {
    const token = await getIdToken(state.user, true);
    sessionStorage.setItem('arvexa_id_token', token);
  } catch (_) {}
}
setInterval(cacheToken, 30 * 60 * 1000);

// ══════════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════════
requireAuth({
  onUser: async (user) => {
    state.user = user;
    try {
      // ⚡ Cache-first : cahier peint depuis le cache Firestore local,
      // revalidé silencieusement en arrière-plan (réapplication seulement
      // si le statut Premium a changé entre-temps).
      await docSWR(doc(db, 'users', user.uid), (snap) => {
        state.userData = snap.data();
        state.isPremium = isPremiumUser(state.userData);
        updatePremiumBadge();
        applyRoute(routeFromHash());
      }, (a, b) => isPremiumUser(a) !== isPremiumUser(b));
    } catch (_) {}

    if (!window.location.hash) window.history.replaceState(null, '', '#/notebooks');

    cacheToken();
  },
  onNoUser: () => {
    window.location.replace('auth-choice.html');
  }
});

function isPremiumUser(data) {
  if (!data) return false;
  const status = data.subscriptionStatus || 'none';
  if (status === 'pending') return false;
  const hasPremium = data.premium === true || data.isUnlocked === true || data.hasDeposited === true;
  const end = data.subscriptionEndDate?.toDate?.() ||
    (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);
  if (hasPremium && end) return end.getTime() > Date.now();
  if (status === 'expired') return false;
  if (hasPremium && !end) return true;
  return false;
}
