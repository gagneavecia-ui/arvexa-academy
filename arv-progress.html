          acJob.label = `Lecture IA du lot ${b + 1}/${total}… — continue en arrière-plan si tu veux`;
          const txtEl = document.getElementById('acProgTxt');
          if (txtEl) txtEl.textContent = acJob.label;
          acPillUpdate();
        });
        if (acJob.cancelled) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
        acJobStep(95, 'Assemblage du texte…');
        acBusy = false;
        acFinishExtraction(text, 'Photos (OCR)');
        if (text && String(text).trim().length > 0 && text.length > MAX_CONTENT_LENGTH) {
          showToast(`Extrait ramené à ${MAX_CONTENT_LENGTH} caractères`, 'info');
        }
      } catch (e) {
        acBusy = false;
        acJobStop();
        if (e.code !== 'AC_CANCELLED') {
          showToast(window.ARVX_AI?.errMessage ? window.ARVX_AI.errMessage(e?.code || '') : (e.message || 'Extraction impossible'), 'error', 5000);
          showModeChoice();
        }
      }
    }, { once: true });
    setTimeout(() => input.click(), 50);
  }

  // ═══ Mode PDF — texte natif, sinon OCR des pages ═══
  // ✅ v8.39 — LIMITE 7 Mo demandée par le propriétaire : au-delà, message
  // clair (pas de compression silencieuse) ; en dessous, extraction fiable.
  const PDF_MAX_BYTES = 7 * 1024 * 1024;
  function startPdfPicker() {
    acMode = 'pdf';
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,.pdf';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', async () => {
      const file = (input.files || [])[0];
      input.remove();
      if (!file) { showModeChoice(); return; }
      if (file.size > PDF_MAX_BYTES) {
        const mb = (file.size / (1024 * 1024)).toFixed(1).replace('.', ',');
        showToast(`PDF trop volumineux (${mb} Mo) — la taille maximale est 7 Mo. Choisis un PDF plus léger.`, 'error', 6000);
        showModeChoice();
        return;
      }
      acBusy = true;
      acBody.innerHTML = acProgressScreenHtml('Lecture du PDF…');
      acWireProgressButtons(showModeChoice, () => { acBusy = false; });

      const myToken = ++acJob.seq;
      acJob.modalToken = myToken;
      acJobBegin('pdf', `Extraction du PDF (${(file.size / (1024 * 1024)).toFixed(1).replace('.', ',')} Mo)`);
      try {
        let text = '';
        // étapes réellement finies → pourcentage fiable :
        // parse 1-8 % · couche texte 8-70 % · rendu scanné 8-30 % · OCR 30-92 %
        const res = await acExtractPdfText(file, (p, total, all) => {
          if (acJob.cancelled) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
          acJobStep(8 + Math.round((p / Math.max(total, 1)) * 62), `Extraction du texte — page ${p}/${total}${all > total ? ` (sur ${all})` : ''}…`);
        });
        if (res.scanned) {
          // PDF scanné : pages rendues en images → OCR (kit IA, 10 pages max — v8.39)
          if (!window.ARVX_AI) throw new Error('Kit IA indisponible.');
          acJobStep(10, 'PDF scanné — rendu des pages…');
          const pages = await window.ARVX_AI.pdfToImages(file, { maxPages: 10, scale: 1.6, onProgress: (p, n) => {
            if (acJob.cancelled) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
            acJobStep(10 + Math.round((p / Math.max(n, 1)) * 20), `Rendu page ${p}/${n}…`);
          } });
          text = await acOcrImages(pages, (done, total, partial) => {
            if (acJob.cancelled) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
            acJobText(partial);
            acJobStep(30 + Math.round((done / Math.max(total, 1)) * 62), `Lecture IA des pages… (${done}/${total})`);
          }, (b, total) => {
            acJob.label = `Lecture IA des pages… lot ${b + 1}/${total}`;
            const txtEl = document.getElementById('acProgTxt');
            if (txtEl) txtEl.textContent = acJob.label;
            acPillUpdate();
          });
        } else {
          text = res.text;
        }
        if (acJob.cancelled) throw Object.assign(new Error('Annulé'), { code: 'AC_CANCELLED' });
        acJobStep(95, 'Assemblage du texte…');
        acBusy = false;
        const ok = acFinishExtraction(text, 'PDF');
        if (ok && text && String(text).trim().length > 0 && text.length > MAX_CONTENT_LENGTH) {
          showToast(`Extrait ramené à ${MAX_CONTENT_LENGTH} caractères — le reste peut être ajouté en une 2ᵉ section`, 'info', 5000);
        }
      } catch (e) {
        acBusy = false;
        acJobStop();
        if (e.code !== 'AC_CANCELLED') {
          showToast(e.message || 'Extraction impossible', 'error', 5000);
          showModeChoice();
        }
      }
    }, { once: true });
    setTimeout(() => input.click(), 50);
  }

  function clampAc(t) { return String(t || '').length > MAX_CONTENT_LENGTH ? String(t).slice(0, MAX_CONTENT_LENGTH) : String(t || ''); }

  // ═══ Mode VOCAL — dictée avec bouton enregistrer ═══
  function showVoiceMode() {
    acMode = 'vocal';
    setSubtitle('Dicte ta leçon — appuie, parle, ré-appuie pour arrêter');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      acBody.innerHTML = `
        <div class="empty-state" style="padding:24px 16px;">
          <div class="icon"><i class="fas fa-microphone-slash"></i></div>
          <h3>Dictée indisponible</h3>
          <p>Ce navigateur ne soutient pas la dictée vocale. Utilise Chrome, ou saisis ton texte.</p>
        </div>
        <button type="button" class="btn-full secondary" id="acVoiceBack"><span class="btn-icon">←</span><span class="btn-text">Revenir aux modes</span></button>
      `;
      $('acVoiceBack').addEventListener('click', showModeChoice);
      return;
    }

    acBody.innerHTML = `
      <div class="voice-stage" id="acVoiceStage">
        <div class="voice-timer" id="acTimer">00:00</div>
        <button type="button" class="voice-rec-btn" id="acRecBtn" aria-label="Enregistrer">
          <span class="voice-rec-core">
            <i class="fas fa-microphone ic-mic"></i>
            <i class="fas fa-stop ic-stop"></i>
          </span>
        </button>
        <p class="voice-hint" id="acHint">Appuie et parle — durée illimitée</p>
        <div class="voice-live-wrap" id="acLiveWrap">
          <textarea class="voice-live" id="acLive" placeholder="Ton texte apparaîtra ici en direct…" maxlength="${MAX_CONTENT_LENGTH}" rows="3"></textarea>
          <div class="voice-counter" id="acCounter2">0 / ${MAX_CONTENT_LENGTH}</div>
        </div>
        <p class="voice-edit-hint">✏️ Touche ton texte pour corriger les fautes au clavier</p>
        <div class="voice-actions">
          <button type="button" class="btn-full secondary" id="acVoiceBack"><span class="btn-icon">←</span><span class="btn-text">Revenir aux modes</span></button>
          <button class="btn-full primary" id="acSubmitBtn2" disabled>
            <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
            <span class="btn-text">Analyser avec l'IA</span>
            <span class="spinner"></span>
          </button>
        </div>
      </div>
    `;

    const recBtn = $('acRecBtn');
    const timerEl = $('acTimer');
    const hintEl = $('acHint');
    const live = $('acLive');
    const liveWrap = $('acLiveWrap');
    const counterEl = $('acCounter2');

    let recognition = null;
    let isRecording = false;
    let editMode = false;
    let baseText = acText || '';
    let sessionFinals = '';
    let timerInt = null;
    let startedAt = 0;
    let wakeLock = null;
    let capWarned = false;

    const clampMax = (t) => (t.length > MAX_CONTENT_LENGTH ? t.slice(0, MAX_CONTENT_LENGTH) : t);
    const flushFinals = () => {
      if (sessionFinals) {
        baseText = clampMax(acMergeNoOverlap(baseText, sessionFinals));
        sessionFinals = '';
      }
    };
    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    const startTimer = () => {
      startedAt = Date.now();
      timerEl.textContent = '00:00';
      if (timerInt) clearInterval(timerInt);
      timerInt = setInterval(() => { timerEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000)); }, 1000);
    };
    const stopTimer = () => { if (timerInt) { clearInterval(timerInt); timerInt = null; } };
    const grabWake = async () => { try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} };
    const dropWake = () => { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; };
    const setUI = (rec) => {
      recBtn.classList.toggle('recording', rec);
      recBtn.setAttribute('aria-label', rec ? 'Arrêter l\'enregistrement' : 'Enregistrer');
      hintEl.textContent = rec ? 'J\'écoute… Appuie pour arrêter' : 'Appuie et parle — durée illimitée';
    };
    const syncLive = () => {
      if (document.activeElement !== live) {
        live.value = acText;
        live.scrollTop = live.scrollHeight;
      }
      counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
      counterEl.classList.toggle('limit', acText.length >= MAX_CONTENT_LENGTH);
    };
    const updateSubmit = () => { $('acSubmitBtn2').disabled = acText.trim().length < MIN_CONTENT_LENGTH; };

    stopAcDictation = () => {
      if (!isRecording) return;
      isRecording = false;
      try { if (recognition) recognition.stop(); } catch (e) {}
      stopTimer(); dropWake(); setUI(false);
      flushFinals();
    };

    // Correction clavier pendant la dictée → pause propre
    live.addEventListener('focus', () => {
      liveWrap.classList.add('editing');
      if (isRecording) {
        acText = clampMax(live.value || '');
        baseText = acText;
        sessionFinals = '';
        isRecording = false;
        try { if (recognition) recognition.abort(); } catch (e) {}
        stopTimer(); dropWake(); setUI(false);
        hintEl.textContent = 'Dictée en pause — corrige ton texte, puis 🎤 pour reprendre';
        updateSubmit();
      }
      editMode = true;
    });
    live.addEventListener('blur', () => liveWrap.classList.remove('editing'));
    live.addEventListener('input', () => {
      if (live.value.length > MAX_CONTENT_LENGTH) live.value = live.value.slice(0, MAX_CONTENT_LENGTH);
      acText = live.value;
      baseText = acText;
      updateSubmit();
      counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
      counterEl.classList.toggle('limit', acText.length >= MAX_CONTENT_LENGTH);
    });

    recBtn.addEventListener('click', () => {
      if (isRecording) { stopAcDictation(); syncLive(); updateSubmit(); return; }
      if (editMode) {
        acText = clampMax(live.value || '');
        baseText = acText;
        editMode = false;
        liveWrap.classList.remove('editing');
        updateSubmit();
      }
      if (!recognition) {
        recognition = new SpeechRecognition();
        try {
          const uiLang = String(localStorage.getItem('arvexa-lang') || 'fr').toLowerCase();
          recognition.lang = uiLang.startsWith('en') ? 'en-US' : 'fr-FR';
        } catch (e) { recognition.lang = 'fr-FR'; }
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          if (editMode || !isRecording) return;
          let finals = '';
          let interim = '';
          for (let i = 0; i < event.results.length; i++) {
            const r = event.results[i];
            const txt = r && r[0] ? r[0].transcript : '';
            if (!txt) continue;
            if (r.isFinal) finals = acMergeNoOverlap(finals, acWithoutOverlap(baseText, txt));
            else interim += (interim ? ' ' : '') + txt;
          }
          sessionFinals = acCollapseStutter(finals);
          const spokenBase = baseText + (sessionFinals ? ' ' + sessionFinals : '');
          interim = acWithoutOverlap(spokenBase, interim);
          const total = spokenBase + (interim ? ' ' + interim : '');
          if (total.length > MAX_CONTENT_LENGTH) {
            acText = total.slice(0, MAX_CONTENT_LENGTH);
            syncLive(); updateSubmit();
            if (!capWarned) { capWarned = true; showToast('Limite de 2 500 caractères atteinte — dictée arrêtée', 'info'); }
            stopAcDictation();
            syncLive();
            return;
          }
          acText = total;
          syncLive();
          updateSubmit();
        };

        recognition.onerror = (e) => {
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Micro bloqué — autorise le micro dans les réglages du navigateur', 'error');
          } else if (e.error === 'network') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Dictée interrompue (réseau) — ton texte est conservé', 'error');
          } else if (e.error === 'audio-capture') {
            isRecording = false; stopTimer(); dropWake(); setUI(false); syncLive();
            showToast('Aucun micro détecté', 'error');
          }
        };

        recognition.onend = () => {
          flushFinals();
          if (editMode) return;
          acText = baseText;
          syncLive();
          updateSubmit();
          if (isRecording) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300);
        };
      }

      try {
        flushFinals();
        capWarned = false;
        baseText = clampMax(acText ? acText + ' ' : '');
        recognition.start();
        isRecording = true;
        setUI(true);
        startTimer();
        grabWake();
        syncLive();
      } catch (e) {
        showToast('Impossible de démarrer la dictée', 'error');
      }
    });

    // Retour d'onglet : Chrome coupe le micro → relance
    const visHandler = () => {
      if (document.visibilityState === 'visible' && isRecording && recognition) {
        try { recognition.start(); } catch (e) {}
      }
    };
    document.removeEventListener('visibilitychange', window.__acVisHandler || (() => {}));
    window.__acVisHandler = visHandler;
    document.addEventListener('visibilitychange', visHandler);

    $('acVoiceBack').addEventListener('click', () => { stopAcDictation(); showModeChoice(); });
    $('acSubmitBtn2').addEventListener('click', submitAutoAdd);

    if (acText) { live.value = acText; updateSubmit(); }
    counterEl.textContent = `${acText.length} / ${MAX_CONTENT_LENGTH}`;
  }

  // ═══ Soumission — autoAddSection (l'IA classe tout) ═══
  // ═══ Analyse IA — ✅ v8.40 EN ARRIÈRE-PLAN ═══
  // (demande propriétaire : « l'extraction continue même si on est sur la
  // page d'accueil, en arrière-plan, naviguer librement sans attendre ») —
  // la modale se ferme, une pastille discrète suit l'analyse, l'élève peut
  // naviguer dans TOUTES les vues du Résumé et même quitter la page : l'appel
  // part avec keepalive, la section est créée côté serveur et l'élève la
  // retrouve à son retour.
  async function submitAutoAdd() {
    if (acBusy) return;
    const rawInput = (acText || '').trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }
    if (acJob.active && acJob.kind === 'analyse') {
      showToast('Une analyse est déjà en cours — la section arrive', 'info');
      return;
    }

    const submitBtn = $('acSubmitBtn') || $('acSubmitBtn2');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.classList.add('loading'); }
    stopAcDictation();

    // ✅ v8.41 — le contexte suit la SOURCE du texte : si ce texte vient d'une
    // extraction (photos/PDF), c'est le contexte FIGÉ au début de l'extraction
    // qui gagne ; sinon c'est le contexte de la modale (section ou cours).
    const submitCtx = (acJob.active && (acJob.kind === 'photos' || acJob.kind === 'pdf') && acJob.ctx)
      ? acJob.ctx
      : (__acOpenCtx || null);
    const isSectionCtx = !!(submitCtx && submitCtx.subject && submitCtx.chapterId);

    // ✅ v8.41 — file des ajouts récents : l'entrée passe « Analyse » pendant
    // l'appel (elle sera retirée à la réussite, rendue « Prêt » à l'échec).
    // Source de l'id : extraction live EN COURS, sinon texte venu d'une
    // extraction finie / d'une reprise de la file (acResumeQid).
    const jobQid = (acJob.active && acJob.kind !== 'analyse' && acJob.qid) ? acJob.qid : null;
    const qid = jobQid || acResumeQid || null;
    acResumeQid = null;
    if (qid) acQueueUpsert({ id: qid, status: 'analysee', text: rawInput });

    // ✅ v8.46a — LES ÉTAPES S'AFFICHENT DANS LA MODALE (retour demandé par le
    // propriétaire) + bouton « Continuer en arrière-plan » EN BAS. La modale
    // ne se ferme plus d'office : c'est l'élève qui choisit (bouton) — et
    // s'il quitte la page entière, l'appel keepalive termine côté serveur et
    // la section est créée quand même.
    acJob.active = true;
    acJob.kind = 'analyse';
    acJob.cancelled = false;
    acJob.pct = 1;
    acJob.label = isSectionCtx ? 'Analyse IA en cours — ta section arrive' : 'Analyse IA en cours — ton résumé se prépare';
    acJob.modalToken = ++acJob.seq;
    if (!acJob.qid) {
      acJob.qid = `ac${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
      acQueueUpsert({
        id: acJob.qid,
        mode: 'texte',
        ctx: isSectionCtx ? 'section' : 'cours',
        subject: isSectionCtx ? submitCtx.subject : null,
        chapterId: isSectionCtx ? submitCtx.chapterId : null,
        ctxLabel: isSectionCtx ? (SUBJECTS[submitCtx.subject]?.label || '') : '',
        title: acJob.label,
        status: 'analysee',
        pct: 1,
        text: rawInput,
        createdAt: Date.now()
      });
    } else {
      acQueueUpsert({ id: acJob.qid, status: 'analysee', text: rawInput });
    }
    acPillEnsure();
    acBody.innerHTML = acAnalysisScreenHtml();
    acWireAnalysisButtons();
    acAnalysisBegin();

    try {
      let result;
      if (isSectionCtx) {
        // ✅ v8.41 — SECTION : la matière et le chapitre sont déjà choisis —
        // createSection direct (le même contenu, le même arrière-plan keepalive).
        result = await callApi('createSection', { subject: submitCtx.subject, chapterId: submitCtx.chapterId, rawInput }, 1, false, { keepalive: true });
      } else {
        // COURS : l'IA détecte la matière et classe la section (keepalive).
        result = await callApi('autoAddSection', { rawInput }, 1, false, { keepalive: true });
      }
      acAnalysisMarkAllDone();
      acAnalysisStop();
      acJobStop();
      try { if (window.ARVEXAWakeLock) window.ARVEXAWakeLock.release('analyse'); } catch (e) {}
      if (qid || acJob.qid) acQueueRemove(qid || acJob.qid); // généré → l'entrée sort de la file
      closeModal();
      __isAddCourseModalOpen = false;
      acPillUpdate();
      if (isSectionCtx) {
        try { localStorage.removeItem(`arvexa_section_draft_${submitCtx.subject}_${submitCtx.chapterId}`); } catch (e) {}
        delete state.cache.chapters[submitCtx.subject];
        delete state.cache.chapter[`${submitCtx.subject}/${submitCtx.chapterId}`];
        showToast('Section analysée — bon travail !', 'success');
        navigate('section', { subject: submitCtx.subject, chapterId: submitCtx.chapterId, sectionId: result.sectionId });
      } else {
        state.autoAdded = { chapterId: result.chapterId, sectionId: result.sectionId, createdChapter: !!result.createdChapter };
        delete state.cache.chapters[result.subject];
        delete state.cache.chapter[`${result.subject}/${result.chapterId}`];
        showToast(`IA : ${result.subjectLabel || 'Matière'} › ${result.chapterTitle || 'Chapitre'}${result.createdChapter ? ' (nouveau chapitre)' : ''} — renomme si tu veux`, 'success', 6000);
        navigate('section', { subject: result.subject, chapterId: result.chapterId, sectionId: result.sectionId });
      }
    } catch (e) {
      acAnalysisStop();
      acJobStop();
      try { if (window.ARVEXAWakeLock) window.ARVEXAWakeLock.release('analyse'); } catch (err) {}
      closeModal();
      __isAddCourseModalOpen = false;
      acPillUpdate();
      // ✅ v8.41 — échec de l'analyse : l'entrée repasse « Prêt » (texte intact),
      // l'élève relance en un tap depuis la file ou la modale rouverte.
      if (qid || acJob.qid) acQueueUpsert({ id: qid || acJob.qid, status: 'done', text: rawInput });
      if (e.code === 'FREE_SECTION_LIMIT') {
        showPremiumModal();
        applyRoute({ view: 'notebooks', params: {} });
      } else if (e.code === 'NOT_COURSE' || e.code === 'SUBJECT_UNKNOWN') {
        // ✅ v8.39 — l'IA a jugé que ce texte n'est pas un cours (ou une matière
        // hors cahier) : message clair + SA saisie est retrouvée pour correction.
        window.__acResumeText = rawInput;
        showToast(e.message || 'Ce contenu ne ressemble pas à un cours', 'error', 7000);
        __isAddCourseModalOpen = false;
        openAddCourseModal(isSectionCtx ? submitCtx : undefined);
      } else {
        // ✅ v8.40 — RIEN n'est perdu : la saisie de l'élève est retrouvée dans
        // la modale, il relance en un tap (les pannes passagères sont déjà
        // absorbées par la chaîne IA robuste côté serveur).
        window.__acResumeText = rawInput;
        showToast(e.message || 'Analyse impossible — ta leçon est conservée, réessaie', 'error', 6000);
        __isAddCourseModalOpen = false;
        openAddCourseModal(isSectionCtx ? submitCtx : undefined);
      }
    }
  }

  // ✅ v8.41 — ordre d'ouverture : un extraction LIVE d'abord (la modale
  // rouverte via la pastille doit refléter la progression), sinon la saisie
  // reprise (texte de l'IA / brouillon de section), sinon le choix du mode.
  // ✅ v8.46a — une ANALYSE en cours se RATTACHE (jamais de redémarrage) :
  // « dès que je sors et que je rentre ça redémarre la génération » réparé —
  // la modale rouverte peint les étapes avec le % EN DIRECT du job vivant.
  if (acJob.active && (acJob.kind === 'photos' || acJob.kind === 'pdf')) {
    acBusy = true;
    acBody.innerHTML = acProgressScreenHtml(acJob.label || 'Extraction en cours…');
    acWireProgressButtons(showModeChoice, () => {});
    const pctEl = $('acPct'); const barEl = $('acBarFill'); const txtEl = $('acProgTxt');
    if (pctEl) pctEl.textContent = `${acJob.pct || 0} %`;
    if (barEl) barEl.style.width = `${acJob.pct || 0}%`;
    if (txtEl) txtEl.textContent = acJob.label || 'Extraction en cours…';
    acJob.modalToken = ++acJob.seq; // la fin de l'extraction alimentera CETTE modale
  } else if (acJob.active && acJob.kind === 'analyse') {
    acBody.innerHTML = acAnalysisScreenHtml();
    acWireAnalysisButtons();
    acAnalysisPaint(); // états d'étapes calculés depuis le % du job VIVANT
    acJob.modalToken = ++acJob.seq; // la fin de l'analyse alimentera CETTE modale
  } else if (resumeText.trim().length > 0) {
    acMode = 'texte';
    showVerifyMode();
  } else {
    showModeChoice();
  }
}

// ── Modale de renommage (v8.38 — ajuster la proposition de l'IA) ──
function openRenameModal({ title, heading, onSave }) {
  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>${escapeHtml(heading || 'Renommer')}</h2>
        <p>Donne le nom qui te aide à te retrouver</p>
      </div>
      <div class="form-field">
        <label class="form-label">Nouveau nom</label>
        <input type="text" class="form-input" id="renameInput" maxlength="100">
      </div>
      <button class="btn-full primary" id="renameSaveBtn" disabled>
        <span class="btn-icon"><i class="fas fa-check"></i></span>
        <span class="btn-text">Enregistrer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `, { center: true });

  const input = $('renameInput');
  const btn = $('renameSaveBtn');
  input.value = title || '';
  btn.disabled = input.value.trim().length < 2;
  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
  setTimeout(() => input.focus(), 200);
  btn.addEventListener('click', async () => {
    const v = input.value.trim();
    if (v.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await onSave(v);
      closeModal();
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
}

// TRACKING TEMPS D'ÉTUDE
// ══════════════════════════════════════════════════════════════
let studyLastSync = Date.now();
const STUDY_SYNC_INTERVAL_MS = 2 * 60 * 1000;

function getCurrentSubjectFromView() {
  if (state.view === 'notebook' || state.view === 'chapter' || state.view === 'section' || state.view === 'lesson') {
    return state.params.subject || null;
  }
  return null;
}

// ✅ v8.43 — position PRÉCISE : matière + chapitre courant (pour le tracking
// du temps passé PAR CHAPITRE — la carte intelligente de l'accueil compare
// ces temps pour détecter les lacunes).
function getCurrentChapterFromView() {
  if (state.view === 'chapter' || state.view === 'section' || state.view === 'lesson') {
    return state.params.chapterId || null;
  }
  return null;
}

async function syncStudyTime(reason = 'heartbeat') {
  if (!state.user) return;

  const now = Date.now();
  const elapsed = now - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);
  if (minutes < 1) return;

  const minutesToSend = Math.min(120, minutes);
  const subject = getCurrentSubjectFromView();
  const chapterId = getCurrentChapterFromView();
  studyLastSync = now;

  try {
    const token = await getIdToken(state.user, true);
    const payload = { action: 'trackStudyTime', minutes: minutesToSend };
    if (subject) payload.subject = subject;
    if (subject && chapterId) payload.chapterId = chapterId;

    const response = await fetch('/api/progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    if (response.status === 401) return;
    if (!response.ok) { console.warn('[STUDY] Erreur serveur:', response.status); return; }
    console.log(`[STUDY] +${minutesToSend} min (${reason})${subject ? ' ' + subject : ''}`);
  } catch (e) {
    console.warn('[STUDY] sync failed:', e.message);
  }
}

setInterval(() => {
  if (document.visibilityState === 'visible') syncStudyTime('heartbeat');
}, STUDY_SYNC_INTERVAL_MS);

window.addEventListener('beforeunload', () => {
  const elapsed = Date.now() - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);
  if (minutes >= 1 && state.user) {
    try {
      const cachedToken = sessionStorage.getItem('arvexa_id_token');
      if (cachedToken) {
        const payload = { action: 'trackStudyTime', minutes: Math.min(120, minutes) };
        const subject = getCurrentSubjectFromView();
        const chapterId = getCurrentChapterFromView();
        if (subject) payload.subject = subject;
        if (subject && chapterId) payload.chapterId = chapterId;
        fetch('/api/progress', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${cachedToken}`
          },
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(() => {});
      }
    } catch (e) {}
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') syncStudyTime('hidden');
  else if (document.visibilityState === 'visible') studyLastSync = Date.now();
});

async function cacheToken() {
  if (!state.user) return;
  try {
    const token = await getIdToken(state.user, true);
    sessionStorage.setItem('arvexa_id_token', token);
  } catch (_) {}
}
setInterval(cacheToken, 30 * 60 * 1000);

});

function isPremiumUser(data) {
  if (!data) return false;
  const status = data.subscriptionStatus || 'none';
  if (status === 'pending') return false;
  const hasPremium = data.premium === true || data.isUnlocked === true || data.hasDeposited === true;
  const end = data.subscriptionEndDate?.toDate?.() ||
    (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);
  if (hasPremium && end) return end.getTime() > Date.now();
  if (status === 'expired') return false;
  if (hasPremium && !end) return true;
  return false;
}
