<script src="theme.js"></script><script src="arvexa-sidebar.js" defer></script><!-- ✅ v8.62a — menu latéral unifié --><script src="arvexa-soon.js" defer></script><script src="arvexa-contact.js"></script><script src="arvexa-i18n.js" defer></script>
  <meta name="description" content="ARVEXA School - Programme Ambassadeur : partage l'app, gagne des commissions">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="arvexa-ui.css">
  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --bg-dark: #0A0A0A;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --border: rgba(184, 134, 11, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top, #101010 0%, var(--bg-dark) 60%);
      color: var(--text-light);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ===== HEADER — UNIFIÉ v8.62a (menu ☰ + titre + actions ↻, modèle abonnement) ===== */
    .header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(224,184,74,.10);
      min-height: 60px;
    }
    .header .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .header .menu-toggle {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 15px; flex-shrink: 0; transition: all .18s ease;
    }
    .header .menu-toggle:hover {
      border-color: rgba(224,184,74,.30); color: var(--accent-bright);
      background: rgba(224,184,74,.05);
    }
    .header .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
    .header .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(14px, 1.8vw, 16px); font-weight: 700; letter-spacing: -.01em;
      color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; margin: 0;
    }
    .header .page-title i { color: var(--accent-bright); margin-right: 6px; font-size: 13px; }
    .header .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header .header-actions button {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 14px; transition: all .18s ease;
    }
    .header .header-actions button:hover {
      border-color: rgba(224,184,74,.30); color: var(--accent-bright);
      background: rgba(224,184,74,.05);
    }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 0; }

    .loading-block { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
    .loading-block i { font-size: 20px; color: var(--accent-bright); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

    /* ===== HERO ===== */
    .hero {
      position: relative; overflow: hidden;
      text-align: center;
      background: linear-gradient(160deg, rgba(184,134,11,.18), rgba(26,58,42,.4) 50%, rgba(10,10,10,.65));
      border: 1px solid rgba(224,184,74,.3);
      border-radius: 24px; padding: 30px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .hero::before {
      content: '👑';
      position: absolute; top: -18px; right: -10px; font-size: 90px; opacity: .08;
      transform: rotate(12deg); pointer-events: none;
    }
    .hero-crown {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--bg-dark);
      box-shadow: 0 10px 30px rgba(184,134,11,.35);
    }
    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 800; letter-spacing: .4px;
    }
    .hero p.lead { font-size: 14px; color: var(--text-dim); margin: 10px auto 0; max-width: 420px; line-height: 1.6; }

    .perks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 22px; }
    .perk {
      padding: 13px 8px; border-radius: 15px;
      background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
      text-align: center;
    }
    .perk i { color: var(--accent-bright); font-size: 17px; }
    .perk b { display: block; font-size: 15px; margin-top: 6px; }
    .perk span { font-size: 10.5px; color: var(--text-dim); }

    /* ===== CRITÈRES ===== */
    .criteria { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: rgba(255,255,255,.02); border: 1px dashed rgba(184,134,11,.3); }
    .criteria h3 { font-size: 13.5px; font-weight: 800; color: var(--accent-bright); margin-bottom: 10px; }
    .criteria ul { list-style: none; }
    .criteria li { font-size: 12.5px; color: var(--text-dim); padding: 5px 0 5px 22px; position: relative; line-height: 1.5; }
    .criteria li::before { content: '✦'; position: absolute; left: 2px; color: var(--accent-bright); }

    /* ===== FORMULAIRE ===== */
    .form-card {
      margin-top: 22px; padding: 20px 18px; border-radius: 20px;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .form-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .form-card .sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; padding: 13px 14px; border-radius: 13px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent-bright); }
    .field textarea { resize: vertical; min-height: 84px; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 800; color: var(--bg-dark);
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      transition: transform .1s, filter .2s;
    }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn[disabled] { filter: grayscale(.6); opacity: .6; cursor: wait; }
    .form-msg { font-size: 12.5px; margin-top: 10px; display: none; padding: 10px 13px; border-radius: 11px; }
    .form-msg.error { display: block; background: rgba(192,57,43,.12); color: #EF9A9A; border: 1px solid rgba(192,57,43,.3); }
    .form-msg.info { display: block; background: rgba(46,125,50,.1); color: #A5D6A7; border: 1px solid rgba(46,125,50,.3); }

    /* ===== v8.57a — SÉLECTEUR PAYS + TÉLÉPHONE (identique à l'inscription) ===== */
    .picker-btn {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 13px 14px; border-radius: 13px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px;
      cursor: pointer; outline: none; transition: border-color .2s;
    }
    .picker-btn:focus, .picker-btn:active { border-color: var(--accent-bright); }
    .picker-btn .picker-flag { font-size: 19px; line-height: 1; }
    .picker-btn .picker-label { flex: 1; text-align: left; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .picker-btn .picker-dial { color: var(--text-dim); font-weight: 700; font-size: 13px; }
    .picker-btn .picker-chevron { color: var(--text-dim); font-size: 12px; }
    .phone-wrap {
      display: flex; align-items: stretch; gap: 0;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 13px; overflow: hidden;
    }
    .phone-wrap:focus-within { border-color: var(--accent-bright); }
    .dial-chip {
      display: flex; align-items: center; padding: 0 12px;
      font-size: 14px; font-weight: 800; color: var(--accent-bright);
      background: rgba(224,184,74,.1); border-right: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }
    .phone-wrap input {
      flex: 1; min-width: 0; padding: 13px 14px; border: none; background: transparent;
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    }
    .phone-wrap input::placeholder { color: rgba(138,138,122,.7); }

    /* Modale pays — 100 % custom aux couleurs du site (jamais la popup native) */
    .picker-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.66); backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center;
    }
    .picker-overlay.show { display: flex; }
    .picker-sheet {
      width: 100%; max-width: 520px; max-height: 78vh; overflow: hidden;
      background: #121212; border: 1px solid rgba(224,184,74,.28);
      border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
      box-shadow: 0 -18px 50px rgba(0,0,0,.6);
      animation: sheetUp .22s ease-out;
    }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
    .picker-handle { width: 44px; height: 4px; border-radius: 99px; background: rgba(224,184,74,.5); margin: 12px auto 4px; flex-shrink: 0; }
    .picker-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 6px; flex-shrink: 0; }
    .picker-head h2 { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 800; }
    .picker-close {
      width: 34px; height: 34px; border-radius: 11px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06); color: var(--text-light); cursor: pointer; font-size: 14px;
    }
    .picker-search-wrap { padding: 6px 18px 10px; flex-shrink: 0; }
    .picker-search-wrap input {
      width: 100%; padding: 12px 14px; border-radius: 13px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    }
    .picker-search-wrap input:focus { border-color: var(--accent-bright); }
    .picker-list { list-style: none; overflow-y: auto; padding: 0 10px 18px; flex: 1; }
    .picker-list li {
      display: flex; align-items: center; gap: 11px;
      padding: 12px 12px; border-radius: 13px; cursor: pointer; font-size: 14.5px;
    }
    .picker-list li:active, .picker-list li:hover { background: rgba(224,184,74,.08); }
    .picker-list li .flag { font-size: 20px; line-height: 1; }
    .picker-list li .nm { flex: 1; font-weight: 700; }
    .picker-list li .dl { color: var(--text-dim); font-size: 13px; font-weight: 700; }
    .picker-list li.sel { background: rgba(224,184,74,.12); }

    /* ===== VUES STATUT ===== */
    .status-card {
      margin-top: 22px; padding: 26px 22px; border-radius: 20px; text-align: center;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .status-card i.big { font-size: 30px; color: var(--accent-bright); margin-bottom: 12px; display: block; }
    .status-card h3 { font-size: 17px; font-weight: 800; }
    .status-card p { font-size: 13px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }

    /* ===== DASHBOARD ===== */
    .dash-hero {
      position: relative; overflow: hidden;
      background: linear-gradient(150deg, rgba(184,134,11,.2), rgba(26,58,42,.4) 55%, rgba(10,10,10,.65));
      border: 1px solid rgba(224,184,74,.32);
      border-radius: 22px; padding: 22px 20px;
    }
    .dash-hero .rank { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent-bright); }
    .dash-hero h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; margin-top: 5px; }
    .dash-hero p { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

    .code-box {
      margin-top: 16px; padding: 14px 16px; border-radius: 15px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(224,184,74,.35);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .code-box .code { font-size: 19px; font-weight: 900; letter-spacing: 2px; color: var(--accent-bright); font-family: 'Playfair Display', serif; }
    .code-box .link-mini {
      font-size: 11px; color: var(--text-dim); margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
      display: block;
    }
    .share-row { display: flex; gap: 9px; margin-top: 12px; }
    .share-btn {
      flex: 1; padding: 12px; border-radius: 13px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .1s;
    }
    .share-btn:active { transform: scale(.97); }
    .share-btn.wa { background: #1FA855; color: #fff; }
    .share-btn.copy { background: rgba(255,255,255,.07); color: var(--text-light); border: 1px solid rgba(255,255,255,.12); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 22px; }
    .stat-card {
      padding: 15px 14px; border-radius: 16px;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,.07);
    }
    .stat-card i { color: var(--accent-bright); font-size: 14px; }
    .stat-card b { display: block; font-size: 24px; font-weight: 800; margin-top: 6px; font-family: 'Playfair Display', serif; }
    .stat-card span { font-size: 11px; color: var(--text-dim); }
    .stat-card.earnings { grid-column: 1 / -1; border-color: rgba(224,184,74,.4); background: linear-gradient(150deg, rgba(184,134,11,.14), rgba(20,20,20,.8)); }

    .mission-card { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: rgba(255,255,255,.02); border: 1px dashed rgba(184,134,11,.3); }
    .mission-card h3 { font-size: 13.5px; font-weight: 800; color: var(--accent-bright); margin-bottom: 10px; }
    .mission-card ul { list-style: none; }
    .mission-card li { font-size: 12.5px; color: var(--text-dim); padding: 5px 0 5px 22px; position: relative; line-height: 1.5; }
    .mission-card li::before { content: '⚡'; position: absolute; left: 0; font-size: 11px; }

    .levels { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: var(--bg-card); border: 1px solid rgba(255,255,255,.07); }
    .levels h3 { font-size: 13.5px; font-weight: 800; margin-bottom: 12px; }
    .level-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 12.5px; }
    .level-row .name { font-weight: 700; }
    .level-row .name.active { color: var(--accent-bright); }
    .level-row .req { color: var(--text-dim); font-size: 11.5px; }

    /* ===== v8.57a — CTA de fin de dashboard (Gérer ma promo / Marketplace) ===== */
    .amb-cta {
      display: flex; align-items: center; gap: 13px; text-decoration: none;
      padding: 16px 16px; border-radius: 18px; margin-top: 14px;
      background: linear-gradient(150deg, rgba(224,184,74,.12), rgba(20,20,20,.85));
      border: 1px solid rgba(224,184,74,.32);
    }
    .amb-cta .crown { width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: var(--bg-dark); }
    .amb-cta-body { flex: 1; min-width: 0; }
    .amb-cta-body h3 { font-size: 14.5px; font-weight: 800; color: var(--text-light); }
    .amb-cta-body p { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
    .amb-cta .arrow { color: var(--accent-bright); font-size: 13px; flex-shrink: 0; }

    /* ===== ✅ v8.58a — GÉRER MA PROMO (section inline du dashboard, ex-ma-promo.html) ===== */
    .promo-section { margin-top: 26px; }
    .promo-sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13.5px; font-weight: 800; color: var(--accent-bright); margin: 0 0 12px;
    }
    .card {
      margin-top: 14px; padding: 20px 18px; border-radius: 20px;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .card .sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.55; }
    .promo-hero {
      position: relative; overflow: hidden;
      background: linear-gradient(150deg, rgba(184,134,11,.2), rgba(26,58,42,.4) 55%, rgba(10,10,10,.65));
      border: 1px solid rgba(224,184,74,.32);
      border-radius: 22px; padding: 22px 20px;
    }
    .promo-hero .kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent-bright); }
    .promo-hero h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; margin-top: 5px; }
    .promo-hero p { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.55; }
    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    @media (max-width: 420px) { .choice-row { grid-template-columns: 1fr; } }
    .choice-card {
      padding: 22px 16px; border-radius: 20px; text-align: center; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border);
      transition: transform .1s, border-color .2s;
    }
    .choice-card:active { transform: scale(.98); border-color: var(--accent-bright); }
    .choice-card i { font-size: 26px; color: var(--accent-bright); }
    .choice-card h3 { font-size: 15px; margin-top: 10px; }
    .choice-card p { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
    .ghost-btn {
      width: 100%; padding: 13px; border-radius: 14px; cursor: pointer; margin-top: 10px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .ghost-btn:active { transform: scale(.98); }
    .ghost-btn.danger { color: #EF9A9A; border-color: rgba(192,57,43,.4); background: rgba(192,57,43,.08); }
    .stat-card.gold { grid-column: 1 / -1; border-color: rgba(224,184,74,.4); background: linear-gradient(150deg, rgba(184,134,11,.14), rgba(20,20,20,.8)); }
    .composer-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .composer-tab {
      flex: 1; padding: 11px; border-radius: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: var(--text-dim);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 800; text-align: center;
    }
    .composer-tab.active { color: var(--bg-dark); background: linear-gradient(135deg, var(--accent-bright), var(--accent)); border-color: transparent; }
    .file-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
      padding: 12px 14px; border-radius: 13px;
      background: rgba(255,255,255,.04); border: 1px dashed rgba(224,184,74,.35);
    }
    .file-row i { color: var(--accent-bright); font-size: 15px; }
    .file-row .file-info { flex: 1; min-width: 0; }
    .file-row .file-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-row .file-size { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .file-row .file-clear {

  const PROMO_PARAM = (() => {
    try {
      const raw = (new URLSearchParams(window.location.search).get('promo') || '').toUpperCase().trim();
      return /^PROMO-[A-Z0-9]{6}$/.test(raw) ? raw : null;
    } catch (e) { return null; }
  })();

  // ── Utilitaires promo (portés de ma-promo.html) ──
  function genPromoCode() {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans I,O,0,1 : lisible en groupe WhatsApp
    let s = '';
    for (let i = 0; i < 6; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
    return 'PROMO-' + s;
  }
  function fmtWhen(ts) {
    try {
      const d = ts?.toDate?.() || null;
      if (!d) return '';
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) +
        ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' Ko';
    return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
  }
  function initials(name) {
    return String(name || 'É').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase() || 'É';
  }
  function toast(message, type = 'info') {
    if (typeof window.arvexaShowToast === 'function') { window.arvexaShowToast(message, type); return; }
    const t = document.createElement('div');
    t.textContent = message;
    t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;' +
      'background:rgba(20,20,20,.95);border:1px solid rgba(224,184,74,.4);color:#F5F0E8;' +
      'padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;max-width:86vw;text-align:center;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  // ⚡ CAPTURE ?ref=CODE — attribution parrainage (30 jours)
  // ══════════════════════════════════════════════════════════════════
  async function captureRef() {
    let code = null;
    try {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get('ref') || '').toUpperCase().trim();
      if (/^[A-Z0-9][A-Z0-9_-]{2,23}$/.test(raw)) {
        code = raw;
        localStorage.setItem('arvexaRef', JSON.stringify({ code, ts: Date.now() }));
        history.replaceState(null, '', window.location.pathname);
        // Traçage du clic (document anonyme, données minimales)
        try {
          await addDoc(collection(db, 'refClicks'), { code, ts: Date.now() });
        } catch (e) { /* règle refusée hors-ligne — non bloquant */ }
      }
    } catch (e) { /* no-op */ }
    if (!code) {
      try {
        const saved = JSON.parse(localStorage.getItem('arvexaRef') || 'null');
        if (saved && saved.code && (Date.now() - (saved.ts || 0)) < 30 * 24 * 60 * 60 * 1000) {
          code = saved.code;
        } else {
          localStorage.removeItem('arvexaRef');
        }
      } catch (e) { /* no-op */ }
    }
    return code;
  }

  const REF_CODE = await captureRef();

  function paintCountry() {
    const flag = $('appCountryFlag'), name = $('appCountryName'),
          dial = $('appCountryDial'), chip = $('appDialChip');
    if (!flag) return;

  // Indicatif intelligent : retrouve le pays depuis un préfixe international
  // (préfixe le PLUS LONG d'abord — les indicatifs uniques gagnent).
  function countryByDial(dial) {
    let best = null;
    for (const c of AFRIQUE) {
      if (dial.startsWith(c.dial) && (!best || c.dial.length > best.dial.length)) best = c;
    }
    return best;
  }

  function initCountryPicker(preDial, preNational) {
    const btn = $('appCountryBtn');
    if (!btn) return;
    if (preDial) {
      const found = countryByDial(preDial);
      if (found) COUNTRY = found;
      if (preNational) $('appPhone').value = preNational.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
    } else {
      try {
        const saved = JSON.parse(localStorage.getItem('arvexa-dial') || 'null');
        if (saved && saved.iso) {
          const found = AFRIQUE.find((c) => c.iso === saved.iso);
          if (found) COUNTRY = found;
        }
      } catch (e) {}
    }
    paintCountry();

    // Feuille de modale (créée une seule fois, réutilisée)

      overlay = document.createElement('div');

      $('arvPickerSearch').addEventListener('input', () => renderPickerList($('arvPickerSearch').value));
    }
    const list = $('arvPickerList');

    function renderPickerList(filter = '') {
      const f = String(filter || '').toLowerCase().trim();
      list.replaceChildren();
      const rows = AFRIQUE.filter((c) => !f || c.fr.toLowerCase().includes(f) || c.dial.includes(f));
      if (!rows.length) {
        const li = document.createElement('li');
        li.textContent = 'Aucun pays trouvé';
        li.style.color = 'var(--text-dim)';
        list.appendChild(li);
        return;
      }
      rows.forEach((c) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');

        li.innerHTML = `<span class="flag">${c.flag}</span><span class="nm">${c.fr}</span><span class="dl">${c.dial}</span>`;

  async function submitApplication() {
    const user = auth.currentUser;
    const msg = $('formMsg');
    const btn = $('submitBtn');
    if (!user) {
      try { sessionStorage.setItem('redirectAfterLogin', 'ambassadeur.html'); } catch (e) {}
      window.location.href = 'login.html';
      return;
    }
    const national = $('appPhone').value.trim().replace(/\s/g, '');
    const digits = national.replace(/\D/g, '');
    const establishment = $('appSchool').value.trim();
    const promoName = $('appPromoName').value.trim();
    const promoSize = parseInt($('appPromoSize').value, 10);
    const inviteCount = parseInt($('appInviteCount').value, 10);
    const motivation = $('appMotivation').value.trim();
    if (digits.length < 8) {
      msg.className = 'form-msg error';
      msg.textContent = 'Entre un numéro de téléphone valide (au moins 8 chiffres).';
      return;
    }
    if (!establishment) {
      msg.className = 'form-msg error';
      msg.textContent = 'Indique ton établissement.';
      return;
    }
    if (promoName.length < 2) {
      msg.className = 'form-msg error';
      msg.textContent = 'Indique ta promo (ex. : Terminale D — Lycée Sahel).';
      return;
    }
    if (!promoSize || promoSize < 1 || promoSize > 2000) {
      msg.className = 'form-msg error';
      msg.textContent = 'Combien d’élèves compte ta promo ? (entre 1 et 2000).';
      return;
    }
    if (!inviteCount || inviteCount < 1 || inviteCount > 2000) {
      msg.className = 'form-msg error';
      msg.textContent = 'Combien d’élèves peux-tu inviter ? (entre 1 et 2000).';
      return;
    }
    if (motivation.length < 15) {
      msg.className = 'form-msg error';
      msg.textContent = 'Dis-nous en quelques mots de plus (15 caractères minimum).';
      return;
    }
    const e164 = (COUNTRY.dial + digits).substring(0, 16);
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi…';
    try {
      await setDoc(doc(db, 'ambassadorApplications', user.uid), {
        uid: user.uid,
        phone: e164,
        phoneNational: digits.substring(0, 15),
        countryIso: COUNTRY.iso,
        countryDial: COUNTRY.dial,
        countryFr: COUNTRY.fr,
        establishment: establishment.substring(0, 80),
        promoName: promoName.substring(0, 80),
        promoSize,
        inviteCount,
        motivation: motivation.substring(0, 500),
        status: 'pending',
        submittedAt: serverTimestamp()
      }, { merge: true });
      // ⚡ v8.60a — dépôt de candidature → notification Telegram au
      // propriétaire. Strictement non bloquant : la candidature est déjà
      // enregistrée dans Firestore, l'élève voit son écran de confirmation
      // même si la notification échoue.
      try {
        let nom = 'Élève ARVEXA';
        try {
          const uSnap = await getDoc(doc(db, 'users', user.uid));
          if (uSnap.exists()) {
            const u = uSnap.data() || {};
            nom = u.fullName || [u.firstName, u.lastName].filter(Boolean).join(' ') || nom;
          }
        } catch (e) { /* nom par défaut */ }
        fetch('/api/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            kind: 'ambassadeur',
            userName: nom,
            userEmail: user.email || '',
            phone: e164,
            country: COUNTRY.fr || COUNTRY.iso || '',
            establishment,
            promoName,
            promoSize,
            inviteCount,
            motivation
          })
        }).catch(() => {});
      } catch (e) { /* notification jamais bloquante */ }
      renderPending();
    } catch (e) {
      console.error(e);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer ma candidature';
      msg.className = 'form-msg error';
      msg.textContent = 'Envoi impossible — vérifie ta connexion puis réessaie.';
    }
  }

  // ─── Création de promo ───
  async function createPromo(user, userName) {
    const msg = $('createMsg'), btn = $('createPromoBtn');
    const name = $('newPromoName').value.trim();
    const school = $('newPromoSchool').value.trim();
    if (name.length < 2) {
      msg.className = 'form-msg error';
      msg.textContent = 'Donne un nom à ta promo (au moins 2 caractères).';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création…';
    try {
      // Le code ambassadeur du créateur voyage avec la promo : chaque membre
      // qui la rejoint est rattaché à son parrainage → 10 % sur les
      // abonnements de sa promo.
      let ownerCode = null;
      try {
        const ambSnap = await getDoc(doc(db, 'ambassadors', user.uid));
        if (ambSnap.exists() && ambSnap.data().status === 'active') ownerCode = ambSnap.data().code || null;
      } catch (e) { /* pas ambassadeur : non bloquant */ }

      // Code unique : 3 essais (probabilité de collision ~0)
      let code = genPromoCode();
      for (let i = 0; i < 3; i++) {
        const clash = await getDocs(query(collection(db, 'promos'), where('code', '==', code), limit(1)));
        if (clash.empty) break;
        code = genPromoCode();
      }

      const promoRef = doc(collection(db, 'promos'));
      const batch = writeBatch(db);
      batch.set(promoRef, {
        ownerUid: user.uid,
        ownerName: String(userName || 'Responsable').substring(0, 80),
        ownerCode,
        code,
        name: name.substring(0, 80),
        school: school.substring(0, 120),
        memberCount: 1,
        status: 'active',
        createdAt: serverTimestamp()
      });
      batch.set(doc(promoRef, 'members', user.uid), {
        uid: user.uid,
        name: String(userName || 'Responsable').substring(0, 80),
        role: 'owner',
        joinedAt: serverTimestamp()
      });
      batch.update(doc(db, 'users', user.uid), {
        promoId: promoRef.id,
        promoRole: 'owner',
        promoJoinedAt: serverTimestamp()
      });
      await batch.commit();
      toast('Ton espace promo est créé ! 🎉', 'success');
      loadPromoSection(user);
    } catch (e) {
      console.error('Création promo :', e);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-flag"></i> Créer l\'espace';
      msg.className = 'form-msg error';
      msg.textContent = 'Création impossible — vérifie ta connexion puis réessaie. (' + (e.code || e.message || 'erreur') + ')';
    }
  }

  async function joinPromoByCode(user, userName) {
    const msg = $('joinMsg'), btn = $('joinBtn');

    if (!/^PROMO-[A-Z0-9]{6}$/.test(code)) {
      msg.className = 'form-msg error';
      msg.textContent = 'Le code ressemble à PROMO-XXXXXX (6 caractères après le tiret).';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recherche…';
    try {
      const snap = await getDocs(query(collection(db, 'promos'), where('code', '==', code), limit(1)));
      if (snap.empty) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-ticket"></i> Rejoindre';
        msg.className = 'form-msg error';
        msg.textContent = 'Aucune promo avec ce code — vérifie auprès du responsable.';
        return;
      }
      const promo = snap.docs[0];
      const pData = promo.data();

      // Rattachement parrainage : si le membre n'a pas encore de parrain,
      // le code ambassadeur du responsable devient son parrain (le
      // responsable gagne 10 % sur les futurs abonnements du membre).
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);
      const uData = userSnap.exists() ? userSnap.data() : {};
      const batch = writeBatch(db);
      batch.set(doc(promo.ref, 'members', user.uid), {
        uid: user.uid,
        name: String(userName || 'Élève').substring(0, 80),
        role: 'member',
        joinedAt: serverTimestamp()
      });
      batch.update(promo.ref, { memberCount: increment(1) });
      const userPatch = {
        promoId: promo.id,
        promoRole: 'member',
        promoJoinedAt: serverTimestamp()
      };
      if (!uData.referredBy && pData.ownerCode) userPatch.referredBy = pData.ownerCode;
      batch.update(userRef, userPatch);
      await batch.commit();
      toast('Bienvenue dans « ' + (pData.name || 'la promo') + ' » !', 'success');
      loadPromoSection(user);
    } catch (e) {
      console.error('Rejoindre promo :', e);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-ticket"></i> Rejoindre';
      msg.className = 'form-msg error';
      msg.textContent = 'Impossible de rejoindre — vérifie ta connexion puis réessaie. (' + (e.code || e.message || 'erreur') + ')';
    }
  }

  // ─── Publication (message, fichier uploadé ou lien) ───
  async function publishPost(user, promoId) {
    const msg = $('publishMsg'), btn = $('publishBtn');
    const title = $('postTitle').value.trim();
    const text = $('postText').value.trim();
    const linkUrl = String($('postFileUrl')?.value || '').trim();
    if (title.length < 1) {
      msg.className = 'form-msg error';
      msg.textContent = 'Donne un titre à ta publication.';
      return;
    }
    if (promoMode === 'message' && text.length < 1) {
      msg.className = 'form-msg error';
      msg.textContent = 'Écris ton message (ou bascule sur « PDF / Exercice » pour envoyer un fichier).';
      return;
    }
    const hasLink = /^https:\/\/\S{4,2000}$/.test(linkUrl);
    if (promoMode === 'file' && !pickedFile && !hasLink) {
      msg.className = 'form-msg error';
      msg.textContent = 'Choisis un fichier (PDF ou photo), colle un lien https, ou repasse en mode Message.';
      return;
    }
    if (pickedFile && pickedFile.size > MAX_FILE_MB * 1024 * 1024) {
      msg.className = 'form-msg error';
      msg.textContent = `Fichier trop lourd (${fmtSize(pickedFile.size)}) — maximum ${MAX_FILE_MB} Mo.`;
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (pickedFile ? 'Envoi du fichier…' : 'Publication…');
    try {
      let fileUrl = null, fileName = null, fileSize = null;
      if (pickedFile) {
        try {
          const safeName = pickedFile.name.replace(/[^\w.\-() ]+/g, '_').substring(0, 120);
          const path = `promo-files/${promoId}/${Date.now()}-${safeName}`;
          const storageRef = sRef(storage, path);
          await uploadBytes(storageRef, pickedFile, { contentType: pickedFile.type || 'application/octet-stream' });
          fileUrl = await getDownloadURL(storageRef);
          fileName = safeName;
          fileSize = pickedFile.size;
        } catch (upErr) {
          // ✅ repli intelligent : si l'envoi Storage est refusé (règles à
          // déployer / réseau), la publication part avec le LIEN collé —
          // la promo n'attend jamais. Sinon message clair.
          console.error('Upload Storage :', upErr);
          if (hasLink) {
            toast('Envoi direct indisponible — publication avec ton lien à la place.', 'info');
          } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publier';
            msg.className = 'form-msg error';
            msg.textContent = 'Envoi du fichier impossible pour l\'instant. Colle un lien (Drive/WhatsApp) dans le champ « ou colle un lien » puis republie — ou réessaie plus tard.';
            return;
          }
        }
      }
      const finalUrl = fileUrl || (hasLink ? linkUrl : '');
      const finalName = fileName || (hasLink ? 'Fichier partagé (lien)' : '');
      await addDoc(collection(db, 'promos', promoId, 'posts'), {
        type: (fileUrl || hasLink) ? 'fichier' : 'message',
        title: title.substring(0, 120),
        text: text.substring(0, 4000),
        fileUrl: finalUrl || '',
        fileName: finalName || '',
        fileSize: fileSize || 0,
        authorUid: user.uid,
        createdAt: serverTimestamp()
      });
      // Reset du formulaire
      $('postTitle').value = '';
      $('postText').value = '';
      pickedFile = null;
      $('fileInput').value = '';
      $('fileRow').style.display = 'none';
      if ($('postFileUrl')) $('postFileUrl').value = '';
      msg.className = 'form-msg info';
      msg.textContent = 'Publié ! Ta promo le voit dans son fil. ✅';
      setTimeout(() => { msg.className = 'form-msg'; }, 2600);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publier';
      loadFeed(user, promoId, true);
    } catch (e) {
      console.error('Publication :', e);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publier';
      msg.className = 'form-msg error';
      msg.textContent = 'Publication impossible — vérifie ta connexion puis réessaie. (' + (e.code || e.message || 'erreur') + ')';
    }
  }

  // ─── Fil ───
  async function loadFeed(user, promoId, isOwner) {
    const area = $('feedArea');
    if (!area) return;
    try {
      const snap = await getDocs(query(collection(db, 'promos', promoId, 'posts'), orderBy('createdAt', 'desc'), limit(50)));
      area.replaceChildren();
      if (snap.empty) {
        const empty = document.createElement('div');
        empty.className = 'empty-block';
        empty.innerHTML = '<i class="fas fa-inbox"></i><h4>Rien pour le moment</h4><p>' +
          (isOwner ? 'Publie ton premier message ou ton premier exercice — ta promo le recevra ici.' : 'Le responsable n\'a encore rien publié.') + '</p>';
        area.appendChild(empty);
        return;
      }
      snap.forEach((d) => {
        const p = d.data();
        const card = document.createElement('div');
        card.className = 'post-card';
        const when = fmtWhen(p.createdAt);
        const isFile = p.type === 'fichier' && p.fileUrl;
        card.innerHTML = `
          <div class="post-head">
            <div class="post-ico"><i class="fas ${isFile ? 'fa-file-pdf' : 'fa-comment'}"></i></div>
            <h4>${esc(p.title || 'Publication')}</h4>
            <span class="when">${esc(when)}</span>
            ${isOwner ? '<button class="post-del" data-post="' + esc(d.id) + '" aria-label="Supprimer"><i class="fas fa-trash"></i></button>' : ''}
          </div>
          ${p.text ? '<div class="post-text">' + esc(p.text) + '</div>' : ''}
          ${isFile ? `
            <a class="post-file" href="${esc(p.fileUrl)}" target="_blank" rel="noopener">
              <i class="fas fa-download"></i>
              <div class="pf-body">
                <div class="pf-name">${esc(p.fileName || 'Fichier')}</div>
                <div class="pf-hint">${p.fileSize ? fmtSize(p.fileSize) + ' · ' : ''}Ouvrir / télécharger</div>
              </div>
              <i class="fas fa-chevron-right" style="color:var(--text-dim);font-size:12px"></i>
            </a>` : ''}`;
        if (isOwner) {
          card.querySelector('.post-del')?.addEventListener('click', async () => {
            try {
              await deleteDoc(doc(db, 'promos', promoId, 'posts', d.id));
              card.remove();
              toast('Publication supprimée.', 'info');
            } catch (e) { toast('Suppression impossible : ' + (e.code || e.message), 'error'); }
          });
        }
        area.appendChild(card);
      });
    } catch (e) {
      console.error('Fil promo :', e);
      area.replaceChildren();
      const err = document.createElement('div');
      err.className = 'empty-block';
      err.innerHTML = '<i class="fas fa-wifi"></i><h4>Fil indisponible</h4><p>' + esc(e.code || e.message || 'Erreur réseau') + '</p>';
      area.appendChild(err);
    }
  }

  // ─── Membres ───
  async function loadMembers(user, promoId, isOwner) {
    const area = $('memberArea');
    if (!area) return;
    try {
      const snap = await getDocs(query(collection(db, 'promos', promoId, 'members'), limit(300)));
      area.replaceChildren();
      let count = 0;
      snap.forEach((d) => {
        const m = d.data();
        count++;
        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `
          <div class="member-avatar">${esc(initials(m.name))}</div>
          <div class="member-body">
            <b>${esc(m.name || 'Membre')}</b>
            <span>${m.role === 'owner' ? '👑 Responsable' : esc(fmtWhen(m.joinedAt) || 'membre')}</span>
          </div>
          ${isOwner && m.role !== 'owner' ? '<button class="member-del" data-uid="' + esc(m.uid) + '" aria-label="Retirer"><i class="fas fa-user-minus"></i></button>' : ''}`;
        if (isOwner && m.role !== 'owner') {
          row.querySelector('.member-del')?.addEventListener('click', () => removeMember(user, promoId, m.uid, m.name, row));
        }
        area.appendChild(row);
      });
      const lbl = $('memberCountLbl');
      if (lbl) lbl.textContent = String(count);
      const pc = $('postsCount');
      if (pc && pc.querySelector('b').textContent === '…') {
        try {
          const ps = await getDocs(query(collection(db, 'promos', promoId, 'posts'), limit(200)));
          pc.querySelector('b').textContent = String(ps.size);
        } catch (e) { pc.querySelector('b').textContent = '—'; }
      }
    } catch (e) {
      console.error('Membres :', e);
      area.replaceChildren();
      const err = document.createElement('div');
      err.className = 'empty-block';
      err.innerHTML = '<i class="fas fa-wifi"></i><h4>Liste indisponible</h4><p>' + esc(e.code || e.message || 'Erreur réseau') + '</p>';
      area.appendChild(err);
    }
  }

  async function removeMember(user, promoId, uid, name, row) {
    try {
      // ⚠️ on ne peut PAS écrire dans users/{uid} d'un autre compte (règles
      // Firestore). On retire le membre de la promo ; son propre doc se
      // détache tout seul à sa prochaine visite (vérification d'appartenance).
      await deleteDoc(doc(db, 'promos', promoId, 'members', uid));
      await updateDoc(doc(db, 'promos', promoId), { memberCount: increment(-1) });
      row.remove();
      toast(name ? (name + ' retiré de la promo.') : 'Membre retiré.', 'info');
    } catch (e) {
      console.error('Retrait membre :', e);
      toast('Retrait impossible : ' + (e.code || e.message), 'error');
    }
  }

  function confirmDanger(title, message, confirmText, onConfirm) {
    if (typeof window.arvexaConfirm === 'function') {
      window.arvexaConfirm({
        title,
        message,
        icon: '⚠️',
        confirmText,
        cancelText: 'Annuler',
        variant: 'danger',
        onConfirm
      });
      return;
    }
    // Repli minimal si le module de confirmation n'est pas chargé
    if (window.confirm(title + ' ' + message.replace(/<[^>]+>/g, ''))) onConfirm();
  }

  async function dissolvePromo(user, promoId, name) {
    const doDissolve = async () => {
      try {
        // Les documents de la promo elle-même sont retirés ; les
        // sous-collections (posts/membres) restent en archive côté serveur —
        // elles ne sont plus accessibles (le document parent n'existe plus).
        await deleteDoc(doc(db, 'promos', promoId));
        await setDoc(doc(db, 'users', user.uid), { promoId: '', promoRole: '' }, { merge: true });
        toast('Promo dissoute.', 'info');
        loadPromoSection(user);
      } catch (e) {
        console.error('Dissolution :', e);
        toast('Impossible de dissoudre : ' + (e.code || e.message), 'error');
      }
    };
    confirmDanger(
      'Dissoudre la promo ?',
      '« <strong>' + esc(name || 'Ma promo') + '</strong> » sera fermée : le fil disparaît pour tous les membres. Cette action est définitive.',
      'Dissoudre',
      doDissolve
    );
  }

  // ─── Vue membre INLINE (ambassadeur membre d'une autre promo) ───

      </div>
      <div class="promo-feed">
        <div class="promo-sec-h"><i class="fas fa-stream"></i> Fil de la promo</div>
        <div id="feedArea"><div class="loading-block"><i class="fas fa-circle-notch"></i><br>Chargement…</div></div>

        <p class="sub">${promo?.code ? 'Partage le code <b>' + esc(promo.code) + '</b> ou le lien direct — plus la promo est active, plus ton responsable gagne.' : 'Partage ARVEXA autour de toi.'}</p>
        <button class="ghost-btn" id="memberShare"><i class="fab fa-whatsapp"></i> Partager l'espace sur WhatsApp</button>

    const link = code ? `${window.location.origin}/ambassadeur.html?promo=${code}` : window.location.origin;
    const waText = encodeURIComponent(`📘 Rejoins l'espace de notre promo sur ARVEXA : messages, exercices et PDF partagés.\n${code ? 'Code : ' + code + '\n' : ''}${link}`);
    $('memberShare').addEventListener('click', () => window.open(`https://wa.me/?text=${waText}`, '_blank', 'noopener'));

  // ══════════════════════════════════════════════════════════════════
  // ✅ v8.58a — LIEN MEMBRE ?promo=CODE (l'ambassadeur partage son espace)
  // Page complète : rejoindre par code / fil en lecture seule.
  // ══════════════════════════════════════════════════════════════════

  function renderPromoLanding() {
    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="hero">
        <div class="hero-crown"><i class="fas fa-people-group"></i></div>
        <h2>Espace de promo</h2>
        <p class="lead">Rejoins l'espace de ta classe : messages, PDF et exercices partagés par ton responsable —
        et ARVEXA pour réviser ensemble.</p>
      </div>
      <div class="form-card">
        <h3>Rejoindre avec le code</h3>
        <p class="sub">Connecte-toi pour rejoindre l'espace de ta promo et lire son fil.</p>
        <button class="submit-btn" id="goLogin"><i class="fas fa-right-to-bracket"></i> Se connecter / Créer un compte</button>
      </div>`;
    mainArea.appendChild(wrap);
    $('goLogin').addEventListener('click', () => {
      try { sessionStorage.setItem('redirectAfterLogin', 'ambassadeur.html?promo=' + PROMO_PARAM); } catch (e) {}
      window.location.href = 'login.html';
    });
  }

  async function renderPromoParamFlow(user, code) {
    let snap;
    try {
      snap = await getDocs(query(collection(db, 'promos'), where('code', '==', code), limit(1)));
    } catch (e) {
      renderPromoLanding();
      return;
    }
    if (snap.empty) {
      mainArea.replaceChildren();
      const err = document.createElement('div');
      err.className = 'empty-block';
      err.style.marginTop = '20px';
      err.innerHTML = '<i class="fas fa-ticket"></i><h4>Espace introuvable</h4><p>Aucune promo avec le code <b>' + esc(code) + '</b> — vérifie le lien auprès du responsable.</p>';
      mainArea.appendChild(err);
      return;
    }
    const promoDoc = snap.docs[0];
    const promoId = promoDoc.id;
    const promoData = promoDoc.data();

    const uSnap = await getDoc(doc(db, 'users', user.uid));
    const uData = uSnap.exists() ? uSnap.data() : {};
    const userName = uData.firstName || uData.fullName || 'Élève';

    // Déjà membre (ou responsable) → fil complet en page
    if (String(uData.promoId || '') === promoId) {
      renderPromoMemberPage(user, promoId, promoData, userName, uData.promoRole === 'owner');
      return;
    }
    // Pas encore membre → carte « rejoindre »
    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="hero">
        <div class="hero-crown"><i class="fas fa-people-group"></i></div>
        <h2>${esc(promoData.name || 'Espace de promo')}</h2>
        <p class="lead">${esc(promoData.school || promoData.ownerName || '')} t'invite dans l'espace de ta classe :
        messages, PDF et exercices partagés — rejoins avec le code <b style="color:var(--accent-bright)">${esc(code)}</b>.</p>
      </div>
      <div class="form-card">
        <h3>Rejoindre l'espace</h3>
        <p class="sub">En rejoignant, tu recevras toutes les publications de ta promo directement ici.</p>
        <button class="submit-btn" id="joinParamBtn"><i class="fas fa-ticket"></i> Rejoindre avec le code ${esc(code)}</button>
        <div class="form-msg" id="joinParamMsg"></div>
      </div>`;
    mainArea.appendChild(wrap);
    $('joinParamBtn').addEventListener('click', async () => {
      const btn = $('joinParamBtn'), msg = $('joinParamMsg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adhésion…';
      try {
        const batch = writeBatch(db);
        batch.set(doc(db, 'promos', promoId, 'members', user.uid), {
          uid: user.uid,
          name: String(userName).substring(0, 80),
          role: 'member',
          joinedAt: serverTimestamp()
        });
        batch.update(doc(db, 'promos', promoId), { memberCount: increment(1) });
        const userPatch = { promoId, promoRole: 'member', promoJoinedAt: serverTimestamp() };
        if (!uData.referredBy && promoData.ownerCode) userPatch.referredBy = promoData.ownerCode;
        batch.update(doc(db, 'users', user.uid), userPatch);
        await batch.commit();
        toast('Bienvenue dans « ' + (promoData.name || 'la promo') + ' » !', 'success');
        try { history.replaceState(null, '', '/ambassadeur.html'); } catch (e) {}
        renderPromoMemberPage(user, promoId, promoData, userName, false);
      } catch (e) {
        console.error('Adhésion param :', e);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-ticket"></i> Rejoindre avec le code ' + esc(code);
        msg.className = 'form-msg error';
        msg.textContent = 'Impossible de rejoindre — vérifie ta connexion puis réessaie. (' + (e.code || e.message || 'erreur') + ')';
      }
    });
  }

  async function renderPromoMemberPage(user, promoId, promoData, userName, isOwner) {
    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="promo-hero">
        <div class="kicker">${isOwner ? 'Espace responsable' : 'Espace de ta promo'}</div>
        <h2>${esc(promoData?.name || 'Ma promo')}</h2>
        <p>${esc(promoData?.school || '')}${promoData?.school ? ' · ' : ''}${isOwner
          ? 'Tu publies, ta promo reçoit.'
          : 'Responsable : ' + esc(promoData?.ownerName || '—')}${promoData?.code ? ' · code ' + esc(promoData.code) : ''}</p>

      <div class="promo-feed">
        <div class="promo-sec-h"><i class="fas fa-stream"></i> Fil de la promo</div>

      <div class="card">
        <h3>Invite tes camarades</h3>

        <button class="ghost-btn" id="memberShare"><i class="fab fa-whatsapp"></i> Partager l'espace sur WhatsApp</button>
      </div>
      ${isOwner ? '' : '<button class="ghost-btn danger" id="leavePromo" style="margin-top:14px"><i class="fas fa-door-open"></i> Quitter cette promo</button>'}`;
    mainArea.appendChild(wrap);
    const code = promoData?.code || '';
    const link = code ? `${window.location.origin}/ambassadeur.html?promo=${code}` : window.location.origin;
    const waText = encodeURIComponent(`📘 Rejoins l'espace de notre promo sur ARVEXA : messages, exercices et PDF partagés.\n${code ? 'Code : ' + code + '\n' : ''}${link}`);
    $('memberShare').addEventListener('click', () => window.open(`https://wa.me/?text=${waText}`, '_blank', 'noopener'));
    loadFeed(user, promoId, isOwner);
    const leave = $('leavePromo');
    if (leave) {
      leave.addEventListener('click', async () => {
        try {
          const batch = writeBatch(db);
          batch.delete(doc(db, 'promos', promoId, 'members', user.uid));
          batch.update(doc(db, 'promos', promoId), { memberCount: increment(-1) });
          batch.update(doc(db, 'users', user.uid), { promoId: '', promoRole: '' });
          await batch.commit();
          toast('Tu as quitté la promo.', 'info');
          window.location.href = 'ambassadeur.html';
        } catch (e) {
          console.error('Quitter :', e);
          toast('Impossible de quitter : ' + (e.code || e.message), 'error');
        }
      });
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // ROUTAGE PRINCIPAL
  // ══════════════════════════════════════════════════════════════════
  async function loadPublicForUser() {
    const user = auth.currentUser;
    if (!user) { renderPublic(); return; }
    let prefill = {};
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        const u = snap.data();
        prefill = {
          establishment: u.establishment || '',
          // ✅ v8.57a — le numéro donné à l'inscription préremplit le champ
          // (pays + indicatif sélectionnés automatiquement).
          whatsapp: u.whatsapp || u.phone || '',
          promoName: u.customClass || u.classLabel || ''
        };
      }
    } catch (e) { /* no-op */ }
    renderPublic(prefill);
  }

  onAuthStateChanged(auth, async (user) => {
    // ✅ v8.58a — lien membre ?promo=CODE : l'expérience « espace de promo »
    // prend la main (rejoindre / fil en lecture), l'ambassadeur gardant ses
    // propres vues ailleurs (dashboard → section Gérer ma promo).
    if (PROMO_PARAM) {
      if (!user) { renderPromoLanding(); return; }
      try {
        if (REF_CODE) await attributeReferral(user, REF_CODE);
        await renderPromoParamFlow(user, PROMO_PARAM);
      } catch (e) {
        console.error('Flux promo :', e);
        renderPromoLanding();
      }
      return;
    }
    if (!user) { renderPublic(); return; }
    try {
      // 1. Ambassadeur validé → dashboard
      const ambSnap = await getDoc(doc(db, 'ambassadors', user.uid));
      if (ambSnap.exists() && ambSnap.data().status === 'active') {
        // 2. Attribution parrainage si visiteur invité (nouveau compte seulement)
        if (REF_CODE) await attributeReferral(user, REF_CODE);
        await renderDashboard(ambSnap.data(), user.uid);
        return;
      }
      // 2. Attribution parrainage si visiteur invité
      if (REF_CODE) await attributeReferral(user, REF_CODE);
      // 3. Candidature existante ?
      const appSnap = await getDoc(doc(db, 'ambassadorApplications', user.uid));
      if (appSnap.exists()) {
        const st = String(appSnap.data().status || 'pending');
        renderPending(st);
        return;
      }
      // 4. Vue publique avec formulaire
      loadPublicForUser();
    } catch (e) {
      console.error('Ambassadeur :', e);
      loadPublicForUser();
    }
  });

  // ══════════════════════════════════════════════════════════════════
  // ATTRIBUTION PARRAINAGE (client, nouveaux comptes seulement)
  // ══════════════════════════════════════════════════════════════════
  async function attributeReferral(user, code) {
    try {
      // Garde : compte récent (< 14 jours) sans referredBy déjà posé
      const creationMs = user.metadata?.creationTime ? new Date(user.metadata.creationTime).getTime() : 0;
      if (creationMs && (Date.now() - creationMs) > 14 * 24 * 60 * 60 * 1000) return;
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (snap.exists() && snap.data().referredBy) return;
      await setDoc(userRef, { referredBy: code }, { merge: true });
      await addDoc(collection(db, 'referrals'), {
        newUid: user.uid,
        code,
        status: 'registered',
        createdAt: serverTimestamp()
      });
      localStorage.removeItem('arvexaRef');
    } catch (e) {
      console.warn('Attribution parrainage :', e.message);
    }
  }
</script>
