  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="arvexa-ui.css">
  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --bg-dark: #0A0A0A;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --border: rgba(184, 134, 11, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top, #101010 0%, var(--bg-dark) 60%);
      color: var(--text-light);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .page-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 14px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05); color: var(--text-light);
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none; font-size: 16px; flex-shrink: 0;
    }
    .page-title h1 { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; }
    .page-title p { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 0; }

    .loading-block { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
    .loading-block i { font-size: 20px; color: var(--accent-bright); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

    /* ===== HERO ===== */
    .hero {
      position: relative; overflow: hidden;
      text-align: center;
      background: linear-gradient(160deg, rgba(184,134,11,.18), rgba(26,58,42,.4) 50%, rgba(10,10,10,.65));
      border: 1px solid rgba(224,184,74,.3);
      border-radius: 24px; padding: 30px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .hero::before {
      content: '👑';
      position: absolute; top: -18px; right: -10px; font-size: 90px; opacity: .08;
      transform: rotate(12deg); pointer-events: none;
    }
    .hero-crown {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--bg-dark);
      box-shadow: 0 10px 30px rgba(184,134,11,.35);
    }
    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 800; letter-spacing: .4px;
    }
    .hero p.lead { font-size: 14px; color: var(--text-dim); margin: 10px auto 0; max-width: 420px; line-height: 1.6; }

    .perks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 22px; }
    .perk {
      padding: 13px 8px; border-radius: 15px;
      background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
      text-align: center;
    }
    .perk i { color: var(--accent-bright); font-size: 17px; }
    .perk b { display: block; font-size: 15px; margin-top: 6px; }
    .perk span { font-size: 10.5px; color: var(--text-dim); }

    /* ===== CRITÈRES ===== */
    .criteria { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: rgba(255,255,255,.02); border: 1px dashed rgba(184,134,11,.3); }
    .criteria h3 { font-size: 13.5px; font-weight: 800; color: var(--accent-bright); margin-bottom: 10px; }
    .criteria ul { list-style: none; }
    .criteria li { font-size: 12.5px; color: var(--text-dim); padding: 5px 0 5px 22px; position: relative; line-height: 1.5; }
    .criteria li::before { content: '✦'; position: absolute; left: 2px; color: var(--accent-bright); }

    /* ===== FORMULAIRE ===== */
    .form-card {
      margin-top: 22px; padding: 20px 18px; border-radius: 20px;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .form-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .form-card .sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; padding: 13px 14px; border-radius: 13px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent-bright); }
    .field textarea { resize: vertical; min-height: 84px; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 800; color: var(--bg-dark);
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      transition: transform .1s, filter .2s;
    }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn[disabled] { filter: grayscale(.6); opacity: .6; cursor: wait; }
    .form-msg { font-size: 12.5px; margin-top: 10px; display: none; padding: 10px 13px; border-radius: 11px; }
    .form-msg.error { display: block; background: rgba(192,57,43,.12); color: #EF9A9A; border: 1px solid rgba(192,57,43,.3); }
    .form-msg.info { display: block; background: rgba(46,125,50,.1); color: #A5D6A7; border: 1px solid rgba(46,125,50,.3); }

    /* ===== VUES STATUT ===== */
    .status-card {
      margin-top: 22px; padding: 26px 22px; border-radius: 20px; text-align: center;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .status-card i.big { font-size: 30px; color: var(--accent-bright); margin-bottom: 12px; display: block; }
    .status-card h3 { font-size: 17px; font-weight: 800; }
    .status-card p { font-size: 13px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }

    /* ===== DASHBOARD ===== */
    .dash-hero {
      position: relative; overflow: hidden;
      background: linear-gradient(150deg, rgba(184,134,11,.2), rgba(26,58,42,.4) 55%, rgba(10,10,10,.65));
      border: 1px solid rgba(224,184,74,.32);
      border-radius: 22px; padding: 22px 20px;
    }
    .dash-hero .rank { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent-bright); }
    .dash-hero h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; margin-top: 5px; }
    .dash-hero p { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

    .code-box {
      margin-top: 16px; padding: 14px 16px; border-radius: 15px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(224,184,74,.35);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .code-box .code { font-size: 19px; font-weight: 900; letter-spacing: 2px; color: var(--accent-bright); font-family: 'Playfair Display', serif; }
    .code-box .link-mini {
      font-size: 11px; color: var(--text-dim); margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
      display: block;
    }
    .share-row { display: flex; gap: 9px; margin-top: 12px; }
    .share-btn {
      flex: 1; padding: 12px; border-radius: 13px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .1s;
    }
    .share-btn:active { transform: scale(.97); }
    .share-btn.wa { background: #1FA855; color: #fff; }
    .share-btn.copy { background: rgba(255,255,255,.07); color: var(--text-light); border: 1px solid rgba(255,255,255,.12); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 22px; }
    .stat-card {
      padding: 15px 14px; border-radius: 16px;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,.07);
    }
    .stat-card i { color: var(--accent-bright); font-size: 14px; }
    .stat-card b { display: block; font-size: 24px; font-weight: 800; margin-top: 6px; font-family: 'Playfair Display', serif; }
    .stat-card span { font-size: 11px; color: var(--text-dim); }
    .stat-card.earnings { grid-column: 1 / -1; border-color: rgba(224,184,74,.4); background: linear-gradient(150deg, rgba(184,134,11,.14), rgba(20,20,20,.8)); }

    .mission-card { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: rgba(255,255,255,.02); border: 1px dashed rgba(184,134,11,.3); }
    .mission-card h3 { font-size: 13.5px; font-weight: 800; color: var(--accent-bright); margin-bottom: 10px; }
    .mission-card ul { list-style: none; }
    .mission-card li { font-size: 12.5px; color: var(--text-dim); padding: 5px 0 5px 22px; position: relative; line-height: 1.5; }
    .mission-card li::before { content: '⚡'; position: absolute; left: 0; font-size: 11px; }

    .levels { margin-top: 22px; padding: 17px 18px; border-radius: 17px; background: var(--bg-card); border: 1px solid rgba(255,255,255,.07); }
    .levels h3 { font-size: 13.5px; font-weight: 800; margin-bottom: 12px; }
    .level-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 12.5px; }
    .level-row .name { font-weight: 700; }
    .level-row .name.active { color: var(--accent-bright); }
    .level-row .req { color: var(--text-dim); font-size: 11.5px; }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back-btn" aria-label="Retour"><i class="fas fa-arrow-left"></i></a>
    <div class="page-title">
      <h1>Ambassadeur ARVEXA</h1>
      <p>Le programme des élèves qui font grandir l'école</p>
    </div>
  </header>

  <div class="container" id="mainArea">
    <div class="loading-block"><i class="fas fa-circle-notch"></i><br>Chargement du programme…</div>
  </div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }
}
</script>
<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, onAuthStateChanged } from "firebase/auth";
  import {
    initializeFirestore, persistentLocalCache, persistentSingleTabManager,
    collection, doc, getDoc, getDocs, setDoc, addDoc, query, where,
    serverTimestamp, getFirestore
  } from "firebase/firestore";

  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
  });

  const $ = (id) => document.getElementById(id);
  const mainArea = $('mainArea');

  // ══════════════════════════════════════════════════════════════════
  // ⚡ CAPTURE ?ref=CODE — attribution parrainage (30 jours)
  // ══════════════════════════════════════════════════════════════════
  async function captureRef() {
    let code = null;
    try {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get('ref') || '').toUpperCase().trim();
      if (/^[A-Z0-9][A-Z0-9_-]{2,23}$/.test(raw)) {
        code = raw;
        localStorage.setItem('arvexaRef', JSON.stringify({ code, ts: Date.now() }));
        history.replaceState(null, '', window.location.pathname);
        // Traçage du clic (document anonyme, données minimales)
        try {
          await addDoc(collection(db, 'refClicks'), { code, ts: Date.now() });
        } catch (e) { /* règle refusée hors-ligne — non bloquant */ }
      }
    } catch (e) { /* no-op */ }
    if (!code) {
      try {
        const saved = JSON.parse(localStorage.getItem('arvexaRef') || 'null');
        if (saved && saved.code && (Date.now() - (saved.ts || 0)) < 30 * 24 * 60 * 60 * 1000) {
          code = saved.code;
        } else {
          localStorage.removeItem('arvexaRef');
        }
      } catch (e) { /* no-op */ }
    }
    return code;
  }

  const REF_CODE = await captureRef();

  // ══════════════════════════════════════════════════════════════════
  // VUES
  // ══════════════════════════════════════════════════════════════════

  function renderPublic(prefill = {}) {
    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="hero">
        <div class="hero-crown"><i class="fas fa-crown"></i></div>
        <h2>Deviens Ambassadeur</h2>
        <p class="lead">Partage ARVEXA autour de toi. Pour chaque abonnement payé par un élève que tu as
        invité, tu gagnes <b style="color:var(--accent-bright)">10 % de commission</b> — automatiquement, dès la confirmation du paiement.</p>
        <div class="perks">
          <div class="perk"><i class="fas fa-coins"></i><b>10 %</b><span>de commission</span></div>
          <div class="perk"><i class="fas fa-link"></i><b>Lien</b><span>personnel 30 j</span></div>
          <div class="perk"><i class="fas fa-medal"></i><b>Rangs</b><span>bronze → platine</span></div>
        </div>
      </div>
      <div class="criteria">
        <h3>Qui peut devenir ambassadeur ?</h3>
        <ul>
          <li>Un élève inscrit sur ARVEXA, actif sur le site</li>
          <li>Une connexion ou un groupe (classe, lycée, quartier) où partager</li>
          <li>Aucun diplôme requis — juste l'envie de faire réviser tes camarades</li>
        </ul>
      </div>
      <div class="form-card" id="formCard">
        <h3>Ma candidature</h3>
        <p class="sub">Réponse de l'équipe ARVEXA sous 48 h. Aucun paiement demandé, jamais.</p>
        <div class="field">
          <label for="appPhone">Numéro de téléphone (WhatsApp de préférence)</label>
          <input id="appPhone" type="tel" inputmode="tel" placeholder="+227 XX XX XX XX" autocomplete="tel">
        </div>
        <div class="field">
          <label for="appSchool">Établissement</label>
          <input id="appSchool" type="text" placeholder="Nom de ton lycée / collège" maxlength="80">
        </div>
        <div class="field">
          <label for="appMotivation">Pourquoi veux-tu devenir ambassadeur ?</label>
          <textarea id="appMotivation" placeholder="Ex : je connais beaucoup d'élèves de terminale et je partage déjà des exercices…" maxlength="500"></textarea>
        </div>
        <button class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> Envoyer ma candidature</button>
        <div class="form-msg" id="formMsg"></div>
      </div>`;
    mainArea.appendChild(wrap);

    if (prefill.establishment) $('appSchool').value = prefill.establishment;
    if (prefill.phone) $('appPhone').value = prefill.phone;

    $('submitBtn').addEventListener('click', () => submitApplication());
  }

  async function submitApplication() {
    const user = auth.currentUser;
    const msg = $('formMsg');
    const btn = $('submitBtn');
    if (!user) {
      try { sessionStorage.setItem('redirectAfterLogin', 'ambassadeur.html'); } catch (e) {}
      window.location.href = 'login.html';
      return;
    }
    const phone = $('appPhone').value.trim();
    const establishment = $('appSchool').value.trim();
    const motivation = $('appMotivation').value.trim();
    if (phone.replace(/\D/g, '').length < 8) {
      msg.className = 'form-msg error';
      msg.textContent = 'Entre un numéro de téléphone valide (au moins 8 chiffres).';
      return;
    }
    if (motivation.length < 15) {
      msg.className = 'form-msg error';
      msg.textContent = 'Dis-nous en quelques mots de plus (15 caractères minimum).';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi…';
    try {
      await setDoc(doc(db, 'ambassadorApplications', user.uid), {
        uid: user.uid,
        phone: phone.substring(0, 25),
        establishment: establishment.substring(0, 80),
        motivation: motivation.substring(0, 500),
        status: 'pending',
        submittedAt: serverTimestamp()
      }, { merge: true });
      renderPending();
    } catch (e) {
      console.error(e);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer ma candidature';
      msg.className = 'form-msg error';
      msg.textContent = 'Envoi impossible — vérifie ta connexion puis réessaie.';
    }
  }

  function renderPending(status = 'pending') {
    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="status-card">
        <i class="fas ${status === 'rejected' ? 'fa-circle-xmark' : 'fa-hourglass-half'} big"></i>
        <h3>${status === 'rejected' ? 'Candidature non retenue' : 'Candidature envoyée !'}</h3>
        <p>${status === 'rejected'
          ? "L'équipe a examiné ta candidature sans la retenir pour l'instant. Tu peux la soumettre à nouveau quand tu veux."
          : "L'équipe ARVEXA examine ta candidature — réponse sous 48 h.<br>Tu recevras ton code ambassadeur et ton lien personnel dès la validation."}</p>
      </div>
      <div class="criteria" style="margin-top:18px">
        <h3>En attendant, prépare ton terrain</h3>
        <ul>
          <li>Liste 10 camarades à qui tu veux présenter ARVEXA</li>
          <li>Prépare une démo : montre la Question du jour et le Chat ARV</li>
          <li>Note les groupes WhatsApp de ta classe où partager ton futur lien</li>
        </ul>
      </div>`;
    mainArea.appendChild(wrap);
    if (status === 'rejected') {
      const again = document.createElement('button');
      again.className = 'submit-btn';
      again.style.marginTop = '16px';
      again.innerHTML = '<i class="fas fa-rotate-right"></i> Soumettre une nouvelle candidature';
      again.addEventListener('click', () => loadPublicForUser());
      mainArea.appendChild(again);
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // DASHBOARD AMBASSADEUR
  // ══════════════════════════════════════════════════════════════════
  async function renderDashboard(amb) {
    const code = String(amb.code || '');
    const link = `${window.location.origin}/ambassadeur.html?ref=${code}`;
    const stats = amb.stats || {};
    let clicks = Number(stats.clicks || 0);
    let referrals = [];
    try {
      const snap = await getDocs(query(collection(db, 'referrals'), where('code', '==', code)));
      referrals = snap.docs.map((d) => d.data());
      if (clicks === 0) {
        try {
          const cSnap = await getDocs(query(collection(db, 'refClicks'), where('code', '==', code)));
          clicks = cSnap.size;
        } catch (e) { /* règle ou hors-ligne */ }
      }
    } catch (e) { /* hors-ligne : garde les valeurs du doc */ }

    const signups = referrals.length;
    const converted = referrals.filter((r) => r.status === 'converted').length;
    const earnings = Math.round(Number(amb.earnings || 0));
    const totalEarned = Math.round(Number(amb.totalEarned || earnings));
    const rank = converted >= 50 ? 'Platine 👑' : converted >= 15 ? 'Or 🥇' : converted >= 5 ? 'Argent 🥈' : 'Bronze 🥉';

    mainArea.replaceChildren();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="dash-hero">
        <div class="rank">Rang ${rank} · Commission 10 %</div>
        <h2>Salut, Ambassadeur 👑</h2>
        <p>Ton code personnel et ton lien d'invitation :</p>
        <div class="code-box">
          <div style="min-width:0">
            <div class="code">${code.replace(/</g, '&lt;')}</div>
            <span class="link-mini">${link.replace(/</g, '&lt;')}</span>
          </div>
          <i class="fas fa-award" style="color:var(--accent-bright);font-size:22px"></i>
        </div>
        <div class="share-row">
          <button class="share-btn wa" id="shareWa"><i class="fab fa-whatsapp"></i> Partager sur WhatsApp</button>
          <button class="share-btn copy" id="shareCopy"><i class="fas fa-copy"></i> Copier</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><i class="fas fa-hand-pointer"></i><b>${clicks}</b><span>visites de ton lien</span></div>
        <div class="stat-card"><i class="fas fa-user-plus"></i><b>${signups}</b><span>élèves inscrits</span></div>
        <div class="stat-card"><i class="fas fa-crown"></i><b>${converted}</b><span>abonnements convertis</span></div>
        <div class="stat-card earnings"><i class="fas fa-coins"></i><b>${earnings.toLocaleString('fr-FR')} FCFA</b><span>gains disponibles · total gagné : ${totalEarned.toLocaleString('fr-FR')} FCFA — retraits mobile money bientôt disponibles</span></div>
      </div>
      <div class="mission-card">
        <h3>Missions qui rapportent</h3>
        <ul>
          <li>Montre la <b>Question du jour</b> à 3 camarades aujourd'hui — c'est la fonction la plus accrocheuse</li>
          <li>Partage ton lien dans les groupes de classe le <b>vendredi soir</b> (pic d'activité)</li>
          <li>Aide un filleul à payer son premier abonnement : ta commission part de là</li>
          <li>5 conversions → rang <b>Argent</b>, 15 → <b>Or</b>, 50 → <b>Platine</b> (avantages exclusifs)</li>
        </ul>
      </div>
      <div class="levels">
        <h3>Tes rangs</h3>
        <div class="level-row"><span class="name${converted < 5 ? ' active' : ''}">🥉 Bronze</span><span class="req">0 conversion</span></div>
        <div class="level-row"><span class="name${converted >= 5 && converted < 15 ? ' active' : ''}">🥈 Argent</span><span class="req">5 conversions</span></div>
        <div class="level-row"><span class="name${converted >= 15 && converted < 50 ? ' active' : ''}">🥇 Or</span><span class="req">15 conversions</span></div>
        <div class="level-row"><span class="name${converted >= 50 ? ' active' : ''}">👑 Platine</span><span class="req">50 conversions</span></div>
      </div>
      <a href="marketplace.html" class="amb-cta" style="margin-top:22px">
        <i class="fas fa-bolt crown"></i>
        <div class="amb-cta-body"><h3>Voir la Marketplace</h3><p>Packs de requêtes IA et contenus premium.</p></div>
        <i class="fas fa-chevron-right arrow"></i>
      </a>`;
    mainArea.appendChild(wrap);

    const waText = encodeURIComponent(
      `👑 Rejoins ARVEXA avec mon lien ambassadeur : cours, quiz, examens corrigés et un tuteur IA — tout dans ton téléphone.\n${link}`
    );
    $('shareWa').addEventListener('click', () => {
      window.open(`https://wa.me/?text=${waText}`, '_blank', 'noopener');
    });
    $('shareCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(link);
        $('shareCopy').innerHTML = '<i class="fas fa-check"></i> Copié !';
        setTimeout(() => { $('shareCopy').innerHTML = '<i class="fas fa-copy"></i> Copier'; }, 2000);
      } catch (e) {
        window.prompt('Copie ton lien :', link);
      }
    });
  }

  // ══════════════════════════════════════════════════════════════════
  // ROUTAGE PRINCIPAL
  // ══════════════════════════════════════════════════════════════════
  async function loadPublicForUser() {
    const user = auth.currentUser;
    if (!user) { renderPublic(); return; }
    let prefill = {};
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) prefill = { establishment: snap.data().establishment || '' };
    } catch (e) { /* no-op */ }
    renderPublic(prefill);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { renderPublic(); return; }
    try {
      // 1. Ambassadeur validé → dashboard
      const ambSnap = await getDoc(doc(db, 'ambassadors', user.uid));
      if (ambSnap.exists() && ambSnap.data().status === 'active') {
        // 2. Attribution parrainage si visiteur invité (nouveau compte seulement)
        if (REF_CODE) await attributeReferral(user, REF_CODE);
        await renderDashboard(ambSnap.data());
        return;
      }
      // 2. Attribution parrainage si visiteur invité
      if (REF_CODE) await attributeReferral(user, REF_CODE);
      // 3. Candidature existante ?
      const appSnap = await getDoc(doc(db, 'ambassadorApplications', user.uid));
      if (appSnap.exists()) {
        const st = String(appSnap.data().status || 'pending');
        renderPending(st);
        return;
      }
      // 4. Vue publique avec formulaire
      loadPublicForUser();
    } catch (e) {
      console.error('Ambassadeur :', e);
      loadPublicForUser();
    }
  });

  // ══════════════════════════════════════════════════════════════════
  // ATTRIBUTION PARRAINAGE (client, nouveaux comptes seulement)
  // ══════════════════════════════════════════════════════════════════
  async function attributeReferral(user, code) {
    try {
      // Garde : compte récent (< 14 jours) sans referredBy déjà posé
      const creationMs = user.metadata?.creationTime ? new Date(user.metadata.creationTime).getTime() : 0;
      if (creationMs && (Date.now() - creationMs) > 14 * 24 * 60 * 60 * 1000) return;
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (snap.exists() && snap.data().referredBy) return;
      await setDoc(userRef, { referredBy: code }, { merge: true });
      await addDoc(collection(db, 'referrals'), {
        newUid: user.uid,
        code,
        status: 'registered',
        createdAt: serverTimestamp()
      });
      localStorage.removeItem('arvexaRef');
    } catch (e) {
      console.warn('Attribution parrainage :', e.message);
    }
  }
</script>
<script src="register-sw.js" defer></script>
<script src="install-banner.js" defer></script>
</body>
